        rationale: Data-protection assessments and governance oversight directly support identifying matters
          requiring specialist data-protection advice and coordinating the necessary governance input.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 4.8.03
      statement: You should identify who will be responsible for managing contracts related to the TRE.
      guidance: These contracts may include data sharing agreements, secondments of personnel or limitations
        on how results obtained with the data can be distributed.
      importance: Recommended
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-f28b720cce80472ebb8aeb05b2ba6936
