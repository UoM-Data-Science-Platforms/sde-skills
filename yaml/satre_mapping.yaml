        regulatory-compliance:
        - ethics-research-approval-systems
        - healthcare-data-security-frameworks
        - healthcare-standards-compliance
        security-management:
        - security-controls-implementation
        - incident-response-management
- id: computing-technology
  name: 2. Computing Technology
  components:
  - id: '2.1'
    name: End user computing
    requirement: TREs must provide a secure, managed computing environment for researchers
      including controlled desktops or virtual workspaces, approved analysis tools,
      restricted internet access, and technical prevention of unauthorised data egress
      via removable media or uncontrolled network routes.
    mappings:
      safe-technology-engineering:
        software-engineering:
        - code-documentation-reusability
        - software-development-lifecycle
        - microservices-api-design
        - testing-quality-assurance
        system-architecture:
        - vulnerability-patch-management
        - component-based-architecture
        infrastructure-deployment:
        - containerisation-orchestration
        - network-architecture
      safe-access-identity:
        identity-management:
        - federated-identity-management
        access-control:
        - role-based-access-control
      safe-projects-operations:
        operational-excellence:
        - continuous-improvement
        research-support-innovation:
        - tre-tools-capabilities
        - researcher-training-support
      safe-governance-compliance:
        security-management:
        - security-assessment-testing
        - incident-response-management
  - id: '2.2'
    name: Software tools & applications
    requirement: TREs must provide and maintain a curated catalogue of software tools
      appropriate to the research being conducted. All tools must be approved, licenced,
      and security-assessed. The catalogue must be managed to prevent introduction
      of vulnerabilities or unauthorised data extraction capabilities.
    mappings:
      safe-technology-engineering:
        software-engineering:
        - artefact-management
        - code-documentation-reusability
        - microservices-api-design
        - testing-quality-assurance
        - software-development-lifecycle
        system-architecture:
        - vulnerability-patch-management
        - component-based-architecture
        infrastructure-deployment:
        - containerisation-orchestration
        - network-architecture
      safe-data-management:
        data-engineering-processing:
        - event-driven-data-processing
        - data-retention-disposal
      safe-outputs-disclosure-control:
        statistical-disclosure-control:
        - automated-disclosure-control
        output-checking:
        - output-review-processes
      safe-projects-operations:
        research-support-innovation:
        - tre-tools-capabilities
        - researcher-training-support
      safe-governance-compliance:
        security-management:
        - security-assessment-testing
  - id: '2.3'
    name: Infrastructure management
    requirement: "TREs must manage their underlying technical infrastructure \u2014\
      \ compute, storage, and networking \u2014 in a secure, auditable, and resilient\
      \ manner. This includes patch management, configuration management, change control,\
      \ capacity planning, and continuous infrastructure monitoring."
    mappings:
      safe-technology-engineering:
        system-architecture:
        - component-based-architecture
        infrastructure-deployment:
        - cloud-infrastructure-management
        - encryption-key-management
        - containerisation-orchestration
        - network-architecture
        software-engineering:
        - code-documentation-reusability
        - microservices-api-design
      safe-access-identity:
        identity-management:
        - federated-identity-management
      safe-projects-operations:
        operational-excellence:
        - documentation-knowledge-management
        - continuous-improvement
        research-support-innovation:
        - researcher-training-support
        - community-engagement-networking
      safe-governance-compliance:
        regulatory-compliance:
        - healthcare-data-security-frameworks
        - healthcare-standards-compliance
        security-management:
        - security-assessment-testing
        - incident-response-management
  - id: '2.4'
    name: Data ingestion & egress
    requirement: TREs must implement controlled, logged, and auditable processes for
      bringing data into the environment and releasing approved outputs. Unauthorised
      data movement must be technically prevented. All transfers must be reviewed
      and authorised, with a complete audit trail maintained.
    mappings:
      safe-technology-engineering:
        system-architecture:
        - vulnerability-patch-management
        infrastructure-deployment:
        - cloud-infrastructure-management
        - network-architecture
        software-engineering:
