                - Storage lifecycle management
                search_terms:
                - Health data chargeback models
                - SDE FinOps optimization
                why: Need to assign costs to specific research grants or projects accurately.
            senior:
              core_concepts:
              - topic: Financial Strategy for SDEs
                concepts:
                - Enterprise FinOps
                - Funding models
                - Cost-benefit analysis of infrastructure
                search_terms:
                - SDE financial sustainability
