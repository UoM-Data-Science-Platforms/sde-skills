    ethics-research-governance:
      id: ethics-research-governance
      name: Ethics & Research Governance
      description: Ethics & Research Governance maintains the ethical integrity of research activities involving sensitive
        healthcare data. This subdomain encompasses ensuring adherence to ethical principles and requirements, managing data
        subject consent throughout the research lifecycle, and facilitating thorough ethical review processes that collectively
        ensure research is conducted responsibly while respecting patient rights, maintaining public trust, and supporting
        scientific integrity.
      competencies:
        research-ethics-compliance:
          id: research-ethics-compliance
          name: Research Ethics Compliance
          description: Ensures research activities adhere to ethical principles and requirements. Involves understanding ethics
            principles, following approval processes, implementing frameworks, conducting assessments, ensuring compliance,
            developing enterprise strategies, and establishing governance to enhance ethical research practices across the
            organisation.
          levels:
            entry:
              id: research-ethics-compliance-entry
              name: Entry Level
              skills:
              - Explains basic research ethics principles and governance expectations
              - Follows institutional research ethics approval and governance workflows
              - Can follow established research ethics procedures
              qualifications:
              - issuer: NIHR
                description: Good Clinical Practice (GCP) Certification (Course)
                career_impact: Mandatory standard for understanding ethics in clinical research.
              core_concepts:
              - topic: Principles of Research Ethics
                concepts:
                - Ethics Principles
                - Governance Expectations
                - Approval Workflows
                search_terms:
                - Health research ethics principles UK
                - Following NHS ethics workflows
                why: Entry staff must understand the boundaries of acceptable data use to prevent ethical violations.
            mid:
              id: research-ethics-compliance-mid
              name: Mid Level
              skills:
              - Implements research ethics frameworks and processes
              - Conducts research ethics assessments and reviews
              - Ensures research activities comply with ethical requirements
              qualifications: []
              core_concepts:
              - topic: Enforcing Ethical Frameworks
                concepts:
                - Ethics Assessments
                - Compliance Verification
                - Process Implementation
                search_terms:
                - Conducting research ethics assessments
                - Verifying ethics compliance SDE
                why: Responsible for translating broad ethical principles into concrete checks and balances within the research
                  pipeline.
            senior:
              id: research-ethics-compliance-senior
              name: Senior Level
              skills:
              - Develops enterprise research ethics strategies
              - Establishes research ethics governance and oversight
              - Leads research ethics enhancement initiatives
              qualifications: []
              core_concepts:
              - topic: Strategic Research Ethics
                concepts:
                - Enterprise Ethics Strategies
                - Oversight Governance
                - Enhancement Initiatives
                search_terms:
                - Enterprise research ethics governance
                - Health data ethics strategy
                why: Necessary to ensure the institution maintains public trust while operating massive research databases.
        consent-management:
          id: consent-management
          name: Consent Management
          description: Manages processes for obtaining, recording, and honouring data subject consent. Involves understanding
            consent requirements, verifying documentation, implementing management systems, ensuring research activities align
            with consent parameters, developing enterprise strategies, and establishing governance frameworks to enhance consent
            practices.
          levels:
            entry:
              id: consent-management-entry
              name: Entry Level
              skills:
              - Describes participant consent concepts and regulatory requirements
              - Verifies participant consent forms and documentation against study protocols
              - Can implement basic consent management procedures (e.g. verifying withdrawal requests)
              qualifications: []
              core_concepts:
              - topic: Consent Verification
                concepts:
                - Participant Consent Concepts
                - Regulatory Requirements
                - Withdrawal Requests
                search_terms:
                - Verifying participant consent health data
                - Managing consent withdrawal SDE
                why: Ensures that individual patient rights, including opting out, are respected at the ground level.
            mid:
              id: consent-management-mid
              name: Mid Level
              skills:
              - Designs and implements consent management systems
              - Ensures research activities align with consent parameters
              - Conducts consent compliance reviews and assessments
              qualifications:
              - issuer: IAPP
                description: CIPP/E (Exam)
                career_impact: Navigating complex lawful bases for processing health data under GDPR.
              core_concepts:
              - topic: Consent System Implementation
                concepts:
                - Consent Management Systems
                - Compliance Reviews
                - Parameter Alignment
                search_terms:
                - Implementing consent management system healthcare
                - Consent compliance assessment SDE
                why: Mid-level engineers build and maintain the technical mechanisms that enforce complex consent rules dynamically.
            senior:
              id: consent-management-senior
              name: Senior Level
              skills:
              - Develops enterprise consent management strategies
              - Establishes consent governance frameworks and processes
              - Leads consent management enhancement initiatives
              qualifications: []
              core_concepts:
              - topic: Enterprise Consent Strategy
                concepts:
                - Consent Governance Frameworks
                - Dynamic Consent Strategies
                - Enhancement Initiatives
                search_terms:
                - Dynamic consent strategy healthcare
                - Enterprise consent governance SDE
                why: Essential for guiding the organizational approach to patient permissions across multi-tenant, federated
                  SDE environments.
        ethical-review-processes:
          id: ethical-review-processes
          name: Ethical Review Processes
          description: Facilitates the assessment of research proposals against ethical standards. Involves preparing documentation
            for review submissions, coordinating complex submissions, implementing tracking systems, ensuring compliance with
            approvals, developing streamlined frameworks, and leading initiatives to enhance the efficiency and effectiveness
            of ethical review processes.
          levels:
            entry:
              id: ethical-review-processes-entry
              name: Entry Level
              skills:
              - Outlines ethical review requirements and standard submission processes
              - Prepares and reviews documentation required for ethical committee submissions
              - Can prepare basic ethical review submissions
              qualifications: []
              core_concepts:
              - topic: Ethical Review Preparation
                concepts:
                - Review Requirements
                - Standard Submission Processes
                - Committee Documentation
                search_terms:
                - Preparing ethics committee submissions NHS
                - Standard ethical review process healthcare
                why: Provides the foundational support needed to get research projects through the ethical approval pipeline
                  efficiently.
            mid:
              id: ethical-review-processes-mid
              name: Mid Level
              skills:
              - Coordinates complex ethical review submissions
              - Implements systems for tracking ethical approvals
              - Ensures research activities comply with ethical approvals
              qualifications: []
              core_concepts:
              - topic: Coordinating Complex Submissions
                concepts:
                - Complex Submissions
                - Tracking Approvals
                - Compliance Assurance
                search_terms:
                - Coordinating complex ethics submissions
                - Tracking ethical approvals SDE
                why: Mid-level staff ensure that overlapping, multi-faceted research requests are properly assessed and tracked
                  within the SDE.
            senior:
              id: ethical-review-processes-senior
              name: Senior Level
              skills:
              - Develops streamlined ethical review frameworks
              - Establishes ethical review governance and oversight
              - Leads initiatives to enhance ethical review processes
              qualifications: []
              core_concepts:
              - topic: Optimizing Review Frameworks
                concepts:
                - Streamlined Frameworks
                - Review Governance
                - Process Enhancement
                search_terms:
                - Streamlining ethical review processes
                - Governance of ethical reviews health data
                why: Senior leaders optimize the review lifecycle, removing bottlenecks while ensuring uncompromised ethical
