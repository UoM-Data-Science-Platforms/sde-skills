- id: data-management
  name: 3. Data Management
  components:
  - id: '3.1'
    name: Data security levels & tiering
    requirement: TREs must classify all data according to sensitivity and apply tiered
      security controls appropriate to each classification level. Controls must cover
      access restrictions, network isolation, audit requirements, and output checking
      stringency, all proportionate to the sensitivity and re-identification risk
      of the data.
    mappings:
      safe-technology-engineering:
        system-architecture:
        - secure-environment-design
        - component-based-architecture
        - configuration-management
        infrastructure-deployment:
        - encryption-key-management
        - network-architecture
      safe-data-management:
        data-engineering-processing:
        - data-storage-database-management
        - event-driven-data-processing
        - data-retention-disposal
        data-governance:
        - data-classification-sensitivity
        - data-quality-management
      safe-access-identity:
        identity-management:
