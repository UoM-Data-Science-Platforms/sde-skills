    access-control:
      id: access-control
      name: Access Control
      description: Access Control ensures that only authorised individuals can access specific resources within secure data
        environments through structured permission systems. This subdomain covers role-based and attribute-based access models
        as well as least privilege implementation, providing robust security frameworks that enforce authorisation policies
        while balancing operational requirements and minimising access risks across research environments.
      competencies:
        role-based-access-control:
          id: role-based-access-control
          name: Role-Based Access Control
          description: Implements access permissions based on organisational roles within secure data environments. Involves
            defining appropriate roles, designing organisational role structures, implementing management processes, and conducting
            reviews. Requires skills to develop enterprise frameworks and optimise role structures to minimise access risks
            while meeting business needs.
          levels:
            entry:
              id: role-based-access-control-entry
              name: Entry Level
              skills:
              - Explains role-based access control (RBAC) concepts and principles
              - Assigns predefined roles and manages role permissions under guidance
              - Can implement basic role assignments following established patterns
              - Can understand existing role definitions
              qualifications:
              - issuer: AWS
                description: AWS Certified Cloud Practitioner (Exam)
                career_impact: Introduces basic AWS IAM and role concepts.
              core_concepts:
              - topic: RBAC Fundamentals
                concepts:
                - Predefined roles
                - Role permissions
                - Basic assignments
                search_terms:
                - RBAC basics Azure NHS
                - Role assignment Secure Data Environment
                why: RBAC ensures researchers only see data relevant to their specific approved study.
            mid:
              id: role-based-access-control-mid
              name: Mid Level
              skills:
              - Implements role structures appropriate to organisational needs
              - Implements role management and governance processes
              - Conducts role reviews and recommends improvements
              - Can modify/troubleshoot existing role definitions queries.
              qualifications:
              - issuer: AWS
                description: AWS Certified SysOps Administrator - Associate (Exam)
                career_impact: Hands-on implementation of IAM policies, roles, and boundaries for research environments.
              - issuer: Microsoft
                description: 'Microsoft Certified: Azure Security Engineer Associate (AZ-500) (Exam)'
                career_impact: Deep dive into Azure RBAC to secure sensitive healthcare datasets.
              core_concepts:
              - topic: RBAC Implementation & Governance
                concepts:
                - Role structures
                - Role reviews
                - Governance processes
                search_terms:
                - Implementing RBAC for health data platforms
                - Role governance SDE
                why: Continuous review of roles prevents privilege creep in sensitive environments.
            senior:
              id: role-based-access-control-senior
              name: Senior Level
              skills:
              - Develops enterprise RBAC frameworks and strategies
              - Implements advanced access governance and role mining
              - Leads initiatives to optimise role structures and reduce access risk
              - Can lead new role definitions implementation and support.
              qualifications:
              - issuer: ISACA
                description: CISM (Certified Information Security Manager) (Exam)
                career_impact: Governing enterprise RBAC strategies and reducing access risk.
              core_concepts:
              - topic: Enterprise RBAC Strategy
                concepts:
                - Enterprise RBAC frameworks
                - Role mining
                - Access risk reduction
                search_terms:
                - Enterprise RBAC strategy healthcare
                - Role mining for NHS data platforms
                why: Strategic RBAC minimizes blast radius in the event of a breach and ensures regulatory compliance.
        attribute-based-access-control:
          id: attribute-based-access-control
          name: Attribute-Based Access Control
          description: Implements dynamic, context-aware access control using attributes rather than roles. Requires defining
            policies based on various attribute types, designing controls for different contexts, evaluating their effectiveness,
            and developing advanced policy models for complex scenarios. Involves leading initiatives to implement dynamic
            access management across the organisation.
          levels:
            entry:
              id: attribute-based-access-control-entry
              name: Entry Level
              skills:
              - Explains attribute-based access control (ABAC) concepts and use cases
              - Identifies attribute types and interprets access control policy definitions
              - Can implement simple attribute-based policies
              qualifications: []
              core_concepts:
              - topic: ABAC Basics
                concepts:
                - Dynamic access control
                - Attribute types
                - Simple policy implementation
                search_terms:
                - ABAC vs RBAC healthcare
                - Implementing simple ABAC policies
                why: ABAC allows granular access control based on context (e.g., location, time) which is critical for health
                  data access.
            mid:
              id: attribute-based-access-control-mid
              name: Mid Level
              skills:
              - Designs complex ABAC policies for different contexts
              - Implements attribute management and policy enforcement
              - Evaluates effectiveness of attribute-based controls
              qualifications:
              - issuer: HashiCorp
                description: 'HashiCorp Certified: Vault Associate (Exam)'
                career_impact: Relevant for implementing dynamic, attribute-driven secrets and access management.
              core_concepts:
              - topic: Complex ABAC Policies
                concepts:
                - Context-aware policies
                - Policy enforcement
                - Control evaluation
                search_terms:
                - Designing ABAC policies for Secure Data Environments
                - Context-aware access healthcare
                why: Mid-level implementation of ABAC secures data sets dynamically based on researcher accreditation status
                  and project.
            senior:
              id: attribute-based-access-control-senior
              name: Senior Level
              skills:
              - Architects enterprise ABAC strategies and frameworks
              - Develops advanced policy models for complex authorisation scenarios
              - Leads initiatives to implement dynamic access control
              qualifications:
              - issuer: ISC2
                description: CCSP (Certified Cloud Security Professional) (Exam)
                career_impact: Designing advanced policy models and dynamic access controls in multi-tenant cloud environments.
              core_concepts:
              - topic: Enterprise ABAC Architecture
                concepts:
                - Enterprise ABAC frameworks
                - Advanced policy models
                - Dynamic access management
                search_terms:
                - Enterprise ABAC architecture NHS
                - Dynamic access control scale SDE
                why: Senior architects use ABAC to solve complex, multi-jurisdictional health data sharing requirements.
        least-privilege-implementation:
          id: least-privilege-implementation
          name: Least Privilege Implementation
          description: Ensures users and systems have only the minimum access privileges needed for their functions. Involves
            identifying excessive permissions, implementing appropriate access models, conducting reviews, and designing attestation
            processes. Requires developing enterprise-wide strategies and implementing tools to maintain effective privilege
            governance throughout the organisation.
          levels:
            entry:
              id: least-privilege-implementation-entry
              name: Entry Level
              skills:
              - Explains the principle of least privilege and its application
              - Identifies privileged access management (PAM) controls and escalation workflows
              - Can identify excessive permissions in simple scenarios
              - Understand existing role-level security
              qualifications:
              - issuer: GIAC
                description: GIAC Information Security Fundamentals (GISF) (Exam)
                career_impact: Strong emphasis on the principle of least privilege from day one.
              core_concepts:
              - topic: PoLP & PAM Basics
                concepts:
                - Principle of Least Privilege
                - Privileged Access Management (PAM)
                - Role-level security basics
                search_terms:
                - Least privilege healthcare data
                - PAM basics Azure
                why: Restricting access to only what is necessary is a fundamental tenet of protecting patient data.
            mid:
              id: least-privilege-implementation-mid
              name: Mid Level
              skills:
              - Implements least privilege access models across systems
              - Conducts privilege reviews and recommends right-sizing
              - Designs processes for regular privilege attestation
              - Support existing role-level security policy
              qualifications:
              - issuer: CyberArk
                description: CyberArk Defender & Sentry (Exam)
                career_impact: Implementing privileged access management (PAM) and just-in-time access for SDE administrators.
              core_concepts:
              - topic: Privilege Management & Reviews
                concepts:
                - Privilege reviews
                - Right-sizing
                - Privilege attestation
                search_terms:
                - Privilege attestation SDE
                - Right-sizing permissions health data
                why: Regular attestation ensures permissions haven't expanded beyond approved research boundaries.
            senior:
              id: least-privilege-implementation-senior
              name: Senior Level
              skills:
              - Develops enterprise privilege management strategies
              - Implements advanced tools for privilege discovery and management
              - Leads initiatives to mature privilege governance practices
              - Leads audit, implementation involving role-level security.
              qualifications:
              - issuer: GIAC
                description: GIAC Defensible Security Architecture (GDSA) (Exam)
                career_impact: Architecting zero-trust networks that enforce least privilege by default.
              core_concepts:
              - topic: Enterprise Privilege Strategy
                concepts:
                - Privilege discovery tools
                - Privilege governance
                - Role-level security audit
                search_terms:
                - Enterprise PAM strategy healthcare
                - Privilege discovery NHS SDE
                why: Strategic management of highly privileged accounts mitigates the highest risks to the SDE.
