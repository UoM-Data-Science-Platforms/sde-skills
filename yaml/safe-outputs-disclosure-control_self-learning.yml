            senior:
              core_concepts:
              - topic: Emergency Response Design
                concepts:
                - Response Playbooks
                - Regulatory Compliance
                - Long-term Mitigation
                search_terms:
                - Data breach response plan design
                - SDE emergency playbook
                why: Designing the organizational capability to withstand and respond to severe breaches.
