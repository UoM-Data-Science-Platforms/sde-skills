    operational-excellence:
      id: operational-excellence
      name: Operational Excellence
      description: Operational Excellence establishes consistent, high-quality service
        delivery within secure data environments. This subdomain encompasses systematic
        continuous improvement of processes and services using methodologies like
        Lean and Six Sigma, comprehensive documentation and knowledge management that
        preserves operational expertise, and robust monitoring and observability practices
        that provide insight into system health, performance, and security status
        while enabling proactive management of the environment.
      tools: []
      technologies: []
      standards: []
      competencies:
        continuous-improvement:
          id: continuous-improvement
          name: Continuous Improvement
          description: Systematically enhances SDE processes, services, and capabilities.
            Involves understanding improvement concepts, identifying opportunities,
            implementing initiatives, applying methodologies like Lean and Six Sigma,
            measuring outcomes, establishing improvement cultures, developing enterprise
            strategies, and leading transformational programmes across the organisation.
          levels:
            entry:
              id: continuous-improvement-entry
              name: Entry Level
              skills:
              - Explains continuous improvement principles and methodologies
              - Identifies core principles of continuous improvement methodologies
                (e.g. Lean, Plan-Do-Check-Act)
              - Can identify opportunities for process improvement
              core_concepts:
              - topic: Improvement Basics
                concepts:
                - PDCA cycle
                - Lean concepts
                - Identifying bottlenecks
                search_terms:
                - Continuous improvement IT
                - Lean methodology basics
                why: Recognizing inefficiencies in daily work.
              qualifications:
              - Lean Six Sigma Yellow Belt
            mid:
              id: continuous-improvement-mid
              name: Mid Level
              skills:
              - Implements continuous improvement initiatives
              - Applies appropriate methodologies to enhance processes
              - Measures and reports on improvement outcomes
              core_concepts:
              - topic: Process Optimization
                concepts:
                - Value stream mapping
                - Automating manual checks
                - Metrics-driven improvement
                search_terms:
                - SDE process optimization
                - Healthcare IT Lean
                why: Applying methodologies to streamline complex workflows like data
                  ingress.
              qualifications:
