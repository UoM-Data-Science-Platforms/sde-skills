mapping_methodology:
  unit: One competency contribution to one official SATRE requirement.
  direct: The competency explicitly performs an activity specified by the requirement; this does not assert
    full requirement satisfaction.
  supporting: The competency enables the activity without explicitly defining the required task or its
    complete scope.
  unmapped: No sufficiently specific competency contribution identified; recorded as a framework-gap observation.
  applicability: Generic framework review only. Conditional source wording is retained; no deployment-specific
    exclusions have been asserted.
  legacy: Original capability-level candidates are retained as rejected/superseded audit records, never
    displayed. Requirement-specific reviewed links replace them.
  pilot:
  - '1.6'
  - '3.1'
  - '3.2'
