    security-management:
      id: security-management
      name: Security Management
      description: Security Management establishes and maintains protections for data assets and systems within secure research
        environments. This subdomain focuses on implementing comprehensive technical, administrative, and physical security
        controls, conducting regular assessments and testing to verify effectiveness, and managing incident response processes
        that collectively ensure research data remains protected from unauthorised access or breaches while enabling appropriate
        recovery and improvement from security events.
      competencies:
        security-controls-implementation:
          id: security-controls-implementation
          name: Security Controls Implementation
          description: Deploys technical, administrative, and physical safeguards to protect data and systems. Involves understanding
            control concepts, implementing basic and comprehensive security frameworks, evaluating effectiveness, mapping
            to compliance requirements, developing enterprise strategies, and leading maturity initiatives across the organisation.
          levels:
            entry:
              id: security-controls-implementation-entry
              name: Entry Level
              skills:
              - Classifies security control types, categories, and functions
              - Identifies common security controls and explains their risk reduction purpose
              - Can implement basic security controls following guidelines (e.g. password policies, firewall rules)
              qualifications:
              - issuer: CompTIA
                description: CompTIA Security+ (Exam)
                career_impact: Implementing basic technical controls.
              core_concepts:
              - topic: Security Control Fundamentals
                concepts:
                - Password Policies
                - Firewall Rules
                - Control Classification
                search_terms:
                - Basic security controls health data
                - Implementing SDE firewall rules
                why: Understanding basic administrative and technical safeguards is critical for minimizing risks to SDE environments.
            mid:
              id: security-controls-implementation-mid
              name: Mid Level
              skills:
              - Designs and implements comprehensive security control frameworks
              - Evaluates effectiveness and suitability of security controls
              - Maps controls to specific compliance requirements (e.g. GDPR Article 32, ISO 27001 Annex A)
              qualifications:
              - issuer: GIAC
                description: GIAC Security Essentials (GSEC) (Exam)
                career_impact: Hands-on implementation of comprehensive defense-in-depth controls.
              core_concepts:
              - topic: Comprehensive Control Frameworks
                concepts:
                - GDPR Article 32 Mapping
                - ISO 27001 Annex A
                - Control Effectiveness Evaluation
                search_terms:
                - Mapping controls to GDPR Article 32
                - ISO 27001 implementation SDE
                why: Mid-level security engineers must translate regulatory requirements into concrete, comprehensive technical
                  safeguards.
            senior:
              id: security-controls-implementation-senior
              name: Senior Level
              skills:
              - Develops enterprise security control strategies
              - Establishes security control governance and oversight
              - Leads security control maturity initiatives
              qualifications:
              - issuer: ISC2
                description: CISSP (Exam)
                career_impact: Designing the enterprise-wide security control framework.
              core_concepts:
              - topic: Enterprise SDE Security Strategy
                concepts:
                - Security Governance
                - Maturity Initiatives
                - Enterprise Control Strategies
                search_terms:
                - Enterprise security controls SDE
                - Security governance framework health data
                why: Essential for directing the overarching security posture, ensuring that implemented controls align with
                  long-term strategic and compliance goals.
        security-assessment-testing:
          id: security-assessment-testing
          name: Security Assessment & Testing
          description: Evaluates the effectiveness of security controls through testing and analysis. Involves understanding
            assessment methodologies, conducting vulnerability scanning and penetration testing, analysing results, prioritising
            remediation, implementing testing programmes, and establishing governance frameworks to mature assessment capabilities.
          levels:
            entry:
              id: security-assessment-testing-entry
              name: Entry Level
              skills:
              - Describes security assessment methodologies and testing approaches
              - Distinguishes between vulnerability scanning, vulnerability assessments, and penetration testing
              - Can assist with security assessments following established procedures (e.g. running vulnerability scans, documenting
                findings)
              qualifications:
              - issuer: CompTIA
                description: CompTIA PenTest+ (Exam)
                career_impact: Fundamentals of vulnerability scanning and basic penetration testing.
              core_concepts:
              - topic: Basics of Security Assessments
                concepts:
                - Vulnerability Scanning
                - Penetration Testing Differences
                - Documenting Findings
                search_terms:
                - Vulnerability scanning healthcare systems
                - Difference between vulnerability scan and pentest
                why: Provides the foundational skills needed to identify and record potential security gaps in health data
                  systems.
            mid:
              id: security-assessment-testing-mid
              name: Mid Level
              skills:
              - Conducts comprehensive security assessments and testing
              - Analyses security assessment results and prioritises remediation
              - Implements security testing programmes and schedules
              qualifications:
              - issuer: OffSec
                description: OSCP (Offensive Security Certified Professional) (Practical Exam)
                career_impact: Rigorous, hands-on vulnerability assessment for critical SDE infrastructure.
              - issuer: CREST
                description: CREST Practitioner Security Analyst (CPSA) (Exam)
                career_impact: UK-recognized standard for infrastructure testing.
              core_concepts:
              - topic: Active Security Testing in SDEs
                concepts:
                - Comprehensive Assessments
                - Remediation Prioritisation
                - Testing Programmes
                search_terms:
                - Penetration testing secure data environments
                - Prioritising vulnerabilities health data
                why: Mid-level testers must execute complex assessments and make informed decisions on which vulnerabilities
                  present the highest risk to patient data.
            senior:
              id: security-assessment-testing-senior
              name: Senior Level
              skills:
              - Develops enterprise security assessment strategies
              - Establishes security testing governance and methodologies
              - Leads security assessment maturity initiatives
              qualifications:
              - issuer: CREST
                description: CREST Certified Infrastructure Tester (CCT Inf) (Practical Exam)
                career_impact: Leading advanced red-team exercises against SDE perimeters.
              core_concepts:
              - topic: Strategic Security Testing Methodologies
                concepts:
                - Enterprise Testing Strategies
                - Red Teaming Oversight
                - Maturity Initiatives
                search_terms:
                - Enterprise security testing strategy SDE
                - Red teaming healthcare infrastructure
                why: Senior leaders establish the testing governance required to continuously validate SDE resilience against
                  sophisticated threats.
        incident-response-management:
          id: incident-response-management
          name: Incident Response Management
          description: Prepares for and manages security incidents effectively to minimise impact. Involves understanding
            incident response procedures, classifying and reporting incidents, implementing response plans, leading investigations,
            analysing for improvement, developing enterprise strategies, and enhancing response capabilities across the organisation.
          levels:
            entry:
              id: incident-response-management-entry
              name: Entry Level
              skills:
              - Outlines incident response phases, escalation procedures, and reporting
              - Classifies security incidents according to severity thresholds and reporting criteria
              - Can assist with incident response following established protocols
              qualifications:
              - issuer: CompTIA
                description: CompTIA CySA+ (Cybersecurity Analyst) (Exam)
                career_impact: Triage and basic incident analysis.
              core_concepts:
              - topic: Incident Triage and Escalation
                concepts:
                - Incident Classification
                - Severity Thresholds
                - Reporting Criteria
                search_terms:
                - NHS security incident reporting
                - Cyber incident triage healthcare
                why: Fast and accurate classification of incidents is vital for protecting sensitive health data during a
                  breach.
            mid:
              id: incident-response-management-mid
              name: Mid Level
              skills:
              - Implements incident response plans and procedures
              - Leads incident investigations and coordinates response activities
              - Analyses incidents for lessons learned and improvement opportunities
              qualifications:
              - issuer: GIAC
                description: GIAC Certified Incident Handler (GCIH) (Exam)
                career_impact: Managing the complete incident response lifecycle during a breach attempt.
              core_concepts:
              - topic: Leading SDE Investigations
                concepts:
                - Incident Response Procedures
                - Investigation Coordination
                - Lessons Learned Analysis
                search_terms:
                - Health data breach investigation
                - Incident response plan implementation SDE
                why: Mid-level responders manage active threats, coordinate containment, and drive post-incident improvements
                  in the SDE.
            senior:
              id: incident-response-management-senior
              name: Senior Level
              skills:
              - Develops enterprise incident response strategies
              - Establishes incident response governance and oversight
              - Leads incident response capability enhancement initiatives
              qualifications:
              - issuer: ISACA
                description: CISM (Certified Information Security Manager) (Exam)
                career_impact: Governing the enterprise incident response strategy and external reporting (ICO, NHS England).
              core_concepts:
              - topic: Enterprise Incident Strategy
                concepts:
                - Capability Enhancement
                - Enterprise Response Strategies
                - Executive Oversight
                search_terms:
                - Enterprise incident response governance NHS
                - Strategic cyber resilience health data
                why: Senior roles must build resilient organizational structures that can survive and recover from major healthcare
                  cyber events.
