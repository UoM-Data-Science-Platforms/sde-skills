domain:
  index: 1
  main-color: color-nhs-blue
  id: safe-access-identity
  name: Safe Access & Identity
  description: This domain covers all aspects of user authentication, authorisation, and access control within Secure Data
    Environments, ensuring that only authorised users can access appropriate resources.
  source_file: safe_access_identity.md
  subdomains:
    identity-management:
      id: identity-management
      name: Identity Management
      description: Identity Management encompasses the systems and processes that govern user digital identities within secure
        data environments. This subdomain covers the complete lifecycle of authentication credentials, from verification mechanisms
        and account provisioning to cross-organisational federation, ensuring that only properly authenticated users can access
        sensitive research data while maintaining security, operational efficiency, and compliance with organisational policies.
      competencies:
        authentication-systems:
          id: authentication-systems
          name: Authentication Systems
          description: Implements and maintains secure user verification mechanisms within research environments. Involves
            designing and configuring authentication protocols, password policies, and MFA solutions while troubleshooting
            security incidents. Requires the ability to evaluate technologies and architect enterprise-wide authentication
            strategies aligned with organisational security needs.
          levels:
            entry:
              id: authentication-systems-entry
              name: Entry Level
              skills:
              - Explains basic authentication concepts and mechanisms (e.g. Microsoft Entra ID, Kerberos, OAuth 2.0 / OIDC)
              - Applies password best practices and configures multi-factor authentication (MFA)
              - Can configure user accounts in identity systems under supervision
              - Can understand existing SDE security Matrix.
              qualifications:
              - issuer: CompTIA
                description: CompTIA Security+ (Exam)
                career_impact: Validates foundational knowledge of identity and access management principles essential for
                  SDE entry roles.
              - issuer: Microsoft
                description: 'Microsoft Certified: Security, Compliance, and Identity Fundamentals (SC-900) (Exam)'
                career_impact: Provides baseline understanding of Entra ID, widely used in NHS SDE authentication.
              core_concepts:
              - topic: SDE Authentication Fundamentals
                concepts:
                - MFA
                - Entra ID
                - Kerberos
                - OAuth 2.0 / OIDC
                - SDE Security Matrix
                search_terms:
                - Azure Entra ID health data authentication
                - MFA configuration NHS SDE
                - OIDC for clinical apps
                why: Understanding basic authentication is critical to preventing unauthorized access to health data.
            mid:
              id: authentication-systems-mid
              name: Mid Level
              skills:
              - Implements and configures secure authentication systems (e.g. SDE security matrix, Microsoft Entra ID)
              - Implements MFA solutions appropriate to security requirements
              - Troubleshoots authentication issues and security incidents
              - Can modify existing SDE security matrix
              qualifications:
              - issuer: Microsoft
                description: 'Microsoft Certified: Identity and Access Administrator Associate (SC-300) (Exam)'
                career_impact: Crucial for configuring Entra ID, MFA, and Conditional Access policies for researcher environments.
              - issuer: Okta
                description: Okta Certified Professional (Exam)
                career_impact: Relevant for TREs utilizing Okta for centralized authentication and SSO federation.
              core_concepts:
              - topic: SDE Authentication Implementation & Troubleshooting
                concepts:
                - Authentication protocols integration
                - SDE Security Matrix modification
                - Incident troubleshooting
                search_terms:
                - Implementing MFA in NHS Secure Data Environment
                - Troubleshooting Entra ID for healthcare
                why: Mid-level engineers must deploy and maintain secure auth flows that comply with health data regulations.
            senior:
              id: authentication-systems-senior
              name: Senior Level
              skills:
              - Consult on enterprise authentication strategies.
              - Evaluates and selects authentication technologies aligned with security needs
              - Leads identity system transformations and security enhancements
              - Lead and provide support for existing Security Matrix.
              qualifications:
              - issuer: ISC2
                description: CISSP (Exam)
                career_impact: Essential for architects designing enterprise authentication strategy and Zero Trust architectures
                  across national SDE networks.
              - issuer: Microsoft
                description: Microsoft Cybersecurity Architect Expert (SC-100) (Exam)
                career_impact: Required to design highly secure, compliant identity frameworks for sensitive health data.
              core_concepts:
              - topic: Enterprise Authentication Strategy
                concepts:
                - Auth technology evaluation
                - Identity transformation
                - Zero Trust in SDE
                search_terms:
                - Zero trust architecture health data SDE
                - Enterprise authentication strategy NHS
                why: Seniors architect authentication frameworks that protect millions of patient records against advanced
                  threats.
        user-provisioning-lifecycle:
          id: user-provisioning-lifecycle
          name: User Provisioning & Lifecycle
          description: Manages the complete lifecycle of user accounts from creation to deactivation within secure environments.
            Encompasses designing and automating provisioning processes, ensuring compliance with management policies, and
            establishing governance frameworks that support efficient identity management across the organisation.
          levels:
            entry:
              id: user-provisioning-lifecycle-entry
              name: Entry Level
              skills:
              - Describes user account lifecycle stages from provisioning to deprovisioning
              - Follows standard user provisioning and deprovisioning procedures
              - Can execute account management tasks following established procedures
              - Understand existing user provisioning specification.
              qualifications:
              - issuer: CompTIA
                description: CompTIA IT Fundamentals+ (Exam)
                career_impact: Basic understanding of user account lifecycles and IT operations.
              core_concepts:
              - topic: Account Lifecycle Management
                concepts:
                - Provisioning/Deprovisioning
                - Account management procedures
                - User provisioning spec
                search_terms:
                - JML process NHS SDE
                - Account lifecycle management healthcare
                why: Accurate provisioning ensures researchers only have access when approved and immediately lose access
                  upon project completion.
            mid:
              id: user-provisioning-lifecycle-mid
              name: Mid Level
              skills:
              - Designs and implements user lifecycle management processes
              - Develops automation for provisioning and deprovisioning
              - Ensures compliance with account management policies
              - Can modify/troubleshoot existing user provisioning specification queries
              qualifications:
              - issuer: SailPoint
                description: SailPoint Certified IdentityIQ Engineer (Exam)
                career_impact: Validates ability to automate complex researcher provisioning and de-provisioning workflows.
              - issuer: Microsoft
                description: 'Microsoft Certified: Azure Administrator Associate (AZ-104) (Exam)'
                career_impact: Covers robust user management and governance within Azure environments.
              core_concepts:
              - topic: Automated Lifecycle & Compliance
                concepts:
                - Automated provisioning
                - Compliance enforcement
                - Troubleshooting queries
                search_terms:
                - Automating user provisioning Azure AD SDE
                - RBAC compliance healthcare data
                why: Automation reduces human error in granting access to sensitive health data.
            senior:
              id: user-provisioning-lifecycle-senior
              name: Senior Level
              skills:
              - Can identify and implement appropriate user lifecycle governance frameworks
              - Implements advanced identity governance and administration solutions
              - Leads identity management modernisation initiatives
              - Can lead new user provisioning specification implementation and support
              qualifications:
              - issuer: Identity Management Institute
                description: Certified Identity and Access Manager (CIAM) (Exam)
                career_impact: Advanced certification for leading identity governance and modernisation initiatives in healthcare.
              core_concepts:
              - topic: Identity Governance & Modernisation
                concepts:
                - Identity governance frameworks (IGA)
                - Lifecycle governance
                - Modernisation initiatives
                search_terms:
                - IGA framework implementation healthcare
                - Identity governance NHS SDE
                why: Robust governance is required to meet statutory requirements like the NHS DSPT (Data Security and Protection
                  Toolkit).
        federated-identity-management:
          id: federated-identity-management
          name: Federated Identity Management
          description: Enables secure authentication across organisational boundaries through single sign-on protocols like
            SAML, OAuth, and OIDC. Involves configuring and managing federation with multiple identity providers, troubleshooting
            security issues, and developing governance frameworks to enhance secure collaboration between healthcare organisations
            and research institutions.
          levels:
            entry:
              id: federated-identity-management-entry
              name: Entry Level
              skills:
              - Describes fundamental concepts of federated identity and single sign-on
              - Identifies standard SSO protocols including SAML, OAuth, and OIDC
              - Can configure simple federated identity integrations
              qualifications: []
              core_concepts:
              - topic: Federation Basics
                concepts:
                - SSO protocols
                - SAML
                - OAuth
                - OIDC
                search_terms:
                - SAML vs OAuth healthcare apps
                - SSO integration SDE
                why: Understanding SSO is vital for federating identities across various NHS trusts and research bodies.
            mid:
              id: federated-identity-management-mid
              name: Mid Level
              skills:
              - Implements federated identity solutions across systems
              - Configures and manages federation with multiple identity providers
              - Troubleshoots federation issues and security concerns
              qualifications:
              - issuer: Ping Identity
                description: Ping Identity Certified Professional (Exam)
                career_impact: Practical skills for configuring SAML/OIDC federation between university identity providers
                  and the SDE.
              core_concepts:
              - topic: Federation Implementation
                concepts:
                - Multi-IdP management
                - SSO troubleshooting
                - Cross-system integration
                search_terms:
                - Configuring SAML for multiple IdPs healthcare
                - Troubleshooting OIDC federation NHS
                why: Enables seamless but secure access for researchers collaborating across different institutions.
            senior:
              id: federated-identity-management-senior
              name: Senior Level
              skills:
              - Architects complex federated identity solutions across organisational boundaries
              - Develops federation governance and security frameworks
              - Leads initiatives to enhance identity federation capabilities across healthcare organisations and research
                institutions
              qualifications:
              - issuer: AWS
                description: AWS Certified Security - Specialty (Exam)
                career_impact: Includes advanced federation topics (Cognito, AWS SSO) for cross-organizational data sharing
                  boundaries.
              - issuer: ISC2
                description: CISSP-ISSAP (Information Systems Security Architecture Professional) (Exam)
                career_impact: Deep architectural focus on complex identity federation across trust boundaries.
              core_concepts:
              - topic: Enterprise Federation Architecture
                concepts:
                - Complex federation architecture
                - Federation governance
                - Cross-organisational security frameworks
                search_terms:
                - Architecting national healthcare identity federation
                - Cross-organisational IAM governance
                why: Large-scale health data research requires secure, scalable federation across national and international
                  boundaries.
