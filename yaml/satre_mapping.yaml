pillars:
- id: info-governance
  name: 1. Information Governance
  components:
  - id: '1.1'
    name: Compliance, accreditation & certification management
    requirement: TREs must demonstrate compliance with relevant governance frameworks
      and achieve appropriate accreditations (e.g. ISO 27001, Cyber Essentials, NHS
      DSPT). This includes maintaining documented evidence of controls, undergoing
      periodic audits, and managing the full accreditation lifecycle.
    mappings:
      safe-technology-engineering:
        system-architecture:
        - secure-environment-design
        - component-based-architecture
        infrastructure-deployment:
        - encryption-key-management
        - network-architecture
        software-engineering:
        - secure-coding-practices
      safe-data-management:
        data-governance:
        - data-quality-management
      safe-access-identity:
        identity-management:
        - federated-identity-management
        access-control:
        - role-based-access-control
        - least-privilege-implementation
      safe-projects-operations:
        operational-excellence:
        - documentation-knowledge-management
        - continuous-improvement
      safe-governance-compliance:
        ethics-research-governance:
        - consent-management
        regulatory-compliance:
        - information-governance
        - healthcare-data-security-frameworks
        - healthcare-standards-compliance
        security-management:
        - security-assessment-testing
        - security-controls-implementation
        - incident-response-management
  - id: '1.2'
    name: Policy management
    requirement: "TREs must establish, maintain, version and communicate policies\
      \ governing all aspects of operation \u2014 including data handling, user access,\
      \ output checking, and incident management. Policies must be regularly reviewed,\
      \ enforced across the organisation, and traceable to regulatory obligations."
    mappings:
      safe-technology-engineering:
        system-architecture:
        - secure-environment-design
        - component-based-architecture
      safe-data-management:
        data-governance:
        - data-quality-management
      safe-access-identity:
        identity-management:
        - federated-identity-management
        access-control:
        - role-based-access-control
      safe-outputs-disclosure-control:
        output-checking:
        - output-review-processes
      safe-projects-operations:
        project-management:
        - agile-delivery-methods
        - procurement-vendor-management
        operational-excellence:
        - documentation-knowledge-management
        - continuous-improvement
      safe-governance-compliance:
        ethics-research-governance:
        - consent-management
        regulatory-compliance:
        - information-governance
        - ethics-research-approval-systems
        - healthcare-standards-compliance
        security-management:
        - security-controls-implementation
        - incident-response-management
  - id: '1.3'
    name: Risk management
    requirement: TREs must operate a systematic risk management framework that identifies,
      assesses, treats, and monitors risks across technical, organisational, legal,
      and regulatory dimensions. Risk registers must be maintained, mitigations documented,
      and risks reviewed at regular intervals.
    mappings:
      safe-technology-engineering:
        system-architecture:
        - secure-environment-design
        - component-based-architecture
        - configuration-management
        infrastructure-deployment:
        - network-architecture
        software-engineering:
        - secure-coding-practices
        - microservices-api-design
      safe-data-management:
        data-governance:
        - data-classification-sensitivity
        - data-quality-management
      safe-access-identity:
        identity-management:
        - federated-identity-management
        access-control:
        - role-based-access-control
      safe-outputs-disclosure-control:
        statistical-disclosure-control:
        - automated-disclosure-control
        output-checking:
        - output-review-processes
      safe-projects-operations:
        project-management:
        - research-project-facilitation
        - procurement-vendor-management
        operational-excellence:
        - documentation-knowledge-management
      safe-governance-compliance:
        ethics-research-governance:
        - consent-management
        regulatory-compliance:
        - information-governance
        - healthcare-standards-compliance
        security-management:
        - security-assessment-testing
        - security-controls-implementation
        - incident-response-management
  - id: '1.4'
    name: Study management
    requirement: TREs must support the full lifecycle of research studies, including
      project initiation and approval, per-study researcher access management, data
      access scoping to approved datasets, output management, and structured study
      closure with data deletion.
    mappings:
      safe-data-management:
        data-governance:
        - data-classification-sensitivity
        - data-quality-management
        data-engineering-processing:
        - data-storage-database-management
        - event-driven-data-processing
        - data-migration
      safe-access-identity:
        identity-management:
        - federated-identity-management
        access-control:
        - role-based-access-control
      safe-outputs-disclosure-control:
        statistical-disclosure-control:
        - automated-disclosure-control
        output-checking:
        - output-review-processes
        accidental-disclosure:
        - accidental-disclosure-management
      safe-projects-operations:
        project-management:
        - resource-cost-management
        - research-project-facilitation
        - sde-project-planning
        research-support-innovation:
        - tre-tools-capabilities
        - researcher-training-support
        - community-engagement-networking
      safe-governance-compliance:
        ethics-research-governance:
        - consent-management
        regulatory-compliance:
        - ethics-research-approval-systems
        - healthcare-standards-compliance
        security-management:
        - incident-response-management
  - id: '1.5'
    name: Training delivery & management
    requirement: TREs must deliver and track training for all users and staff, covering
      safe use of the environment, data governance obligations, and statistical disclosure
      control. Training completion must be verified and recorded before access is
      granted, and refreshed at appropriate intervals.
    mappings:
      safe-access-identity:
        access-control:
        - role-based-access-control
      safe-outputs-disclosure-control:
        statistical-disclosure-control:
        - automated-disclosure-control
      safe-projects-operations:
        operational-excellence:
        - documentation-knowledge-management
        research-support-innovation:
        - tre-tools-capabilities
        - community-engagement-networking
      safe-governance-compliance:
        ethics-research-governance:
        - consent-management
        regulatory-compliance:
        - ethics-research-approval-systems
        - healthcare-standards-compliance
  - id: '1.6'
    name: Member accreditation
    requirement: TREs must operate a formal process to accredit researchers before
      granting access, including identity verification, confirmation of institutional
      affiliation, training completion, and where required, data access agreement
      sign-off. Accreditation status must be maintained and revoked on departure.
    mappings:
      safe-access-identity:
        identity-management:
