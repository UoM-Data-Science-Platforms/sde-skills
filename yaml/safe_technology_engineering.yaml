domain:
  index: 6
  main-color: color-purple
  id: safe-technology-engineering
  name: Safe Technology & Engineering
  description: This domain covers the technical implementation and maintenance of
    secure systems, focusing on the infrastructure, development, and engineering aspects
    of Secure Data Environments.
  source_file: safe_technology_engineering.md
  subdomains:
    software-engineering:
      id: software-engineering
      name: Software Engineering
      description: 'Software Engineering applies structured approaches to developing
        and maintaining secure, high-quality code for research environments.

        This subdomain encompasses implementing appropriate software development lifecycle
        methodologies, incorporating secure coding practices that protect against
        common vulnerabilities, implementing comprehensive testing and quality assurance
        processes, and creating well-documented, reusable code that enhances maintainability
        while enabling knowledge sharing across development teams.'
      tools: []
      technologies: []
      standards: []
      competencies:
        software-development-lifecycle:
          id: software-development-lifecycle
          name: Software Development Lifecycle
          description: 'Applies structured approaches to developing and maintaining
            software throughout its lifecycle.

            Involves following established processes, using version control systems,
            implementing bug fixes, applying methodologies appropriate to context,
            managing code repositories, designing secure features, establishing best
            practices, leading architectural decisions, and mentoring team members
            in engineering excellence.'
          levels:
            entry:
              id: software-development-lifecycle-entry
              name: Entry Level
              skills:
              - Explains basic SDLC concepts and follows established development processes
              - Uses version control systems (e.g. Git) for code management and collaboration
              - Can implement simple bug fixes and feature enhancements under supervision
              core_concepts:
              - topic: SDE Version Control
                concepts: Git fundamentals, branch management in regulated environments
                search_terms:
                - git workflows for health data
                - reproducible analytical pipelines (RAP)
                why: Ensures traceability of code changes accessing sensitive health
                  data.
              qualifications: []
            mid:
              id: software-development-lifecycle-mid
              name: Mid Level
              skills:
              - Proficient in applying SDLC methodologies appropriate to the project
                context
              - Independently manages code repositories and review processes
              - Designs and implements features with security and scalability in mind
              core_concepts:
              - topic: Secure CI/CD
                concepts: Automated testing, secure code review processes
                search_terms:
                - CI/CD for secure data environments
                - github actions self-hosted runners
                why: Prevents unauthorized code changes from entering the secure boundary.
              qualifications: []
            senior:
              id: software-development-lifecycle-senior
              name: Senior Level
              skills:
              - Establishes SDLC best practices and processes for the organisation
              - Leads architectural decisions and ensures secure coding standards
              - Mentors team members on software engineering excellence
              core_concepts:
              - topic: Organizational SDLC Governance
                concepts: Auditability, change management, compliance with NHS DSPT
                search_terms:
                - NHS Data Security and Protection Toolkit SDLC
                - auditable SDLC processes
                why: Provides the highest level of assurance that analytical software
                  meets national health data standards.
              qualifications: []
        secure-coding-practices:
          id: secure-coding-practices
          name: Secure Coding Practices
          description: 'Develops software with security built into the code itself.

            Involves understanding common vulnerabilities like OWASP Top 10, applying
            input validation and error handling, following secure coding guidelines,
            identifying and mitigating security issues, implementing secure authentication
            and authorisation, conducting security-focused code reviews, and developing
            organisational standards.'
          levels:
            entry:
              id: secure-coding-practices-entry
              name: Entry Level
              skills:
              - Identifies common web and software security vulnerabilities (e.g.
                OWASP Top 10)
              - Can apply basic input validation and error handling
              - Uses secure coding guidelines provided by the team
              core_concepts:
              - topic: Basic Vulnerability Awareness
                concepts: OWASP Top 10, input validation
                search_terms:
                - OWASP Top 10 healthcare
                - input validation Python
                why: Prevents injection attacks that could exfiltrate patient data.
              qualifications: []
            mid:
              id: secure-coding-practices-mid
              name: Mid Level
              skills:
              - Proactively identifies and mitigates security vulnerabilities in code
              - Implements secure authentication, authorisation, and data protection
                mechanisms
              - Conducts code reviews with a focus on security aspects
              core_concepts:
              - topic: Data Protection in Code
                concepts: Data pseudonymization, encryption in transit/rest in code
                search_terms:
                - pseudonymization techniques python
                - secure data handling practices
                why: Protects personally identifiable information (PII) at the application
                  layer.
              qualifications: []
            senior:
              id: secure-coding-practices-senior
              name: Senior Level
              skills:
              - Develops security standards and coding guidelines for the organisation
              - Evaluates and selects appropriate security libraries and frameworks
              - Implements advanced security patterns for high-risk components
              core_concepts:
              - topic: Enterprise Security Standards
                concepts: Zero-trust architecture in code, threat modeling
                search_terms:
                - threat modeling health applications
                - zero trust application design
                why: Ensures the entire application ecosystem is resilient to advanced
                  threats.
              qualifications:
              - name: Certified Secure Software Lifecycle Professional (CSSLP)
                issuer: ISC2
        testing-quality-assurance:
          id: testing-quality-assurance
          name: Testing & Quality Assurance
          description: 'Validates software functionality, security, and performance
            before deployment.

            Involves creating unit tests, using testing frameworks, executing test
            plans, designing comprehensive approaches, implementing automated pipelines,
            analysing results to improve quality, establishing processes and standards,
            implementing advanced testing, and driving continuous improvement initiatives.'
          levels:
            entry:
              id: testing-quality-assurance-entry
              name: Entry Level
              skills:
              - Creates basic unit tests for code components
              - Uses automated testing frameworks and continuous integration (CI)
                pipelines
              - Can execute test plans and document results
              core_concepts:
              - topic: Basic Unit Testing
                concepts: Test-driven development basics, pytest
                search_terms:
                - pytest basics
                - unit testing analytical code
                why: Ensures basic functionality of scripts handling health data.
              qualifications: []
            mid:
              id: testing-quality-assurance-mid
              name: Mid Level
              skills:
              - Designs comprehensive test plans including unit, integration, and
                security testing
              - Implements automated testing pipelines and monitors code coverage
              - Analyses test results to improve code quality
              core_concepts:
              - topic: Integration & Security Testing
                concepts: DAST/SAST integration, mocking sensitive data
                search_terms:
                - SAST in healthcare pipelines
                - mocking patient data for tests
                why: Validates that systems interact securely without exposing real
                  data.
              qualifications: []
            senior:
              id: testing-quality-assurance-senior
              name: Senior Level
              skills:
              - Establishes QA processes and standards across projects
              - Implements advanced testing methodologies for complex systems
              - Drives quality metrics and continuous improvement initiatives
              core_concepts:
              - topic: QA Strategy & Compliance
                concepts: Quality metrics, ISO 13485 (Software as Medical Device)
                  awareness
                search_terms:
                - ISO 13485 software validation
                - QA metrics for SDEs
                why: Establishes institutional trust in the software deployed within
                  the SDE.
              qualifications: []
        microservices-api-design:
          id: microservices-api-design
          name: Microservices & API Design
          description: 'Develops loosely coupled, independently deployable services
            that communicate via APIs.

            Involves understanding microservices principles, working with API concepts
            and documentation, designing appropriate service boundaries, implementing
            secure API gateways, developing versioning approaches, architecting API
            frameworks, establishing best practices, and leading API security initiatives.'
          levels:
            entry:
              id: microservices-api-design-entry
              name: Entry Level
              skills:
              - Explains microservices architecture principles and design patterns
              - Interprets API documentation and schemas (e.g. OpenAPI / Swagger)
              - Can develop and use RESTful APIs following established patterns
              core_concepts:
              - topic: API Fundamentals
                concepts: RESTful concepts, API schemas
                search_terms:
                - OpenAPI specification
                - REST API basics
                why: Foundational knowledge for interacting with SDE services.
              qualifications: []
            mid:
              id: microservices-api-design-mid
              name: Mid Level
              skills:
              - Designs microservice architectures with appropriate boundaries
              - Implements secure API gateways and authorisation mechanisms
              - Develops API versioning standards and documentation standards
              core_concepts:
              - topic: Secure API Implementation
                concepts: OAuth2, JWT, API Gateways
                search_terms:
                - OAuth2 for healthcare APIs
                - securing REST APIs with JWT
                why: Ensures only authorized researchers can query data endpoints.
              qualifications: []
            senior:
              id: microservices-api-design-senior
              name: Senior Level
              skills:
              - Architects API frameworks and governance models
              - Establishes microservices best practices and standards
              - Leads API security initiatives and evaluates API management solutions
              core_concepts:
              - topic: API Governance
                concepts: Service mesh, rate limiting, audit logging
                search_terms:
                - API governance in healthcare
                - service mesh security
                why: Provides systemic control and auditability across all internal
                  microservices.
              qualifications: []
        code-documentation-reusability:
          id: code-documentation-reusability
          name: Code Documentation & Reusability
          description: 'Creates understandable, maintainable, and reusable code.

            Involves writing clear comments explaining functionality, following documentation
            patterns, creating comprehensive explanations, designing for reusability
            with appropriate abstraction, implementing self-documenting principles,
            establishing organisational standards, developing reuse approaches, and
            creating knowledge sharing policies.'
          levels:
            entry:
              id: code-documentation-reusability-entry
              name: Entry Level
              skills:
              - Explains the importance of code documentation and comments
              - Follows established documentation patterns for the codebase
              - Can write basic comments explaining code functionality
              core_concepts:
              - topic: Code Readability
                concepts: Docstrings, basic Markdown
                search_terms:
                - Python docstrings standard
                - writing good READMEs
                why: Allows peers to understand analytical methods applied to data.
              qualifications: []
            mid:
              id: code-documentation-reusability-mid
              name: Mid Level
              skills:
              - Creates comprehensive documentation that explains both how and why
              - Designs code for reusability with appropriate abstraction
              - Implements self-documenting code principles and clear naming conventions
              core_concepts:
              - topic: Technical Documentation
                concepts: Architecture Decision Records (ADRs), self-documenting code
                search_terms:
                - How to write ADRs
                - self-documenting code principles
                why: Maintains a history of security and architecture decisions in
                  the SDE.
              qualifications: []
            senior:
              id: code-documentation-reusability-senior
              name: Senior Level
              skills:
              - Establishes documentation standards and best practices for the organisation
              - Develops methodologies for code reuse across projects and teams
              - Creates knowledge sharing policies and mentors others in documentation
              core_concepts:
              - topic: Knowledge Management Strategy
                concepts: InnerSource, documentation frameworks (e.g., Diátaxis)
                search_terms:
                - Diátaxis documentation framework
                - InnerSource in regulated environments
                why: Promotes secure code reuse across different health research projects.
              qualifications: []
        artefact-management:
          id: artefact-management
          name: Artefact Management
          description: 'Securely stores, distributes, and controls access to software
            artefacts including container images, helm charts, and package repositories.

            Involves understanding artefact concepts, accessing repositories following
            procedures, working with vulnerability scanning, implementing secure registries,
            controlling access and scanning for threats, managing distributions, establishing
            governance processes, and leading security initiatives.'
          levels:
            entry:
              id: artefact-management-entry
              name: Entry Level
              skills:
              - Describes basic concepts of container registries, package repositories,
                and Helm charts
              - Can access and use artefact repositories following established procedures
              - Identifies vulnerability scanning tools and practices for container
                images and dependencies
              core_concepts:
              - topic: Artefact Basics
                concepts: Container registries, package managers
                search_terms:
                - Docker registry basics
                - Python pip private registry
                why: Enables retrieval of approved software packages.
              qualifications: []
            mid:
              id: artefact-management-mid
              name: Mid Level
              skills:
              - Implements secure container registries and package repository management
              - Controls access to artefacts and scans for malicious packages and
                vulnerabilities
              - Manages helm chart repositories and software library distributions
              core_concepts:
              - topic: Secure Artefact Distribution
                concepts: Vulnerability scanning (Trivy), signed images
                search_terms:
                - container vulnerability scanning
                - signing docker images cosign
                why: Prevents supply chain attacks from introducing malicious code
                  into the SDE.
              qualifications: []
            senior:
              id: artefact-management-senior
              name: Senior Level
              skills:
              - Develops strategies for artefact management and governance
              - Establishes automated scanning and compliance processes for all artefacts
              - Leads initiatives to enhance artefact security and supply chain integrity
              core_concepts:
              - topic: Supply Chain Security
                concepts: Software Bill of Materials (SBOM), SLSA framework
                search_terms:
                - SLSA framework healthcare
                - SBOM generation and management
                why: Ensures end-to-end cryptographic verification of all software
                  entering the environment.
              qualifications: []
    infrastructure-deployment:
      id: infrastructure-deployment
      name: Infrastructure & Deployment
      description: 'Infrastructure & Deployment establishes the foundation for secure,
        scalable research environments.

        This subdomain focuses on designing and managing cloud resources with appropriate
        security controls, implementing containerisation and orchestration technologies
        that enable portable, isolated application environments, and creating secure
        network architectures with proper segmentation and access controls that collectively
        provide the technical infrastructure needed for protected data processing
        and analysis.'
      tools: []
      technologies: []
      standards: []
      competencies:
        cloud-infrastructure-management:
          id: cloud-infrastructure-management
          name: Cloud Infrastructure Management
          description: 'Designs, deploys, and manages cloud resources for secure data
            environments.

            Involves working with major providers like AWS, Azure, and GCP, provisioning
            resources following patterns, implementing infrastructure as code, designing
            secure architectures, implementing monitoring and scaling, architecting
            enterprise-scale solutions, developing governance frameworks, and leading
            cloud transformation initiatives.'
          levels:
            entry:
              id: cloud-infrastructure-management-entry
              name: Entry Level
              skills:
              - Identifies major cloud service providers (AWS, Azure, GCP) and their
                core infrastructure offerings
              - Can provision and configure basic cloud resources following established
                patterns
              - Explains infrastructure as code (IaC) principles and workflows
              core_concepts:
              - topic: Cloud Fundamentals
                concepts: Basic AWS/Azure/GCP resources, IAM basics
                search_terms:
                - Cloud IAM basics
                - Azure fundamental concepts
                why: Basic understanding of where health data resides.
              qualifications:
              - name: AWS Certified Cloud Practitioner
                issuer: AWS
            mid:
              id: cloud-infrastructure-management-mid
              name: Mid Level
              skills:
              - Designs and implements cloud architectures following security best
                practices
              - Proficient with infrastructure as code tools (Terraform, CloudFormation,
                etc.)
              - Implements monitoring and scaling solutions for cloud resources
              core_concepts:
              - topic: Infrastructure as Code (IaC)
                concepts: Terraform, declarative provisioning, state management
                search_terms:
                - Terraform state management best practices
                - IaC for secure environments
                why: Ensures environments are reproducible and configuration changes
                  are audited.
              qualifications:
              - name: 'HashiCorp Certified: Terraform Associate'
                issuer: HashiCorp
            senior:
              id: cloud-infrastructure-management-senior
              name: Senior Level
              skills:
              - Architects enterprise-scale cloud solutions with high availability
                and security
              - Develops cloud governance frameworks and cost optimisation approaches
              - Leads cloud transformation initiatives and capacity planning
              core_concepts:
              - topic: Enterprise Cloud Architecture
                concepts: Multi-account strategies, landing zones, FinOps
                search_terms:
                - AWS Landing Zone healthcare
                - cloud governance frameworks
                why: Provides isolated, scalable, and cost-effective tenant environments
                  for different research projects.
              qualifications:
              - name: AWS Certified Solutions Architect - Professional
                issuer: AWS
        containerisation-orchestration:
          id: containerisation-orchestration
          name: Containerisation & Orchestration
          description: 'Packages and manages applications in isolated, portable environments.

            Involves understanding container concepts, working with Docker and container
            registries, designing container-based architectures, implementing orchestration
            with Kubernetes or similar platforms, creating CI/CD pipelines, implementing
            advanced security features, and establishing compliance processes.'
          levels:
            entry:
              id: containerisation-orchestration-entry
              name: Entry Level
              skills:
              - Builds and runs basic containers using standard containerisation tools
              - Builds container images with Docker and manages images in container
                registries
              - Can deploy containerised applications following established patterns
              core_concepts:
              - topic: Containerization Fundamentals
                concepts: Container isolation (namespaces/cgroups), images vs containers
                search_terms:
                - How container namespaces and cgroups work
                - Docker basics
                why: Crucial for securely isolating and scaling researcher workloads.
              qualifications: []
            mid:
              id: containerisation-orchestration-mid
              name: Mid Level
              skills:
              - Designs container-based architectures and multi-container applications
              - Implements container orchestration using Kubernetes or similar platforms
              - Creates and manages CI/CD pipelines for containerised applications
              core_concepts:
              - topic: Kubernetes Orchestration
                concepts: Pods, deployments, RBAC in K8s
                search_terms:
                - Kubernetes RBAC best practices
                - K8s network policies
                why: Manages complex analytical workloads while enforcing network
                  boundaries.
              qualifications:
              - name: Certified Kubernetes Administrator (CKA)
                issuer: CNCF
            senior:
              id: containerisation-orchestration-senior
              name: Senior Level
              skills:
              - Designs enterprise-scale container orchestration strategy
              - Implements advanced Kubernetes features for security, scaling, and
                resilience
              - Establishes container security scanning and compliance processes
              core_concepts:
              - topic: Advanced K8s Security
                concepts: Pod Security Standards, OPA Gatekeeper
                search_terms:
                - OPA Gatekeeper Kubernetes
                - Kubernetes cluster security hardening
                why: Hardens the orchestration layer against container escape and
                  lateral movement.
              qualifications:
              - name: Certified Kubernetes Security Specialist (CKS)
                issuer: CNCF
        network-architecture:
          id: network-architecture
          name: Network Architecture
          description: 'Designs and implements secure networks for data environments.

            Involves understanding networking concepts like IP addressing and routing,
            configuring network settings, designing secure architectures with appropriate
            segmentation, implementing VPCs and access controls, troubleshooting issues,
            architecting complex multi-environment solutions, and developing network
            security policies.'
          levels:
            entry:
              id: network-architecture-entry
              name: Entry Level
              skills:
              - Explains core networking concepts (e.g. IP addressing, subnets, routing,
                DNS)
              - Explains network security controls, firewall rules, and security group
                configurations
              - Can configure simple network settings following established guidelines
              core_concepts:
              - topic: Network Basics
                concepts: IP addressing, subnets, basic firewalls
                search_terms:
                - CIDR notation basics
                - Network security groups
                why: Understanding how data travels within the environment.
              qualifications: []
            mid:
              id: network-architecture-mid
              name: Mid Level
              skills:
              - Designs secure network architectures with appropriate segmentation
              - Implements VPCs, network security groups, and access controls
              - Troubleshoots network-related issues and performance bottlenecks
              core_concepts:
              - topic: Secure Network Segmentation
                concepts: VPCs, PrivateLink, egress controls
                search_terms:
                - AWS PrivateLink healthcare
                - egress filtering for SDEs
                why: Prevents unauthorized data exfiltration to the internet.
              qualifications: []
            senior:
              id: network-architecture-senior
              name: Senior Level
              skills:
              - Architects complex network solutions for multi-environment deployments
              - Develops network security policies and implements defense-in-depth
              - Leads network transformation initiatives and capacity planning
              core_concepts:
              - topic: Advanced Network Security
                concepts: Zero Trust Network Access (ZTNA), IDS/IPS integration
                search_terms:
                - ZTNA implementation architecture
                - network defense in depth
                why: Protects the SDE boundary and intra-environment traffic against
                  sophisticated threats.
              qualifications:
              - name: Cisco Certified Network Professional (CCNP) Security
                issuer: Cisco
        encryption-key-management:
          id: encryption-key-management
          name: Encryption & Key Management
          description: 'Protects data at rest and in transit using secure algorithms
            and robust key management practices.

            Involves understanding encryption concepts, implementing encryption solutions,
            selecting appropriate algorithms, generating and storing keys securely,
            managing key lifecycles, implementing access controls, developing enterprise-wide
            governance and security enhancement initiatives.'
          levels:
            entry:
              id: encryption-key-management-entry
              name: Entry Level
              skills:
              - Explains encryption fundamentals and protections for data at rest
                and in transit
              - Can apply encryption using standard tools and libraries
              - Follows procedures for handling encryption keys
              core_concepts:
              - topic: Encryption Fundamentals
                concepts: Symmetric vs Asymmetric, TLS basics
                search_terms:
                - Data at rest vs transit
                - TLS 1.3 basics
                why: Core understanding of how sensitive data is kept confidential.
              qualifications: []
            mid:
              id: encryption-key-management-mid
              name: Mid Level
              skills:
              - Implements encryption for data at rest and in transit
              - Selects and configures secure encryption algorithms
              - Manages encryption keys using secure key management systems
              core_concepts:
              - topic: Applied Key Management
                concepts: KMS, secret managers, key rotation
                search_terms:
                - AWS KMS key rotation
                - managing secrets in CI/CD
                why: Ensures cryptographic keys are not hardcoded and are managed
                  securely.
              qualifications: []
            senior:
              id: encryption-key-management-senior
              name: Senior Level
              skills:
              - Develops enterprise encryption and key management frameworks
              - Establishes governance for key lifecycle and access controls
              - Leads initiatives to enhance encryption and key management practices
              core_concepts:
              - topic: Enterprise Cryptography
                concepts: HSM (Hardware Security Modules), BYOK (Bring Your Own Key)
                search_terms:
                - HSM for healthcare data
                - BYOK architectures in cloud
                why: Meets the highest compliance requirements for patient data sovereignty
                  and control.
              qualifications: []
    system-architecture:
      id: system-architecture
      name: System Architecture
      description: 'System Architecture establishes the foundational design principles
        for secure, scalable, and maintainable research environments.

        This subdomain encompasses creating secure environment designs with defence-in-depth
        approaches, developing microservices and API architectures that enable modular
        and flexible systems, implementing approaches for scalability and performance
        under varying workloads, creating robust solutions that meet critical requirements,
        and adopting component-based software engineering (CBSE) practices that promote
        reusability and maintainability.'
      tools: []
      technologies: []
      standards: []
      competencies:
        secure-environment-design:
          id: secure-environment-design
          name: Secure Environment Design
          description: 'Creates system designs that prioritise data security and privacy,
            compliance with 5-safes and SATRE.

            Involves understanding principles of secure design, applying defence-in-depth
            and least privilege concepts, documenting environments, implementing appropriate
            controls, evaluating security implications, architecting secure analytics
            environments, developing standards, and leading security architecture
            reviews and remediation.'
          levels:
            entry:
              id: secure-environment-design-entry
              name: Entry Level
              skills:
              - Explains core principles of secure environment design
              - Applies defence-in-depth principles and least privilege access controls
              - Can document existing secure environments and their components
              core_concepts:
              - topic: Five Safes Framework
                concepts: Safe settings, safe data, safe people
                search_terms:
                - Five Safes framework ONS
                - TRE design principles
                why: The foundational policy framework for UK Secure Data Environments.
              qualifications: []
            mid:
              id: secure-environment-design-mid
              name: Mid Level
              skills:
              - Designs secure environments incorporating appropriate controls
              - Implements security patterns such as zero trust architecture
              - Evaluates security implications of architectural decisions
              core_concepts:
              - topic: Trusted Research Environments
                concepts: Air-gapping, VDI (Virtual Desktop Infrastructure) for research
                search_terms:
                - VDI for secure research
                - NHS TRE architecture
                why: Translates policy into technical boundary controls.
              qualifications: []
            senior:
              id: secure-environment-design-senior
              name: Senior Level
              skills:
              - Architects secure data environments
              - Develops architectural principles and standards for secure environments
              - Leads security architecture reviews and remediation efforts
              core_concepts:
              - topic: SATRE Specification
                concepts: Standardised Architecture for Trusted Research Environments
                search_terms:
                - SATRE specification TRE
                - architecting SDE for NHS DSPT
                why: Drives national standardization and compliance across SDE implementations.
              qualifications:
              - name: Certified Information Systems Security Professional (CISSP)
                issuer: ISC2
        scalability-performance:
          id: scalability-performance
          name: Scalability & Performance
          description: 'Builds systems that can handle growing workloads while maintaining
            responsiveness.

            Involves understanding performance concepts and metrics, performing basic
            testing, designing scalable architectures, implementing caching approaches,
            conducting load testing, architecting high-performance systems, developing
            capacity planning methodologies, and leading optimisation initiatives
            across the organisation.'
          levels:
            entry:
              id: scalability-performance-entry
              name: Entry Level
              skills:
              - Identifies basic performance concepts, bottlenecks, and system metrics
              - Differentiates between horizontal and vertical scaling techniques
                for distributed workloads
              - Can perform basic performance testing and identify bottlenecks
              core_concepts:
              - topic: Performance Basics
                concepts: Resource monitoring, vertical vs horizontal scaling
                search_terms:
                - cloud resource monitoring basics
                - horizontal vs vertical scaling
                why: Helps researchers size their compute environments appropriately.
              qualifications: []
            mid:
              id: scalability-performance-mid
              name: Mid Level
              skills:
              - Designs scalable architectures for varying workloads
              - Implements caching techniques and performance optimisations
              - Conducts load testing and performance analysis
              core_concepts:
              - topic: Data Processing Scalability
                concepts: Caching, distributed processing (Spark, Dask)
                search_terms:
                - optimizing PySpark performance
                - Dask for healthcare data
                why: Enables efficient processing of large genomic or longitudinal
                  health datasets.
              qualifications: []
            senior:
              id: scalability-performance-senior
              name: Senior Level
              skills:
              - Architects high-performance systems for demanding workloads
              - Develops capacity planning and scaling methodologies
              - Leads performance optimisation initiatives across systems
              core_concepts:
              - topic: Enterprise Capacity Planning
                concepts: Cost-performance optimization, highly available architectures
                search_terms:
                - capacity planning for cloud scale
                - FinOps in research environments
                why: Ensures the SDE can support institutional demands without cost
                  overruns.
              qualifications: []
        enterprise-solution-development:
          id: enterprise-solution-development
          name: Enterprise Solution Development
          description: 'Creates robust systems that meet business-critical requirements.

            Involves understanding quality of service criteria, working with enterprise
            architecture concepts, explaining trade-offs between quality attributes,
            designing solutions that meet requirements, implementing patterns for
            reliability and resilience, and developing reference architectures.'
          levels:
            entry:
              id: enterprise-solution-development-entry
              name: Entry Level
              skills:
              - Identifies quality of service criteria for business-critical services
              - Identifies enterprise architecture patterns and standard integration
                models
              - Can explain the trade-offs between different quality attributes (availability,
                reliability, etc.)
