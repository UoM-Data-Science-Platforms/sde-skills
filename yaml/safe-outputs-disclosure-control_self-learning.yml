domain:
  name: Safe Outputs & Disclosure Control
  subdomains:
    output-checking:
      name: Output Checking
      competencies:
        output-review-processes:
          name: Output Review Processes
          levels:
            entry:
              core_concepts:
              - topic: SDE Output Governance
                concepts:
                - Five Safes Framework
                - Output Checking Rules
                search_terms:
                - NHS SDE output governance
                - Five safes output checking
                why: Essential for understanding the governance framework around data outputs in health data environments.
            mid:
              core_concepts:
              - topic: Audit and Tracking Systems
                concepts:
                - Audit Logs
                - Workflow Tracking
                - Provenance
                search_terms:
                - Health data output tracking
                - SDE audit logging
                why: Required to maintain defensible audit trails of what data leaves the SDE.
    tools-and-platforms-to-support-output-checking:
      name: Tools and Platforms to Support Output Checking
      competencies:
        workflow-engines:
          name: Workflow Engines
          levels:
            entry:
              core_concepts:
              - topic: Workflow Automation Basics
                concepts:
                - BPMN
                - Disclosure Review Stages
                search_terms:
                - BPMN workflow engine
                - Airflow basic admin
                why: Basic operation of tools that automate the approval pipelines.
            mid:
              core_concepts:
              - topic: Regulatory Workflow Design
                concepts:
                - Policy-as-Code
                - Compliance Workflows
                search_terms:
                - Camunda compliance workflows
                - Automated disclosure review pipelines
                why: Designing workflows that translate governance rules into enforceable automated processes.
            senior:
              core_concepts:
              - topic: Enterprise Workflow Strategy
                concepts:
                - BPM Strategy
                - Scalable Governance Architecture
                search_terms:
                - Enterprise BPM architecture
                - Strategic workflow automation
                why: Leading the overall process architecture for multi-tenant SDEs.
        data-airlocks:
          name: Data Airlocks
          levels:
            entry:
              core_concepts:
              - topic: Airlock Operations
                concepts:
                - Data Ingress/Egress
                - Role-based Access
                search_terms:
                - Data airlock operation
                - SDE ingress egress
                why: Understanding how data flows safely into and out of secure environments.
            mid:
              core_concepts:
              - topic: Airlock Administration & Support
                concepts:
                - SOP Development
                - User Training
                - Troubleshooting
                search_terms:
                - Data airlock administration
                - SDE user access troubleshooting
                why: Supporting researchers and reviewers in using secure transfer systems.
            senior:
              core_concepts:
              - topic: Airlock Architecture
                concepts:
                - Secure System Design
                - Zero Trust Transfer
                search_terms:
                - Data airlock architecture
                - Secure enclave data transfer design
                why: Designing robust, secure, and user-friendly airlock solutions.
        code-repositories:
          name: Code Repositories
          levels:
            entry:
              core_concepts:
              - topic: Version Control Basics
                concepts:
                - Git
                - Code Export
                search_terms:
                - Git basic usage
                - Version control in SDE
                why: Fundamentals of tracking code changes and preparing scripts for review.
            mid:
              core_concepts:
              - topic: Automated Code Scanning
                concepts:
                - Static Analysis
                - Secret Detection
                - Code Publication Workflows
                search_terms:
                - GitLab secret detection
                - Static code analysis credentials
                why: Preventing accidental export of API keys, PHI, or sensitive infrastructure details in code.
            senior:
              core_concepts:
              - topic: Secure Code Governance
                concepts:
                - Sharing Policies
                - Open Source Release Governance
                search_terms:
                - Secure code sharing frameworks
                - SDE open source governance
                why: Establishing organizational standards for safely sharing analytical code.
    statistical-disclosure-control:
      name: Statistical Disclosure Control
      competencies:
        disclosure-risk-assessment:
          name: Disclosure Risk Assessment
          levels:
            entry:
              core_concepts:
              - topic: Disclosure Basics
                concepts:
                - Identity Disclosure
                - Attribute Disclosure
                - Inferential Disclosure
                search_terms:
                - Statistical disclosure control basics
                - Re-identification risk health data
                why: Foundational knowledge required to recognize privacy risks in research outputs.
            mid:
              core_concepts:
              - topic: Risk Mitigation
                concepts:
                - Cell Suppression
                - Perturbation
                - K-anonymity
                search_terms:
                - Applying statistical disclosure controls
                - K-anonymity mitigation
                why: Recommending mathematical or procedural controls to reduce identified risks.
            senior:
              core_concepts:
              - topic: Advanced Risk Management
                concepts:
                - Regulatory Alignment
                - Novel Privacy Attacks
                search_terms:
                - Privacy preserving techniques strategy
                - Health data disclosure risk frameworks
                why: Anticipating future regulatory changes and sophisticated re-identification attacks.
        automated-disclosure-control:
          name: Automated Disclosure Control
          levels:
            entry:
              core_concepts:
              - topic: SDC Tools Overview
                concepts:
                - Rule-based Systems
                - Threshold Settings
                - sdcMicro
                search_terms:
                - sdcMicro overview
                - Automated SDC tools
                why: Familiarity with the software used to enforce disclosure rules programmatically.
            mid:
              core_concepts:
              - topic: SDC Implementation & Validation
                concepts:
                - Threshold Configuration
                - Benchmarking
                - Utility vs Privacy
                search_terms:
                - Configuring SDC thresholds
                - Benchmarking SDC tools
                why: Translating statistical theory into configured software rules and proving their effectiveness.
            senior:
              core_concepts:
              - topic: Advanced Automation
                concepts:
                - Algorithm Development
                - Enterprise SDC Architecture
                search_terms:
                - Advanced statistical disclosure control algorithms
                - Automated SDC architecture
                why: Driving innovation in automated disclosure control to support complex or unstructured output types.
