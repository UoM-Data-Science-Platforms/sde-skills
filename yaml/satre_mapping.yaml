        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Service objectives, operational incident support and researcher project assistance
          directly describe the work of a TRE operator support team; the mapping does not itself supply
          staff.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    editorial_summary: null
    mapping_review_status: reviewed
  - id: '4.7'
    name: Relationship Management
    requirements:
    - id: 4.7.01
      statement: You should have a clear process in place for stakeholders to feedback on your TRE infrastructure.
      guidance: This may include a GitHub repository where people can open issues and discussions, communication
        streams like Slack or email, or forms stakeholders can fill in.
      importance: Recommended
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-f28b720cce80472ebb8aeb05b2ba6936
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Stakeholder engagement, researcher support and improvement feedback loops directly
          support collecting and acting on infrastructure feedback.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    editorial_summary: null
    mapping_review_status: reviewed
  - id: '4.8'
    name: Legal Services
    requirements:
    - id: 4.8.01
      statement: You should identify areas where legal advice may be required and ensure that you have
        ready access to it.
      guidance: 'It is likely that legal advice will be necessary for several issues around the handling
        of sensitive data, and managing project contracts.

        TRE operators should have ready access to legal advice, including a way to solicit advice and
        carry out associated actions.'
      importance: Recommended
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-f28b720cce80472ebb8aeb05b2ba6936
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: supporting_only
        rationale: Governance assessments help identify legal requirements and when advice is needed;
          no competency explicitly provides legal-services liaison or access to professional legal advice.
        framework_gap: Governance assessments help identify legal requirements and when advice is needed;
          no competency explicitly provides legal-services liaison or access to professional legal advice.
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 4.8.02
      statement: You should identify areas where advice on data protection issues may be required and
        ensure that you have ready access to it.
      guidance: It is likely that data protection advice will be necessary for several issues around the
        handling of sensitive data.
      importance: Recommended
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-f28b720cce80472ebb8aeb05b2ba6936
