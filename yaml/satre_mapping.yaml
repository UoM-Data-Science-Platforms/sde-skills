- id: supporting-capabilities
  name: 4. Supporting Capabilities
  components:
  - id: '4.1'
    name: Community engagement
    requirement: TREs should actively engage with the wider research and TRE community
      to share operational learning, contribute to the development of standards and
      best practice, and participate in cross-organisational collaboration on safe
      data access. This includes publishing tools, methods, and findings openly where
      appropriate.
    mappings:
      safe-technology-engineering:
        software-engineering:
        - code-documentation-reusability
      safe-outputs-disclosure-control:
        accidental-disclosure:
        - accidental-disclosure-management
      safe-projects-operations:
        operational-excellence:
        - documentation-knowledge-management
        research-support-innovation:
        - researcher-training-support
        - community-engagement-networking
  - id: '4.2'
    name: Business continuity
    requirement: TREs must maintain business continuity and disaster recovery plans
      that ensure the environment can maintain or recover operations following disruption.
      Plans must be tested regularly, meet defined recovery time objectives, protect
      data integrity, and ensure that active research studies can be resumed without
      data loss.
    mappings:
      safe-technology-engineering:
        software-engineering:
        - code-documentation-reusability
        - testing-quality-assurance
        system-architecture:
