        rationale: Training programme development directly supplies stakeholder education for researchers;
          maintained knowledge bases support learning about TRE management. Operator-specific education
          is not explicitly comprehensive.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 4.3.03
      statement: You should periodically carry out a training needs analysis (TNA) for all stakeholders
        included within your TRE provision.
      guidance: At least once every 12 months you should assess the training needs of your stakeholders,
        and ensure they have easy access to all required training materials.
      importance: Recommended
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-f28b720cce80472ebb8aeb05b2ba6936
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: supporting_only
        rationale: Identifying researcher needs supports the researcher part of a training-needs analysis;
          periodic TNA covering all operational and governance stakeholders is not explicit.
        framework_gap: Identifying researcher needs supports the researcher part of a training-needs analysis;
          periodic TNA covering all operational and governance stakeholders is not explicit.
