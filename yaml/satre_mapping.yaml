        access-control:
        - role-based-access-control
      safe-outputs-disclosure-control:
        statistical-disclosure-control:
        - automated-disclosure-control
        output-checking:
        - output-review-processes
      safe-governance-compliance:
        ethics-research-governance:
        - consent-management
        regulatory-compliance:
        - healthcare-standards-compliance
        security-management:
        - security-assessment-testing
        - incident-response-management
  - id: '3.2'
    name: Data lifecycle management
    requirement: TREs must manage data from ingestion through active use to archival
      and deletion. This includes maintaining data integrity and provenance at each
      stage, enforcing retention schedules defined in data sharing agreements, and
      ensuring secure and verifiable deletion when data is no longer required.
    mappings:
      safe-technology-engineering:
        system-architecture:
        - component-based-architecture
        infrastructure-deployment:
        - containerisation-orchestration
        - network-architecture
