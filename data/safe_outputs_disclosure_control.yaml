domain:
  index: 4
  main-color: color-nhs-blue
  id: safe-outputs-disclosure-control
  name: Safe Outputs & Disclosure Control
  description: This domain covers the technical controls that help to protect projects from accidental or intentional disclosure,
    as well as providing tooling to support disclosure review operations of project teams to ensure that research outputs
    from Secure Data Environments do not inadvertently disclose sensitive information.
  source_file: safe_outputs_disclosure_control.md
  subdomains:
    output-checking:
      id: output-checking
      name: Output Checking
      description: This subdomain focuses on providing output checkers with tools that facilitate structured review processes
        for different output formats, and developing decision support systems that ensure consistent application of disclosure
        control rules while maintaining appropriate governance and traceability.
      competencies:
        output-review-processes:
          id: output-review-processes
          name: Output Review Processes
          description: Involves understanding review requirements for different output formats, designing workflows, implementing
            tracking and governance processes.
          levels:
            entry:
              id: output-review-processes-entry
              name: Entry Level
              skills:
              - Describes output review requirements, thresholds, and governance processes
              - Identifies common research output formats and their associated disclosure risks
              qualifications:
              - issuer: ONS / UKSA
                description: Safe Researcher Training (SRT) (Course)
                career_impact: Fundamental requirement for understanding statistical disclosure control principles.
              core_concepts:
              - topic: SDE Output Governance
                concepts:
                - Five Safes Framework
                - Output Checking Rules
                search_terms:
                - NHS SDE output governance
                - Five safes output checking
                why: Essential for understanding the governance framework around data outputs in health data environments.
            mid:
              id: output-review-processes-mid
              name: Mid Level
              skills:
              - Implements output tracking and audit logs to support governance processes
              qualifications:
              - issuer: ONS
                description: Advanced Statistical Disclosure Control (SDC) Training (Course)
                career_impact: Deep understanding of preventing re-identification in complex datasets.
              core_concepts:
              - topic: Audit and Tracking Systems
                concepts:
                - Audit Logs
                - Workflow Tracking
                - Provenance
                search_terms:
                - Health data output tracking
                - SDE audit logging
                why: Required to maintain defensible audit trails of what data leaves the SDE.
            senior:
              qualifications: []
