        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Vendor management, negotiation and procurement governance directly support assigning
          and performing TRE contract-management responsibilities.
        framework_gap: null
