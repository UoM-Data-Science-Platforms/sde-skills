    accidental-disclosure:
      id: accidental-disclosure
      name: Accidental Disclosure
      description: Establishes protocols, investigation procedures, and immediate containment measures when an accidental
        disclosure or unauthorised output export is suspected or identified.
      competencies:
        accidental-disclosure-management:
          id: accidental-disclosure-management
          name: Accidental Disclosure Management
          description: Detects, assesses, and handles accidental disclosure events to mitigate confidentiality risks and prevent
            unauthorised dissemination of sensitive information.
          levels:
            entry:
              id: accidental-disclosure-management-entry
              name: Entry Level
              skills:
              - Follows standard incident reporting procedures upon discovering a suspected accidental disclosure
              - Assists under direction with collecting relevant audit logs, session records, and exported artefacts
              core_concepts:
              - topic: Incident Reporting
                concepts:
                - Incident Escalation
                - Evidence Collection
                search_terms:
                - Data breach reporting SDE
                - Accidental disclosure escalation
                why: Knowing what to do and what not to touch when a suspected disclosure occurs.
            mid:
              id: accidental-disclosure-management-mid
              name: Mid Level
              skills:
              - Investigates suspected disclosure events by analysing audit logs, egress records, and exported artefacts
              - Implements immediate containment actions to halt unauthorised distribution of disclosive outputs
              - Communicates technical findings and impact assessments clearly to governance and response teams
              core_concepts:
              - topic: Incident Containment & Investigation
                concepts:
                - Log Analysis
                - Containment Actions
                - Impact Assessment
                search_terms:
                - Data egress log analysis
                - Quarantine disclosive outputs
                why: Quickly stopping ongoing leaks and figuring out what happened through technical artifacts.
            senior:
              id: accidental-disclosure-management-senior
              name: Senior Level
              skills:
              - Leads technical investigations of complex disclosure incidents across multi-tenant environments
              - Develops immediate and long-term remediation strategies to prevent recurrence of disclosure vulnerabilities
              - Liaises across organisational, legal, and regulatory stakeholders during incident investigations
              core_concepts:
              - topic: Complex Incident Leadership
                concepts:
                - Multi-tenant Investigations
                - Remediation Strategy
                - Stakeholder Liaison
                search_terms:
                - Enterprise data breach remediation
                - Multi-tenant SDE forensics
                why: Managing major incidents that cross organizational boundaries and require strategic fixes.
      items:
      - name: Data Airlock Quarantine
        role: Implements containment, quarantine, and damage-limitation workflows when potential disclosive material is detected.
        sources:
          community: false
          standards:
            count: 0
            mentions: []
          projects:
            count: 2
            mentions:
            - SATRE Driver Project
