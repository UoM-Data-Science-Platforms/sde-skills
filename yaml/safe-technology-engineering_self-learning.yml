domain:
  name: Safe Technology & Engineering
  subdomains:
    software-engineering:
      name: Software Engineering
      competencies:
        software-development-lifecycle:
          name: Software Development Lifecycle
          levels:
            entry:
              core_concepts:
              - topic: SDE Version Control
                concepts:
                - Git fundamentals
                - branch management in regulated environments
                search_terms:
                - git workflows for health data
                - reproducible analytical pipelines (RAP)
                why: Ensures traceability of code changes accessing sensitive health data.
            mid:
              core_concepts:
              - topic: Secure CI/CD
                concepts:
                - Automated testing
                - secure code review processes
                search_terms:
                - CI/CD for secure data environments
                - github actions self-hosted runners
                why: Prevents unauthorized code changes from entering the secure boundary.
            senior:
              core_concepts:
              - topic: Organizational SDLC Governance
                concepts:
                - Auditability
                - change management
                - compliance with NHS DSPT
                search_terms:
                - NHS Data Security and Protection Toolkit SDLC
                - auditable SDLC processes
                why: Provides the highest level of assurance that analytical software meets national health data standards.
        secure-coding-practices:
          name: Secure Coding Practices
          levels:
            entry:
              core_concepts:
              - topic: Basic Vulnerability Awareness
                concepts:
                - OWASP Top 10
                - input validation
                search_terms:
                - OWASP Top 10 healthcare
                - input validation Python
                why: Prevents injection attacks that could exfiltrate patient data.
            mid:
              core_concepts:
              - topic: Data Protection in Code
                concepts:
                - Data pseudonymization
                - encryption in transit/rest in code
                search_terms:
                - pseudonymization techniques python
                - secure data handling practices
                why: Protects personally identifiable information (PII) at the application layer.
            senior:
              core_concepts:
              - topic: Enterprise Security Standards
                concepts:
                - Zero-trust architecture in code
                - threat modeling
                search_terms:
                - threat modeling health applications
                - zero trust application design
                why: Ensures the entire application ecosystem is resilient to advanced threats.
        testing-quality-assurance:
          name: Testing & Quality Assurance
          levels:
            entry:
              core_concepts:
              - topic: Basic Unit Testing
                concepts:
                - Test-driven development basics
                - pytest
                search_terms:
                - pytest basics
                - unit testing analytical code
                why: Ensures basic functionality of scripts handling health data.
            mid:
              core_concepts:
              - topic: Integration & Security Testing
                concepts:
                - DAST/SAST integration
                - mocking sensitive data
                search_terms:
                - SAST in healthcare pipelines
                - mocking patient data for tests
                why: Validates that systems interact securely without exposing real data.
            senior:
              core_concepts:
              - topic: QA Strategy & Compliance
                concepts:
                - Quality metrics
                - ISO 13485 (Software as Medical Device) awareness
                search_terms:
                - ISO 13485 software validation
                - QA metrics for SDEs
                why: Establishes institutional trust in the software deployed within the SDE.
        microservices-api-design:
          name: Microservices & API Design
          levels:
            entry:
              core_concepts:
              - topic: API Fundamentals
                concepts:
                - RESTful concepts
                - API schemas
                search_terms:
                - OpenAPI specification
                - REST API basics
                why: Foundational knowledge for interacting with SDE services.
            mid:
              core_concepts:
              - topic: Secure API Implementation
                concepts:
                - OAuth2
                - JWT
                - API Gateways
                search_terms:
                - OAuth2 for healthcare APIs
                - securing REST APIs with JWT
                why: Ensures only authorized researchers can query data endpoints.
            senior:
              core_concepts:
              - topic: API Governance
                concepts:
                - Service mesh
                - rate limiting
                - audit logging
                search_terms:
                - API governance in healthcare
                - service mesh security
                why: Provides systemic control and auditability across all internal microservices.
        code-documentation-reusability:
          name: Code Documentation & Reusability
          levels:
            entry:
              core_concepts:
              - topic: Code Readability
                concepts:
                - Docstrings
                - basic Markdown
                search_terms:
                - Python docstrings standard
                - writing good READMEs
                why: Allows peers to understand analytical methods applied to data.
            mid:
              core_concepts:
              - topic: Technical Documentation
                concepts:
                - Architecture Decision Records (ADRs)
                - self-documenting code
                search_terms:
                - How to write ADRs
                - self-documenting code principles
                why: Maintains a history of security and architecture decisions in the SDE.
            senior:
              core_concepts:
              - topic: Knowledge Management Strategy
                concepts:
                - InnerSource
                - documentation frameworks (e.g.
                - Diátaxis)
                search_terms:
                - Diátaxis documentation framework
                - InnerSource in regulated environments
                why: Promotes secure code reuse across different health research projects.
        artefact-management:
          name: Artefact Management
          levels:
            entry:
              core_concepts:
              - topic: Artefact Basics
                concepts:
                - Container registries
                - package managers
                search_terms:
                - Docker registry basics
                - Python pip private registry
                why: Enables retrieval of approved software packages.
            mid:
              core_concepts:
              - topic: Secure Artefact Distribution
                concepts:
                - Vulnerability scanning (Trivy)
                - signed images
                search_terms:
                - container vulnerability scanning
                - signing docker images cosign
                why: Prevents supply chain attacks from introducing malicious code into the SDE.
            senior:
              core_concepts:
              - topic: Supply Chain Security
                concepts:
                - Software Bill of Materials (SBOM)
                - SLSA framework
                search_terms:
                - SLSA framework healthcare
                - SBOM generation and management
                why: Ensures end-to-end cryptographic verification of all software entering the environment.
