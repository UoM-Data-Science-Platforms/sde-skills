    secure-user-experience:
      id: secure-user-experience
      name: Secure User Experience
      description: Secure User Experience focuses on designing and maintaining protected research environments that balance
        robust security measures with usability. This subdomain encompasses researcher onboarding processes, protected workspace
        implementation, and secure collaboration platforms, enabling efficient work with sensitive healthcare data while ensuring
        appropriate controls that maintain compliance, data protection, and positive user experiences.
      competencies:
        researcher-onboarding:
          id: researcher-onboarding
          name: Researcher Onboarding
          description: Designs and implements secure processes for integrating researchers into data environments. Involves
            verifying training and certifications, creating efficient workflows, implementing credential verification, and
