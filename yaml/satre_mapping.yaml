          TRE features and their operation.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 4.3.02
      statement: You should have an education programme in place to upskill stakeholders in the use and
        management of your TRE.
      guidance: This may include learning modules, workshops and other resources on how to effectively
        access and use a TRE, FAQ pages, and accessible pathways for additional support.
      importance: Recommended
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-f28b720cce80472ebb8aeb05b2ba6936
      applicability:
