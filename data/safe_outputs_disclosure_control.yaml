    statistical-disclosure-control:
      id: statistical-disclosure-control
      name: Statistical Disclosure Control
      description: Implementing automated systems that enforce consistent application of disclosure controls across varied
        research outputs while maintaining statistical validity.
      competencies:
        disclosure-risk-assessment:
          id: disclosure-risk-assessment
          name: Disclosure Risk Assessment
          description: Implementing tools to facilitate reviewing research outputs for potential privacy violations and re-identification
            risks. Has an awareness of different types of disclosure risks (identity and attribute), recommending appropriate
            controls.
          levels:
            entry:
              id: disclosure-risk-assessment-entry
              name: Entry Level
              skills:
              - Explains basic disclosure risk concepts (e.g. re-identification risks, data sensitivity levels)
              - Differentiates between identity disclosure, attribute disclosure, and inferential disclosure
              core_concepts:
              - topic: Disclosure Basics
                concepts:
                - Identity Disclosure
                - Attribute Disclosure
                - Inferential Disclosure
                search_terms:
                - Statistical disclosure control basics
                - Re-identification risk health data
                why: Foundational knowledge required to recognize privacy risks in research outputs.
            mid:
              id: disclosure-risk-assessment-mid
              name: Mid Level
              skills:
              - Recommends appropriate controls based on risk assessment
              core_concepts:
              - topic: Risk Mitigation
                concepts:
                - Cell Suppression
                - Perturbation
                - K-anonymity
                search_terms:
                - Applying statistical disclosure controls
                - K-anonymity mitigation
                why: Recommending mathematical or procedural controls to reduce identified risks.
            senior:
              id: disclosure-risk-assessment-senior
              name: Senior Level
              skills:
              - Leads initiatives to enhance disclosure risk management (e.g. implementing new tools or techniques, anticipating
                introduction of new regulatory frameworks)
              core_concepts:
              - topic: Advanced Risk Management
                concepts:
                - Regulatory Alignment
                - Novel Privacy Attacks
                search_terms:
                - Privacy preserving techniques strategy
                - Health data disclosure risk frameworks
                why: Anticipating future regulatory changes and sophisticated re-identification attacks.
        automated-disclosure-control:
          id: automated-disclosure-control
          name: Automated Disclosure Control
          description: Implements systems that automatically apply disclosure controls to research outputs. Involves automated
            tools and solutions for common output types, configuring rules and thresholds, validating effectiveness, architecting
            enterprise strategies, and developing advanced algorithms to enhance automated disclosure control capabilities.
          levels:
            entry:
              id: automated-disclosure-control-entry
              name: Entry Level
              skills:
              - Explains automated SDC tool concepts (e.g. rule-based systems, threshold settings)
              - Identifies available statistical disclosure control (SDC) tools and packages
              core_concepts:
              - topic: SDC Tools Overview
                concepts:
                - Rule-based Systems
                - Threshold Settings
                - sdcMicro
                search_terms:
                - sdcMicro overview
                - Automated SDC tools
                why: Familiarity with the software used to enforce disclosure rules programmatically.
            mid:
              id: automated-disclosure-control-mid
              name: Mid Level
              skills:
              - Implements automated SDC solutions for common output types
              - Configures SDC rules and thresholds in automation systems
              - Validates accuracy and effectiveness of automated controls (e.g. testing against known risks, benchmarking)
              core_concepts:
              - topic: SDC Implementation & Validation
                concepts:
                - Threshold Configuration
                - Benchmarking
                - Utility vs Privacy
                search_terms:
                - Configuring SDC thresholds
                - Benchmarking SDC tools
                why: Translating statistical theory into configured software rules and proving their effectiveness.
            senior:
              id: automated-disclosure-control-senior
              name: Senior Level
              skills:
              - Leads initiatives to enhance automated SDC capabilities
              core_concepts:
              - topic: Advanced Automation
                concepts:
                - Algorithm Development
                - Enterprise SDC Architecture
                search_terms:
                - Advanced statistical disclosure control algorithms
                - Automated SDC architecture
                why: Driving innovation in automated disclosure control to support complex or unstructured output types.
