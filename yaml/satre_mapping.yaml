  - id: '4.4'
    name: Financial Management
    requirements:
    - id: 4.4.01
      statement: You must ensure that all projects using your TRE are aware of any associated costs and
        are able and willing to pay them.
      guidance: Costs may include provision of the underlying TRE infrastructure, additional resources
        required in a specific TRE (for instance memory or additional compute), hardware including managed
        devices, and staff support costs.
      importance: Mandatory
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-f28b720cce80472ebb8aeb05b2ba6936
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Costing models, usage reports and project planning directly support agreeing project
          costs and funding before access is provided.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 4.4.02
      statement: You should be able to track the costs associated with each TRE project.
      guidance: This includes knowing which costs are associated with which project, and having an appropriate
        charging mechanism in place in line with your organisational policy.
      importance: Recommended
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-f28b720cce80472ebb8aeb05b2ba6936
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Cost accounting, allocation reports and resource telemetry directly support attributing
          TRE costs to individual projects.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 4.4.03
      statement: You should have a process in place to ensure your TRE provision remains financially sustainable.
      guidance: 'This could include having a cost recovery process in place, or setting up a long-term
        funding mechanism to support projects with TREs.

        At any given time, you should have funds free to cover all potential foreseen TRE provision for
        at least 12 months.'
      importance: Recommended
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-f28b720cce80472ebb8aeb05b2ba6936
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Financial governance and resource optimisation directly contribute to assessing sustainable
          TRE operating costs and funding.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 4.4.04
      statement: You should minimise the cost of your TRE infrastructure wherever possible.
      guidance: You should have regular reviews of your TRE provision and actively work to bring down
        costs, streamline provision, and optimise support.
      importance: Recommended
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-f28b720cce80472ebb8aeb05b2ba6936
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Cost optimisation and efficient capacity design directly support minimising infrastructure
          costs while meeting service needs.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    editorial_summary: null
    mapping_review_status: reviewed
  - id: '4.5'
    name: Procurement
    requirements:
    - id: 4.5.01
      statement: You must identify any goods or services that will be needed to operate the TRE and ensure
        that a plan is in place to purchase them as needed.
      guidance: These may include computing hardware, cloud credits or devices through which users access
        the TRE.
      importance: Mandatory
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-f28b720cce80472ebb8aeb05b2ba6936
