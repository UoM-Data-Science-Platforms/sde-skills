      statement: A federation must agree and implement federation-wide standards for encryption, for managing
        cryptographic keys and secrets, and for maintaining public key infrastructure where relevant.
      guidance: A minimum standard for encryption, keys, secrets and public key infrastructure is required
        for interoperability between members of a federation, and ensures that the security of a federation
        is not undermined by the weakest member. A federation may want to impose stricter standards on
