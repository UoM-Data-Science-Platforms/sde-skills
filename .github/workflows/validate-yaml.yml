name: Validate framework YAML

on:
  pull_request:
    paths:
      - 'yaml/**'
      - 'scripts/validate_yml.py'
      - 'scripts/test_validate_yml.py'
      - 'scripts/validate_satre.py'
      - 'scripts/satre_source.py'
      - 'scripts/build_data.py'
      - 'scripts/requirements-validation.txt'
      - '.github/workflows/validate-yaml.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r scripts/requirements-validation.txt
      - run: python scripts/validate_yml.py
      - run: python -m unittest discover -s scripts -p 'test_validate_yml.py'
