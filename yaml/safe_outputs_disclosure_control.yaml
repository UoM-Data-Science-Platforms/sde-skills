domain:
  index: 4
  main-color: color-nhs-blue
  id: safe-outputs-disclosure-control
  name: Safe Outputs & Disclosure Control
  description: This domain covers the technical controls that help to protect projects from accidental
    or intentional disclosure, as well as providing tooling to support disclosure review operations of
    project teams to ensure that research outputs from Secure Data Environments do not inadvertently disclose
    sensitive information.
  source_file: safe_outputs_disclosure_control.md
  subdomains:
    output-checking:
      id: output-checking
      name: Output Checking
      description: This subdomain focuses on providing output checkers with tools that facilitate structured
        review processes for different output formats, and developing decision support systems that ensure
        consistent application of disclosure control rules while maintaining appropriate governance and
        traceability.
      tools: []
      technologies: []
      standards: []
      competencies:
        output-review-processes:
          id: output-review-processes
          name: Output Review Processes
          description: Involves understanding review requirements for different output formats, designing
            workflows, implementing tracking and governance processes.
          levels:
            entry:
              id: output-review-processes-entry
              name: Entry Level
              skills:
              - Describes output review requirements, thresholds, and governance processes
              - Identifies common research output formats and their associated disclosure risks
            mid:
              id: output-review-processes-mid
              name: Mid Level
              skills:
              - Implements output tracking and audit logs to support governance processes
    tools-and-platforms-to-support-output-checking:
      id: tools-and-platforms-to-support-output-checking
      name: Tools and Platforms to Support Output Checking
      description: Deploys and administers workflow engines, data airlocks, and secure code repositories
        to ensure consistency, reliability, and traceability of output checking processes.
      tools:
      - Camunda
      - Apache Airflow (basic admin)
      - BPMN viewers
      technologies:
      - custom workflow templates
      - Bonita
      - Bizagi
      - strategic workflow architecture
      standards: []
      competencies:
        workflow-engines:
          id: workflow-engines
          name: Workflow Engines
          description: Deploys and administers workflow engines to ensure consistency, reliability,
            and traceability of output checking processes. Creates individual workflows that meet governance
            and regulatory requirements for project teams.
          levels:
            entry:
              id: workflow-engines-entry
              name: Entry Level
              skills:
              - Identifies workflow automation engines and describes their operational capabilities
              - Describes key roles, responsibilities, and stages in the disclosure review workflow
              - Administers workflow engines to implement changes to existing disclosure review workflows
            mid:
              id: workflow-engines-mid
              name: Mid Level
              skills:
              - Assesses suitability of workflow engines for achieving desired functionality
              - Collaborates with project stakeholders to design workflows that address local policy and regulatory
                stipulations
              - Administers workflow engines to implement disclosure review workflows
              - Develops and maintains workflow templates to maximise reuse across similar governance
                constraints
            senior:
              id: workflow-engines-senior
              name: Senior Level
              skills:
              - Leads the technology strategy for business process management and automated disclosure workflows
        data-airlocks:
          id: data-airlocks
          name: Data Airlocks
          description: Installs and administers data airlock applications, defines role-based access levels
            required for operational tasks (e.g. approvals, requests, triage, audit, review), creates user
            documentation and training materials, and contributes to ongoing improvements to data airlocks
            to meet user needs and regulatory compliance.
          levels:
            entry:
              id: data-airlocks-entry
              name: Entry Level
              skills:
              - Explains the purpose, architecture, and operational rules of data airlocks
              - Identifies user roles and access permissions within data airlock systems
            mid:
              id: data-airlocks-mid
              name: Mid Level
              skills:
              - Produces user documentation and standard operating procedures for data airlocks
              - Delivers training to researchers and review teams relating to data airlock operations
              - Troubleshoots common operational and user access issues with data airlocks
            senior:
              id: data-airlocks-senior
              name: Senior Level
              skills:
              - Guides the architectural design and evolution of data airlocks according to user requirements,
                emerging standards, and governance policies
        code-repositories:
          id: code-repositories
          name: Code Repositories
          description: Installs and configures code repository systems (e.g. Git) that allow source code
            to be imported and exported from SDEs in industry standard ways. Develops automated checks and
            static analysis pipelines to detect secrets, credentials, or restricted data in source code,
            and applies automated review techniques to guide manual inspection.
          levels:
            entry:
              id: code-repositories-entry
              name: Entry Level
              skills:
              - Utilises code repositories and version control platforms (e.g. Git, GitHub, GitLab)
            mid:
              id: code-repositories-mid
              name: Mid Level
              skills:
              - Implements code publication workflows and processes (e.g. structured code reviews)
              - Installs and configures code repositories with appropriate access controls for data ingress
                and egress
              - Develops automated pipelines using static analysis techniques to scan code for secrets,
                credentials, IP addresses, and sensitive infrastructure details
            senior:
              id: code-repositories-senior
              name: Senior Level
              skills:
              - Establishes code publication frameworks and governance
              - Leads initiatives to enhance secure code sharing (e.g. developing sharing policies,
                creating secure repositories, and designing automated pipelines to review eligibility of
                code for release)
    statistical-disclosure-control:
      id: statistical-disclosure-control
      name: Statistical Disclosure Control
      description: Implementing automated systems that enforce consistent application of disclosure controls
        across varied research outputs while maintaining statistical validity.
      tools: []
      technologies:
      - sdcMicro
      - threshold configuration interfaces
      - benchmarking tools
      standards: []
      competencies:
        disclosure-risk-assessment:
          id: disclosure-risk-assessment
          name: Disclosure Risk Assessment
          description: Implementing tools to facilitate reviewing research outputs for potential privacy
            violations and re-identification risks. Has an awareness of different types of disclosure
            risks (identity and attribute), recommending appropriate controls.
          levels:
            entry:
              id: disclosure-risk-assessment-entry
              name: Entry Level
              skills:
              - Explains basic disclosure risk concepts (e.g. re-identification risks, data sensitivity levels)
              - Differentiates between identity disclosure, attribute disclosure, and inferential disclosure
            mid:
              id: disclosure-risk-assessment-mid
              name: Mid Level
              skills:
              - Recommends appropriate controls based on risk assessment
            senior:
              id: disclosure-risk-assessment-senior
              name: Senior Level
              skills:
              - Leads initiatives to enhance disclosure risk management (e.g. implementing new tools
                or techniques, anticipating introduction of new regulatory frameworks).
        automated-disclosure-control:
          id: automated-disclosure-control
          name: Automated Disclosure Control
          description: Implements systems that automatically apply disclosure controls to research outputs.
            Involves automated tools and solutions for common output types, configuring rules and thresholds,
            validating effectiveness, architecting enterprise strategies, and developing advanced algorithms
            to enhance automated disclosure control capabilities.
          levels:
            entry:
              id: automated-disclosure-control-entry
              name: Entry Level
              skills:
              - Explains automated SDC tool concepts (e.g. rule-based systems, threshold settings)
              - Identifies available statistical disclosure control (SDC) tools and packages
            mid:
              id: automated-disclosure-control-mid
              name: Mid Level
              skills:
              - Implements automated SDC solutions for common output types
              - Configures SDC rules and thresholds in automation systems
              - Validates accuracy and effectiveness of automated controls (e.g. testing against known
                risks, benchmarking)
            senior:
              id: automated-disclosure-control-senior
              name: Senior Level
              skills:
              - Leads initiatives to enhance automated SDC capabilities
    accidental-disclosure:
      id: accidental-disclosure
      name: Accidental Disclosure
      description: Establishes protocols, investigation procedures, and immediate containment measures
        when an accidental disclosure or unauthorised output export is suspected or identified.
      tools: []
      technologies:
      - incident report templates
      - output quarantine protocols
      standards: []
      competencies:
        accidental-disclosure-management:
          id: accidental-disclosure-management
          name: Accidental Disclosure Management
          description: Detects, assesses, and handles accidental disclosure events to mitigate confidentiality
            risks and prevent unauthorised dissemination of sensitive information.
          levels:
            entry:
              id: accidental-disclosure-management-entry
              name: Entry Level
              skills:
              - Follows standard incident reporting procedures upon discovering a suspected accidental disclosure
              - Assists under direction with collecting relevant audit logs, session records, and exported artefacts
            mid:
              id: accidental-disclosure-management-mid
              name: Mid Level
              skills:
              - Investigates suspected disclosure events by analysing audit logs, egress records, and exported artefacts
              - Implements immediate containment actions to halt unauthorised distribution of disclosive outputs
              - Communicates technical findings and impact assessments clearly to governance and response teams
            senior:
              id: accidental-disclosure-management-senior
              name: Senior Level
              skills:
              - Leads technical investigations of complex disclosure incidents across multi-tenant environments
              - Develops immediate and long-term remediation strategies to prevent recurrence of disclosure vulnerabilities
              - Liaises across organisational, legal, and regulatory stakeholders during incident investigations
    emergency-response:
      id: emergency-response
      name: Emergency Response
      description: Prepares and executes rapid response procedures for suspected data breaches, data
        leaks, and critical security incidents in research environments.
      tools: []
      technologies:
      - emergency response playbooks
      - forensic log analysis tools
      standards: []
      competencies:
        emergency-response-protocols:
          id: emergency-response-protocols
          name: Emergency Response Protocols
          description: Coordinates emergency response actions, forensics acquisition, and cross-team
            containment during confirmed or suspected data breaches.
          levels:
            entry:
              id: emergency-response-protocols-entry
              name: Entry Level
              skills:
              - Works under direction to acquire logs and other facts relating to potential data breaches
              - Adheres to evidence preservation and chain of custody guidelines during investigations
            mid:
              id: emergency-response-protocols-mid
              name: Mid Level
              skills:
              - Reviews and assesses logs and other facts relating to data breaches to evaluate scope of exposure
              - Communicates technical findings and impact assessments appropriately to diverse audiences
            senior:
              id: emergency-response-protocols-senior
              name: Senior Level
              skills:
              - Represents the infrastructure team when designing emergency response plans (in accordance with governance, regulatory, and legal requirements) to address suspected data breaches
              - Liaises across organisational units to coordinate facts and actions relating to a data breach
              - Designs short-term mitigations to prevent further disclosure
              - Designs long-term mitigations against confirmed data leaks
