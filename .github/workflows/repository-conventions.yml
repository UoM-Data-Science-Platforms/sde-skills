name: Check repository conventions

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tracked-paths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python scripts/check_repository_paths.py
      - run: python -m unittest discover -s scripts -p 'test_repository_paths.py'
