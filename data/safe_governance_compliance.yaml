        certification-accreditation:
          id: certification-accreditation
          name: Certification & Accreditation
          description: Guides systems through formal security validation by external authorities. Involves understanding certification
            requirements, collecting evidence, managing certification processes, preparing documentation, addressing findings,
            developing enterprise strategies, and establishing governance to maintain certifications such as ISO27001 across
            the organisation.
