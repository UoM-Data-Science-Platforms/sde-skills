        security-management:
        - incident-response-management
  - id: '3.3'
    name: Metadata management
    requirement: TREs must maintain accurate, standardised, and discoverable metadata
      about datasets within the environment. This enables researchers to identify
      appropriate data, supports governance and audit requirements, and facilitates
      interoperability with external data catalogues and national infrastructure.
    mappings:
