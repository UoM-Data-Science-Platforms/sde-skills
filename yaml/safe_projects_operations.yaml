domain:
  index: 5
  main-color: color-deep-blue
  id: safe-projects-operations
  name: Safe Projects & Operations
  description: This domain covers the management of secure data environment projects,
    operational excellence, and the delivery of services to research communities.
  source_file: safe_projects_operations.md
  subdomains:
    project-management:
      id: project-management
      name: Project Management
      description: Project Management oversees the planning and delivery of secure
        data environment initiatives. This subdomain encompasses structured planning
        of SDE projects with appropriate methodologies, supporting researchers through
        effective facilitation of technical needs, implementing agile delivery methods
        adapted for secure environments, managing procurement and vendor relationships,
        and optimising resource allocation with effective cost management to ensure
        successful project outcomes.
      tools: []
      technologies: []
      standards: []
      competencies:
        sde-project-planning:
          id: sde-project-planning
          name: SDE Project Planning
          description: Plans and executes projects related to secure data environments.
            Involves understanding project management concepts, using documentation
            and tracking tools, developing comprehensive plans, managing resources
            and timelines, identifying risks, establishing methodologies, and leading
            strategic planning for SDE capabilities across the organisation.
          levels:
            entry:
              id: sde-project-planning-entry
              name: Entry Level
              skills:
              - Explains basic project management principles for SDEs
              - Utilises project tracking tools and maintains project documentation
              - Can assist with SDE project planning activities
              core_concepts:
              - topic: Health Data SDE Lifecycles
                concepts:
                - Project Initiation
                - IG Approvals
                - Data Provisioning
                search_terms:
                - NHS SDE project lifecycle
                - Health data research project management
                why: Understanding how research projects flow through an SDE is fundamental.
              qualifications:
              - PRINCE2 Foundation
            mid:
              id: sde-project-planning-mid
              name: Mid Level
              skills:
              - Develops comprehensive SDE project plans
              - Manages resources and timelines for SDE projects
              - Identifies and mitigates project risks
              core_concepts:
              - topic: SDE Project Resource Planning
                concepts:
                - Cost tracking
                - Researcher onboarding
                - Data extraction timelines
                search_terms:
                - SDE capacity planning
                - Secure data environment resource management
                why: Need to manage expectations for IG and data engineering bottlenecks.
              qualifications:
              - PRINCE2 Practitioner
            senior:
              id: sde-project-planning-senior
              name: Senior Level
              skills:
              - Establishes SDE project management methodologies
              - Oversees complex, multi-stakeholder SDE initiatives
              - Leads strategic planning for SDE capabilities
              core_concepts:
              - topic: Strategic SDE Portfolio Management
                concepts:
                - Multi-tenant project planning
                - Data governance roadmap
                - Funding alignment
                search_terms:
                - Health data research portfolio management
                - NHS TRE strategy
                why: Senior leaders must balance multiple concurrent research initiatives.
              qualifications:
              - MSP Practitioner
        research-project-facilitation:
          id: research-project-facilitation
          name: Research Project Facilitation
          description: Supports researchers in utilising secure data environments
            effectively. Involves understanding research requirements, workflows and
            processes, assisting with basic SDE usage, coordinating complex projects,
            implementing technical solutions, ensuring compliance, developing support
            frameworks, and leading initiatives to enhance research capabilities.
          levels:
            entry:
              id: research-project-facilitation-entry
              name: Entry Level
              skills:
              - Identifies research project requirements and constraints within SDEs
              - Describes typical academic research lifecycles and computational workflows
              - Can assist researchers with basic SDE usage
              core_concepts:
              - topic: Researcher Workflow Basics
                concepts:
                - Jupyter/RStudio basics
                - Data access requests
                - Output checking prep
                search_terms:
                - TRE researcher support
                - SDE workflow assistance
                why: Entry-level support requires understanding how researchers use
                  the environment.
              qualifications: []
            mid:
              id: research-project-facilitation-mid
              name: Mid Level
              skills:
              - Coordinates complex research projects in SDEs
              - Implements technical solutions for research needs
              - Ensures research activities comply with SDE requirements
              core_concepts:
              - topic: Complex SDE Workflows
                concepts:
                - Federated analysis setup
                - Custom package management
                - Pipeline automation
                search_terms:
                - Health data pipeline facilitation
                - SDE researcher enablement
                why: Mid-level staff help build complex analytical pipelines within
                  secure boundaries.
              qualifications: []
            senior:
              id: research-project-facilitation-senior
              name: Senior Level
              skills:
              - Develops frameworks for supporting diverse research needs
              - Establishes researcher engagement and support strategies
              - Leads initiatives to enhance research capabilities in SDEs
              core_concepts:
              - topic: Research Enablement Strategy
                concepts:
                - Standardized research frameworks
                - Institutional engagement
                - Service design for research
                search_terms:
                - SDE research service design
                - Health research infrastructure strategy
                why: Seniors design the overall researcher experience and support
                  model.
              qualifications: []
        agile-delivery-methods:
          id: agile-delivery-methods
          name: Agile Delivery Methods
          description: Applies iterative and incremental approaches to SDE development
            and operations. Involves understanding agile concepts, participating in
            ceremonies, implementing practices appropriate to secure environments,
            managing teams and processes, adapting approaches for security needs,
            establishing delivery frameworks, and leading agile transformation while
            maintaining compliance.
          levels:
            entry:
              id: agile-delivery-methods-entry
              name: Entry Level
              skills:
              - Explains agile principles and delivery methodologies
              - Participates in standard agile ceremonies and maintains sprint artifacts
              - Can participate effectively in agile teams
              core_concepts:
              - topic: Agile Basics in Secure Env
                concepts:
                - Scrum/Kanban
                - Ticket tracking for IG
                - Sprint planning
                search_terms:
                - Agile in secure environments
                - Healthcare IT agile delivery
                why: Agile must be adapted to accommodate strict IG and security gates.
              qualifications:
              - Scrum Master I (PSM I)
            mid:
              id: agile-delivery-methods-mid
              name: Mid Level
              skills:
              - Implements agile practices appropriate to SDE development
              - Manages agile teams and processes
              - Adapts agile approaches for security and compliance needs
              core_concepts:
              - topic: Adapting Agile to IG
                concepts:
                - Security compliance in sprints
                - DevSecOps alignment
                - Delivery tracking
                search_terms:
                - DevSecOps healthcare
                - Agile compliance NHS
                why: Mid-level must integrate continuous delivery with slow-moving
                  compliance checks.
              qualifications:
              - Certified Scrum Professional (CSP)
            senior:
              id: agile-delivery-methods-senior
              name: Senior Level
              skills:
              - Establishes agile delivery frameworks for secure environments
              - Develops agile governance models that maintain compliance
              - Leads agile transformation initiatives
              core_concepts:
              - topic: SDE Agile Governance
                concepts:
                - Scaled Agile Framework (SAFe)
                - Agile transformation
                - Governance integration
                search_terms:
                - Scaled agile healthcare infrastructure
                - Agile transformation TRE
                why: Senior leaders embed agile delivery into the overall SDE governance
                  framework.
              qualifications:
              - SAFe Agilist
        procurement-vendor-management:
          id: procurement-vendor-management
          name: Procurement & Vendor Management
          description: Acquires and manages external resources and services for secure
            data environments. Involves understanding procurement processes, assisting
            with activities, managing procurement for resources and services, negotiating
            with vendors, ensuring compliance with policies, developing strategies,
            establishing governance, and leading strategic vendor relationships.
          levels:
            entry:
              id: procurement-vendor-management-entry
              name: Entry Level
              skills:
              - Identifies standard procurement processes and institutional requirements
              - Reviews vendor contracts, service agreements, and performance documentation
              - Can assist with procurement activities following established procedures
              core_concepts:
              - topic: SDE Procurement Basics
                concepts:
                - Cloud vendor basics
                - Software licensing
                - Purchasing workflows
                search_terms:
                - NHS IT procurement
                - Cloud resource purchasing
                why: Understanding how resources are requested and bought.
              qualifications: []
            mid:
              id: procurement-vendor-management-mid
              name: Mid Level
              skills:
              - Manages procurement processes for SDE resources and services
              - Negotiates with vendors and evaluates service offerings
              - Ensures compliance with procurement policies and regulations
              core_concepts:
              - topic: Health IT Vendor Management
                concepts:
                - DSP Toolkit compliance for vendors
                - SLA negotiation
                - Data processor agreements
                search_terms:
                - NHS data processor agreements
                - Vendor management health IT
                why: Vendors operating in SDEs must meet strict health data standards.
              qualifications:
              - CIPS Level 4
            senior:
              id: procurement-vendor-management-senior
              name: Senior Level
              skills:
              - Develops procurement strategies and vendor management frameworks
              - Establishes procurement governance and oversight mechanisms
              - Leads strategic vendor relationships and partnership initiatives
              core_concepts:
              - topic: Strategic Procurement
                concepts:
                - Multi-cloud vendor strategy
                - Commercial frameworks (G-Cloud)
                - Long-term partnerships
                search_terms:
                - NHS commercial frameworks
                - Strategic cloud procurement health
                why: Requires strategic alignment with national health data infrastructure
                  funding.
              qualifications:
              - CIPS Level 6
        resource-cost-management:
          id: resource-cost-management
          name: Resource & Cost Management
          description: Allocates and optimises resources within secure data environments
            to maximise value. Involves understanding resource allocation principles,
            monitoring cloud costs, generating usage reports, implementing management
            processes, developing optimisation strategies, creating costing models,
            establishing financial governance, and enhancing resource efficiency.
          levels:
            entry:
              id: resource-cost-management-entry
              name: Entry Level
              skills:
              - Explains resource allocation and cloud cost management principles
              - Monitors cloud infrastructure expenditure using cost dashboards and
                billing alerts
              - Can generate basic resource usage reports and cost analyses
              core_concepts:
              - topic: Cloud Cost Basics
                concepts:
                - Billing alerts
                - Tagging resources
                - Usage monitoring
                search_terms:
                - FinOps basics
                - Cloud cost monitoring
                why: SDEs can rack up huge cloud bills; basic monitoring is essential.
              qualifications:
              - AWS/Azure Cloud Practitioner
            mid:
              id: resource-cost-management-mid
              name: Mid Level
              skills:
              - Implements comprehensive resource management processes
              - Develops cost monitoring and optimisation strategies
              - Creates and maintains costing models for SDE operations
              core_concepts:
              - topic: SDE Cost Optimization
                concepts:
                - Compute optimization
                - Chargeback models for researchers
                - Storage lifecycle management
                search_terms:
                - Health data chargeback models
                - SDE FinOps optimization
                why: Need to assign costs to specific research grants or projects
                  accurately.
              qualifications:
              - FinOps Certified Practitioner
            senior:
              id: resource-cost-management-senior
              name: Senior Level
              skills:
              - Develops enterprise resource management and cost optimisation strategies
              - Establishes financial governance frameworks for SDE operations
              - Leads initiatives to enhance resource efficiency and cost-effectiveness
              core_concepts:
              - topic: Financial Strategy for SDEs
                concepts:
                - Enterprise FinOps
                - Funding models
                - Cost-benefit analysis of infrastructure
                search_terms:
                - SDE financial sustainability
                - Enterprise FinOps healthcare
                why: Long-term sustainability of the SDE depends on robust financial
                  strategy.
              qualifications:
              - FinOps Certified Professional
    service-management:
      id: service-management
      name: Service Management
      description: Service Management ensures the reliable delivery of secure data
        environment services to research users. This subdomain focuses on defining
        and maintaining appropriate service quality through structured service level
        agreements, implementing effective incident and problem management processes
        that minimise disruptions and prevent recurrences, and controlling changes
        to infrastructure and applications through governance frameworks that balance
        security requirements with operational flexibility.
      tools: []
      technologies: []
      standards: []
      competencies:
        service-level-management:
          id: service-level-management
          name: Service Level Management
          description: Defines, measures, and maintains service quality for SDE users.
            Involves understanding service level concepts and metrics, tracking performance,
            developing agreements and objectives, implementing monitoring and reporting,
            analysing issues, establishing governance frameworks, developing improvement
            strategies, and leading cross-organisational service level negotiations.
          levels:
            entry:
              id: service-level-management-entry
              name: Entry Level
              skills:
              - Defines service level concepts, indicators, and metrics
              - Interprets service level agreements (SLAs) and monitors key performance
                indicators
              - Can track and report on basic service levels
              core_concepts:
              - topic: SLA Basics
                concepts:
                - Uptime monitoring
                - Incident response times
                - Basic reporting
                search_terms:
                - ITIL SLA basics
                - Service level monitoring
                why: Tracking basic metrics against commitments.
              qualifications:
              - ITIL 4 Foundation
            mid:
              id: service-level-management-mid
              name: Mid Level
              skills:
              - Develops service level agreements and objectives
              - Implements service level monitoring and reporting
              - Analyses service performance and addresses issues
              core_concepts:
              - topic: SDE Service Levels
                concepts:
                - Output checking SLAs
                - Workspace provisioning times
                - Performance analytics
                search_terms:
                - SDE service level agreements
                - TRE operational metrics
                why: Specific SLAs for SDEs involve manual IG tasks like output checking.
              qualifications:
              - ITIL 4 Specialist
            senior:
              id: service-level-management-senior
              name: Senior Level
              skills:
              - Establishes service level frameworks and governance
              - Develops service improvement strategies
              - Leads negotiations for cross-organisational service levels
              core_concepts:
              - topic: Service Level Governance
                concepts:
                - Cross-organizational SLAs
                - Strategic service improvement
                - Customer experience (CX)
                search_terms:
                - Healthcare IT service governance
                - TRE service excellence
                why: Negotiating SLAs between hospitals, universities, and data providers.
              qualifications:
              - ITIL 4 Strategic Leader
        incident-problem-management:
          id: incident-problem-management
          name: Incident & Problem Management
          description: Responds to and resolves service disruptions while preventing
            recurrence. Involves understanding incident concepts, classifying and
            documenting issues, implementing management processes, leading response
            activities, conducting root cause analysis, establishing frameworks, developing
            strategies to reduce frequency and impact, and leading service resilience
            initiatives.
          levels:
            entry:
              id: incident-problem-management-entry
              name: Entry Level
              skills:
              - Explains incident and problem management concepts and lifecycles
