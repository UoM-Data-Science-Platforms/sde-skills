        - data-pipeline-development
        - event-driven-data-processing
        - data-retention-disposal
        data-governance:
        - data-classification-sensitivity
        - data-quality-management
      safe-access-identity:
        identity-management:
        - federated-identity-management
        access-control:
        - role-based-access-control
      safe-outputs-disclosure-control:
        statistical-disclosure-control:
        - automated-disclosure-control
        output-checking:
        - output-review-processes
      safe-projects-operations:
        operational-excellence:
        - continuous-improvement
      safe-governance-compliance:
        ethics-research-governance:
        - consent-management
        regulatory-compliance:
        - healthcare-standards-compliance
        security-management:
        - incident-response-management
  - id: '2.5'
    name: Identity & access management
    requirement: TREs must implement robust identity verification and role-based access
      controls ensuring only authorised individuals can access specific datasets and
      capabilities. Access must be granted on the principle of least privilege, reviewed
      regularly, and revoked promptly when no longer required.
    mappings:
      safe-technology-engineering:
        system-architecture:
        - secure-environment-design
        - component-based-architecture
        - configuration-management
        infrastructure-deployment:
        - encryption-key-management
        - network-architecture
        software-engineering:
        - secure-coding-practices
        - testing-quality-assurance
      safe-data-management:
        data-governance:
        - data-quality-management
      safe-access-identity:
        identity-management:
        - federated-identity-management
        access-control:
        - role-based-access-control
      safe-projects-operations:
        operational-excellence:
        - continuous-improvement
      safe-governance-compliance:
        ethics-research-governance:
        - consent-management
        regulatory-compliance:
        - healthcare-standards-compliance
        security-management:
        - security-controls-implementation
        - incident-response-management
  - id: '2.6'
    name: Output management
    requirement: TREs must operate a structured, documented process to review research
      outputs before release, confirming they are non-disclosive and compliant with
      data sharing agreements. The process must be auditable, with clear accountability
      for approval decisions and a complete record of what was released and to whom.
    mappings:
      safe-technology-engineering:
