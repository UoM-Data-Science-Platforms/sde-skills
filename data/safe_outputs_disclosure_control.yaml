    tools-and-platforms-to-support-output-checking:
      id: tools-and-platforms-to-support-output-checking
      name: Tools and Platforms to Support Output Checking
      description: Deploys and administers workflow engines, data airlocks, and secure code repositories to ensure consistency,
        reliability, and traceability of output checking processes.
      competencies:
        workflow-engines:
          id: workflow-engines
          name: Workflow Engines
          description: Deploys and administers workflow engines to ensure consistency, reliability, and traceability of output
            checking processes. Creates individual workflows that meet governance and regulatory requirements for project
            teams.
          levels:
            entry:
              id: workflow-engines-entry
              name: Entry Level
              skills:
              - Identifies workflow automation engines and describes their operational capabilities
              - Describes key roles, responsibilities, and stages in the disclosure review workflow
              - Administers workflow engines to implement changes to existing disclosure review workflows
              qualifications: []
              core_concepts:
              - topic: Workflow Automation Basics
                concepts:
                - BPMN
                - Disclosure Review Stages
                search_terms:
                - BPMN workflow engine
                - Airflow basic admin
                why: Basic operation of tools that automate the approval pipelines.
            mid:
              id: workflow-engines-mid
              name: Mid Level
              skills:
              - Assesses suitability of workflow engines for achieving desired functionality
              - Collaborates with project stakeholders to design workflows that address local policy and regulatory stipulations
              - Administers workflow engines to implement disclosure review workflows
              - Develops and maintains workflow templates to maximise reuse across similar governance constraints
              qualifications: []
              core_concepts:
              - topic: Regulatory Workflow Design
                concepts:
                - Policy-as-Code
                - Compliance Workflows
                search_terms:
                - Camunda compliance workflows
                - Automated disclosure review pipelines
                why: Designing workflows that translate governance rules into enforceable automated processes.
            senior:
              id: workflow-engines-senior
              name: Senior Level
              skills:
              - Leads the technology strategy for business process management and automated disclosure workflows
              qualifications: []
              core_concepts:
              - topic: Enterprise Workflow Strategy
                concepts:
                - BPM Strategy
                - Scalable Governance Architecture
                search_terms:
                - Enterprise BPM architecture
                - Strategic workflow automation
                why: Leading the overall process architecture for multi-tenant SDEs.
        data-airlocks:
          id: data-airlocks
          name: Data Airlocks
          description: Installs and administers data airlock applications, defines role-based access levels required for operational
            tasks (e.g. approvals, requests, triage, audit, review), creates user documentation and training materials, and
            contributes to ongoing improvements to data airlocks to meet user needs and regulatory compliance.
          levels:
            entry:
              id: data-airlocks-entry
              name: Entry Level
              skills:
              - Explains the purpose, architecture, and operational rules of data airlocks
              - Identifies user roles and access permissions within data airlock systems
              qualifications: []
              core_concepts:
              - topic: Airlock Operations
                concepts:
                - Data Ingress/Egress
                - Role-based Access
                search_terms:
                - Data airlock operation
                - SDE ingress egress
                why: Understanding how data flows safely into and out of secure environments.
            mid:
              id: data-airlocks-mid
              name: Mid Level
              skills:
              - Produces user documentation and standard operating procedures for data airlocks
              - Delivers training to researchers and review teams relating to data airlock operations
              - Troubleshoots common operational and user access issues with data airlocks
              qualifications:
              - issuer: AWS
                description: AWS Certified Security - Specialty (Exam)
                career_impact: Implementing secure network boundaries and automated data export controls.
              - issuer: Microsoft
                description: 'Microsoft Certified: Azure Security Engineer Associate (AZ-500) (Exam)'
                career_impact: Configuring secure data perimeter, storage access controls, and automated egress protection.
              - issuer: Google Cloud
                description: Google Cloud Professional Cloud Security Engineer (Exam)
                career_impact: Implementing VPC Service Controls and secure egress perimeters for data airlocks.
              core_concepts:
              - topic: Airlock Administration & Support
                concepts:
                - SOP Development
                - User Training
                - Troubleshooting
                search_terms:
                - Data airlock administration
                - SDE user access troubleshooting
                why: Supporting researchers and reviewers in using secure transfer systems.
            senior:
              id: data-airlocks-senior
              name: Senior Level
              skills:
              - Guides the architectural design and evolution of data airlocks according to user requirements, emerging standards,
                and governance policies
              qualifications: []
              core_concepts:
              - topic: Airlock Architecture
                concepts:
                - Secure System Design
                - Zero Trust Transfer
                search_terms:
                - Data airlock architecture
                - Secure enclave data transfer design
                why: Designing robust, secure, and user-friendly airlock solutions.
        code-repositories:
          id: code-repositories
          name: Code Repositories
          description: Installs and configures code repository systems (e.g. Git) that allow source code to be imported and
            exported from SDEs in industry standard ways. Develops automated checks and static analysis pipelines to detect
            secrets, credentials, or restricted data in source code, and applies automated review techniques to guide manual
            inspection.
          levels:
            entry:
              id: code-repositories-entry
              name: Entry Level
              skills:
              - Utilises code repositories and version control platforms (e.g. Git, GitHub, GitLab)
              qualifications:
              - issuer: GitLab
                description: GitLab Certified Associate (Exam)
                career_impact: Managing researcher code exports and version control safely.
              core_concepts:
              - topic: Version Control Basics
                concepts:
                - Git
                - Code Export
                search_terms:
                - Git basic usage
                - Version control in SDE
                why: Fundamentals of tracking code changes and preparing scripts for review.
            mid:
              id: code-repositories-mid
              name: Mid Level
              skills:
              - Implements code publication workflows and processes (e.g. structured code reviews)
              - Installs and configures code repositories with appropriate access controls for data ingress and egress
              - Develops automated pipelines using static analysis techniques to scan code for secrets, credentials, IP addresses,
                and sensitive infrastructure details
              qualifications: []
              core_concepts:
              - topic: Automated Code Scanning
                concepts:
                - Static Analysis
                - Secret Detection
                - Code Publication Workflows
                search_terms:
                - GitLab secret detection
                - Static code analysis credentials
                why: Preventing accidental export of API keys, PHI, or sensitive infrastructure details in code.
            senior:
              id: code-repositories-senior
              name: Senior Level
              skills:
              - Establishes code publication frameworks and governance
              - Leads initiatives to enhance secure code sharing (e.g. developing sharing policies, creating secure repositories,
                and designing automated pipelines to review eligibility of code for release)
              qualifications: []
              core_concepts:
              - topic: Secure Code Governance
                concepts:
                - Sharing Policies
                - Open Source Release Governance
                search_terms:
                - Secure code sharing frameworks
                - SDE open source governance
                why: Establishing organizational standards for safely sharing analytical code.
