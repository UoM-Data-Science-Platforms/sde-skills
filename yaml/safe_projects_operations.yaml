                urgency
              - Can document and track incidents following established processes
              core_concepts:
              - topic: Incident Logging
                concepts:
                - Ticketing systems
                - Triage
                - Impact assessment
                search_terms:
                - ITSM incident logging
                - Helpdesk basics
                why: First-line response to user issues or system alerts.
              qualifications: []
            mid:
              id: incident-problem-management-mid
              name: Mid Level
              skills:
              - Implements incident and problem management processes
              - Leads incident response and resolution activities
              - Conducts root cause analysis and develops permanent fixes
              core_concepts:
              - topic: SDE Incident Resolution
                concepts:
                - Data breach response
                - Root cause analysis
                - System recovery
                search_terms:
                - Health data breach response
                - SDE root cause analysis
                why: Incidents in SDEs can have severe legal/IG implications (e.g.,
                  data leaks).
              qualifications: []
            senior:
              id: incident-problem-management-senior
              name: Senior Level
              skills:
              - Establishes incident and problem management frameworks
              - Develops strategies to reduce incident frequency and impact
              - Leads service resilience and reliability initiatives
              core_concepts:
