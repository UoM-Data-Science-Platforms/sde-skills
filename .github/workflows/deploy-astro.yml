name: Deploy Astro App

on:
  push:
    branches:
      - main
    paths:
      - 'astro-app/**'
      - 'scripts/build_data.py'
      - 'docs/competency_framework/framework_mapping.md'
      - 'yaml/**'
      - '.github/workflows/deploy-astro.yml'
  workflow_dispatch:
    inputs:
      app_root:
        description: 'Review sub-path under /sde-skills/ (e.g. "review", "pr-42"). Leave blank to deploy gold tier at /sde-skills/.'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --locked --all-extras --dev

      - name: Build and merge YAML data
        run: uv run python scripts/build_data.py

      - name: Copy framework mapping markdown
        run: |
          mkdir -p astro-app/data
          cp docs/competency_framework/framework_mapping.md astro-app/data/cf-framework-mapping.md

      - name: Compute deploy paths
        run: |
          APP_ROOT="${{ github.event.inputs.app_root }}"
          if [ -z "$APP_ROOT" ]; then
            echo "ASTRO_BASE=/sde-skills" >> $GITHUB_ENV
            echo "DEST_DIR=sde-skills" >> $GITHUB_ENV
          else
            echo "ASTRO_BASE=/sde-skills/$APP_ROOT" >> $GITHUB_ENV
            echo "DEST_DIR=sde-skills/$APP_ROOT" >> $GITHUB_ENV
          fi

      - name: Set Astro deploy config
        run: |
          cat > astro-app/astro.config.mjs <<EOF
          import { defineConfig } from 'astro/config';
          import react from '@astrojs/react';
          import remarkMkdocsAttr from './src/plugins/remark-mkdocs-attr.js';
          export default defineConfig({
            integrations: [react()],
            markdown: {
              remarkPlugins: [remarkMkdocsAttr]
            },
            site: 'https://uom-data-science-platforms.github.io',
            base: '$ASTRO_BASE',
          });
          EOF

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: astro-app/package-lock.json

      - name: Install Node dependencies
        run: npm ci
        working-directory: astro-app

      - name: Build Astro app
        run: npm run build
        working-directory: astro-app

      - name: Add .nojekyll to dist
        run: touch astro-app/dist/.nojekyll

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: astro-app/dist
          destination_dir: ${{ env.DEST_DIR }}
