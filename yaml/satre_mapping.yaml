        reviewed_on: '2026-11-03'
    editorial_summary: null
    mapping_review_status: reviewed
  - id: '4.6'
    name: IT Service Management
    requirements:
    - id: 4.6.01
      statement: Your TRE must have a team of Operators in place to support projects working with TREs.
      guidance: 'This may be part of your organisation’s IT support team, or separate.

        Responsibility should be clear and stakeholders should easily be able to access support appropriate
        to their needs.'
      importance: Mandatory
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-f28b720cce80472ebb8aeb05b2ba6936
