- id: '5'
  name: 5. Federation
  scope: federation
  components:
  - id: '5.1'
    name: Federation Governance
    requirements:
    - id: 5.1.01
      statement: The federation must define a scope and governance structure for the federation made up
        of member TREs and interested parties.
      guidance: 'A federation may have 2 levels of management with top management making decisions around
        risk and resources with an operation group making day-to-day decisions related to the running
        of the federation.


        Interested parties might include PPIE, Data Providers, member TRE operators and external oversight
        etc.


        Establish decision-making processes based on best practice that ensure all stakeholders have an
        equal opportunity to contribute, underpinned by a commitment to transparency and meaningful public
        representation at every stage.'
      importance: Mandatory
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-c0ad547682c14284b6bec01cdc2405f9
      applicability:
        scope: federation
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: supporting_only
        rationale: Information-governance frameworks and cross-organisation identity governance support
          federation arrangements, but defining federation-wide scope and multi-party governance is not
          explicit in the initial framework.
        framework_gap: Information-governance frameworks and cross-organisation identity governance support
          federation arrangements, but defining federation-wide scope and multi-party governance is not
          explicit in the initial framework.
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 5.1.02
      statement: The federation must define key roles (individual and group) and agree a shared responsibility
        model for the federation.
      guidance: "Define a responsibility framework for different individual and group roles. This defines\
        \ when the authority rests with a central federation body versus with individual members. Key\
        \ roles might include TRE provider organisation, infrastructure provider, researcher, top management\
        \ etc.\n\nA document covering responsibilities assigned to these roles could include a RACI matrix\
        \ or be based on established models such as those used by public cloud providers.\n\nWhere a role\
        \ name matches one of the [SATRE defined roles](https://satre-specification.readthedocs.io/en/latest/roles.html)\n\
        \ it must follow the definition."
      importance: Mandatory
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-c0ad547682c14284b6bec01cdc2405f9
      applicability:
        scope: federation
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: supporting_only
        rationale: Governance oversight and cross-organisational identity responsibilities inform shared
          roles; a federation-wide shared-responsibility model is not explicitly defined.
        framework_gap: Governance oversight and cross-organisational identity responsibilities inform
          shared roles; a federation-wide shared-responsibility model is not explicitly defined.
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 5.1.03
      statement: The federation must agree a standard set of rules required for each member TRE. Member
        TREs must make their compliance status with these rules available for audit by the federation,
        its members and external parties as appropriate.
      guidance: 'Standards and rules expected or required by the federation may be specific to the federation
        or require meeting external standards (e.g ISO 27001). These should be tracked and be accessible
        by the federation and its members.


        These rules are likely to be a mix of high-level principles and specific controls.'
      importance: Mandatory
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-c0ad547682c14284b6bec01cdc2405f9
      applicability:
        scope: federation
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: supporting_only
        rationale: Governance controls and compliance evidence support member rulebooks and audits; agreeing
          equivalent federation-wide membership rules is not explicit.
        framework_gap: Governance controls and compliance evidence support member rulebooks and audits;
          agreeing equivalent federation-wide membership rules is not explicit.
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 5.1.04
      statement: Federation members must share any relevant, proportionate incident, audit and other quality
        management data that materially affects other TREs or the federation.
      guidance: While organisations may not share all such details widely any information that has a potential
        effect on other member TREs or the federation as a whole must be shared.
      importance: Mandatory
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-c0ad547682c14284b6bec01cdc2405f9
      applicability:
        scope: federation
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Incident reporting and compliance reporting directly support sharing proportionate
          incident and audit information with affected federation partners.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 5.1.05
      statement: The federation must agree a process to create, update and retire rules and standard operating
        procedures and make them available to TRE members.
      guidance: 'Some shared processes will be critical to the operation of the federation such as data
        access requests, data classification, output checking and release, project initiation and termination.
        There must be a process to implementing, changing and removing such rules and SOPs.


        This ensures decisions are portable across the federation (e.g. output approved in one TRE is
        recognised by others).'
      importance: Mandatory
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-c0ad547682c14284b6bec01cdc2405f9
      applicability:
        scope: federation
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Controlled change procedures and shared documentation directly support creating, revising
          and retiring federation operating procedures.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 5.1.06
      statement: The federation must define processes for TREs joining and leaving the federation.
      guidance: 'Federations may be long-standing and stable or short lived and project based; regardless
        the processes should reflect the impact of a member TRE joining/leaving. The federation may include
        passive or default processes, for example the removal through inactivity or non-compliance.


        These processes should consider access/credential revocation, data and log retention/deletion
        etc.'
      importance: Mandatory
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-c0ad547682c14284b6bec01cdc2405f9
      applicability:
        scope: federation
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: supporting_only
        rationale: Cross-organisation governance and identity federation support joining/leaving controls;
          complete organisational admission and exit processes are not explicit.
        framework_gap: Cross-organisation governance and identity federation support joining/leaving controls;
          complete organisational admission and exit processes are not explicit.
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 5.1.07
      statement: The federation must agree a consistent approach to risk assessment and treatment. Where
        multiple approaches are used, equivalence must be established.
      guidance: It is likely that different organisations will have different risk matrices and risk tolerance.
        The federation should assess combined risk, treat where possible and accept any residual risk.
      importance: Mandatory
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-c0ad547682c14284b6bec01cdc2405f9
      applicability:
        scope: federation
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: supporting_only
        rationale: Security assessments and governance controls supply risk evidence; an explicit method
          for equivalence between federation risk-assessment approaches is absent.
        framework_gap: Security assessments and governance controls supply risk evidence; an explicit
          method for equivalence between federation risk-assessment approaches is absent.
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 5.1.08
      statement: The federation should agree standard terminology for use in agreements and documentation
        with a glossary as needed.
      guidance: Where possible organisations should re-use existing glossaries such as https://glossary.uktre.org/
      importance: Recommended
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-c0ad547682c14284b6bec01cdc2405f9
      applicability:
        scope: federation
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Shared knowledge governance and documentation standards directly support maintaining
          common terminology and glossaries.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 5.1.09
      statement: Access requests to the federation should use common or single templates for legal or
        administration purposes.
      guidance: 'Examples of standard agreements are Data Protection Impact Assessment, Collaboration
        agreements, researcher access agreements.


        This should be managed by the "Front Door" node (the node of the federation the researcher signs
        into).'
      importance: Recommended
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-c0ad547682c14284b6bec01cdc2405f9
      applicability:
        scope: federation
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: supporting_only
        rationale: Cross-organisational onboarding workflows and governance records support common access
          applications; harmonised federation legal/administrative templates are not explicit.
        framework_gap: Cross-organisational onboarding workflows and governance records support common
          access applications; harmonised federation legal/administrative templates are not explicit.
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 5.1.10
      statement: Where federation involves members of the public there must be representation from across
        all member TRE population areas (*optional for TREs without personal data).
      guidance: When moving from a single TRE to a federation it is important to consider public representation
        covering data across the entire federation. This is especially relevant for where member TREs
        cover different populations (*e.g.* regions, counties) or data domains (*e.g.* Health, financial
        data).
      importance: Mandatory*
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-c0ad547682c14284b6bec01cdc2405f9
      applicability:
        scope: federation
        conditional: true
        assessment: pending
      mapping_review_status: gap
      mapping_assessment:
        result: unmapped
        rationale: No competency explicitly covers representative public participation across federation
          populations; professional networking and identity federation do not substitute for it.
        framework_gap: No competency explicitly covers representative public participation across federation
          populations; professional networking and identity federation do not substitute for it.
        reviewer: null
        reviewed_on: '2026-11-03'
    editorial_summary: null
    mapping_review_status: reviewed
  - id: '5.2'
    name: Federation Researcher Accreditation
    requirements:
    - id: 5.2.01
      statement: The federation must agree baseline competency requirements for all users.
      guidance: Competency usually includes training and attestation confirming a user understands their
        responsibilities (i.e. being a "safe researcher"). Federations should use an existing registry
        such as the [safe people registry](https://safepeopleregistry.org) where possible. Alternatively,
        standardised training could be provided by the federation or multiple trainings could be considered
        equivalent. Training status of users should be accessible programmatically (*e.g.* via API) by
        all member TREs.
      importance: Mandatory
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-c0ad547682c14284b6bec01cdc2405f9
      applicability:
        scope: federation
        conditional: false
        assessment: pending
