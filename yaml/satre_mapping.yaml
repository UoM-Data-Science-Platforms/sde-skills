  the initial version of the SDE RTP framework, but have not added to the framework in response to the
  additions to SATRE.
pillars:
- id: '1'
  name: 1. Information Governance
  scope: core
  components:
  - id: '1.1'
    name: Information Governance
    requirements:
    - id: 1.1.01
      statement: You must gather and monitor the information governance requirements needed to fulfil
        any legal, regulatory and ethical standards.
      guidance: 'Requirements will come from a variety of sources including legislation, contractual obligations
        and ethical standards.

        Requirements must be monitored to ensure the TRE controls remain appropriate.'
      importance: Mandatory
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-cd9fc0cff0b04aa98323bfd6c37ccad3
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Information-governance assessments, data-protection obligations and research-ethics
          governance directly support collecting and monitoring legal, regulatory and ethical requirements.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 1.1.02
      statement: You must ensure controls are implemented to meet stakeholder requirements.
      guidance: Control implementation should be systematic and directly aligned to the internal and stakeholder
        requirements.
      importance: Mandatory
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-cd9fc0cff0b04aa98323bfd6c37ccad3
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Governance-control implementation and selection of administrative and technical safeguards
          directly address implementing stakeholder requirements.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 1.1.03
      statement: You must ensure there are adequate resources to meet information governance requirements.
      guidance: Ensuring information governance controls are suitable and enforced requires an investment
        of funding and people appropriate to the size of the TRE.
      importance: Mandatory
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-cd9fc0cff0b04aa98323bfd6c37ccad3
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Resource allocation and financial governance support funding and staffing information-governance
          controls; governance expertise identifies the controls needing those resources.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    editorial_summary: null
    mapping_review_status: reviewed
  - id: '1.2'
    name: Quality Management
    requirements:
    - id: 1.2.01
      statement: You must ensure that changes to policies and standard operating procedures can only be
        made by trusted individuals.
      guidance: It is important to ensure that policies and SOPs are relevant, up-to-date and carefully
        controlled to maintain the integrity and security of your TRE organisation.
      importance: Mandatory
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-8ce3c73e5dc346e99903a594cf6f23a8
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Role permissions and privilege governance directly restrict policy-editing rights to
          trusted authorised individuals.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 1.2.02
      statement: You must use versioning and a codified change procedure for all policies and standard
        operating procedures.
      guidance: This includes recording dates of changes, person responsible for carrying out changes,
        and summary of changes.
      importance: Mandatory
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-8ce3c73e5dc346e99903a594cf6f23a8
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Controlled documentation and codified change procedures directly support versioned
          policies and standard operating procedures.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 1.2.03
      statement: You should measure the performance of information governance within the TRE with regular
        reporting available to your TRE organisation’s management team.
      guidance: This may include reports and dashboards showing security incidents, quality management
        deviations and audit findings.
      importance: Recommended
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-8ce3c73e5dc346e99903a594cf6f23a8
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Monitoring programmes and management reporting directly measure and report governance
          performance.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 1.2.04
      statement: You must audit your TRE organisation against relevant requirements and standards.
      guidance: If you are publicly accredited against a standard, for instance ISO27001, DSPT, CE+ *etc.*,
        you must have processes in place to ensure you remain compliant.
      importance: Mandatory
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-8ce3c73e5dc346e99903a594cf6f23a8
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Compliance assessment and accreditation evidence collection directly support auditing
          the TRE against standards.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 1.2.05
      statement: You must report on and share outcomes of each audit of your TRE organisation with the
        required bodies.
      guidance: This may include regulatory bodies or the organisations that manage accreditations you
        have.
      importance: Mandatory
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-8ce3c73e5dc346e99903a594cf6f23a8
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Compliance reports and external certification processes directly support reporting
          audit outcomes to the appropriate bodies.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 1.2.06
      statement: You must ensure that suppliers, contractors and sub-contractors with access to your TRE
        align with your security requirements.
      guidance: 'These should be included as mandatory, non-functional requirements during procurement
        and contracting.

        This will also include contractor staff contracts for example, legal liability and NDAs.'
      importance: Mandatory
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-8ce3c73e5dc346e99903a594cf6f23a8
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Vendor governance and procurement requirements directly address supplier obligations;
          security testing supplies evidence of their controls.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 1.2.07
      statement: You must monitor compliance of your suppliers with the terms of the contracts.
      guidance: 'This will include monitoring changes in the services and infrastructure being delivered
        and quality management within the contractor’s organisation.

        This may be done through formal audit or by monitoring change and quality documentation provided
        by the supplier.'
      importance: Mandatory
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-8ce3c73e5dc346e99903a594cf6f23a8
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Supplier management and compliance monitoring directly support checking contract performance
          and security obligations.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 1.2.08
      statement: You must track and maintain any physical assets used by your TRE (*optional for TREs
        without physical assets).
      guidance: 'All physical assets should be maintained and covered by warranty if applicable.

        At the end of their lifetime, assets should be securely disposed of in such a way that data cannot
        be recovered from them.'
      importance: Mandatory*
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-8ce3c73e5dc346e99903a594cf6f23a8
      applicability:
        scope: core
        conditional: true
        assessment: pending
      mapping_review_status: gap
      mapping_assessment:
        result: unmapped
        rationale: No competency explicitly covers physical-asset inventory and maintenance; infrastructure
          configuration and procurement alone are not a physical-asset lifecycle capability. The source's
          conditional importance is retained.
        framework_gap: No competency explicitly covers physical-asset inventory and maintenance; infrastructure
          configuration and procurement alone are not a physical-asset lifecycle capability. The source's
          conditional importance is retained.
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 1.2.09
      statement: You must log, track and resolve any issues resulting from deviations from processes,
        incidents and audit findings.
      guidance: This process could, for example, be tracked through an electronic record and workflow
        system with records retained.
      importance: Mandatory
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-8ce3c73e5dc346e99903a594cf6f23a8
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Issue classification, tracking, resolution and compliance follow-up directly support
          managing deviations, incidents and audit findings.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 1.2.10
      statement: You must use reported issues to inform changes, such as for process improvement and risk
        management.
      guidance: All issues should be analysed for their root cause and improvements put in place to prevent
        further occurrence.
      importance: Mandatory
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-8ce3c73e5dc346e99903a594cf6f23a8
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Root-cause analysis and measured process improvement directly turn reported issues
          into corrective changes.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 1.2.11
      statement: You should collect and maintain quality management data for measuring the effectiveness
        of a TRE.
      guidance: 'Large amounts of data will be produced by elements within the TRE.

        These data should be analysed with reports and dashboards provided to guide TRE implementer’s
        improvements and provide re-assurance to data consumers and data subjects.'
      importance: Recommended
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-8ce3c73e5dc346e99903a594cf6f23a8
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Effectiveness measures, service metrics and improvement monitoring directly support
          collecting operational quality-management data.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 1.2.12
      statement: You could use a QMS (Quality Management System) to standardise and automate quality management
        tasks and workflows, and to generate quality data and reports automatically.
      guidance: 'A basic QMS could be a set of spreadsheets or documents held in a repository which are
        manually maintained.

        More mature applications will provide workflows and generate quality data through manual and automated
        actions.'
      importance: Optional
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-8ce3c73e5dc346e99903a594cf6f23a8
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: The official guidance allows a document/repository-based QMS; maintained knowledge
          bases directly support that form, with improvement methods supporting quality workflows.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    editorial_summary: null
    mapping_review_status: reviewed
  - id: '1.3'
    name: Risk Management
    requirements:
    - id: 1.3.01
      statement: You must have a way to quantify risk to understand the underlying severity.
      guidance: For example, a risk assessment methodology may score risks across multiple axes such as
        impact and likelihood.
      importance: Mandatory
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-613a204c1e324a4c8bb427a57152af77
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: supporting_only
        rationale: Security-risk prioritisation and data sensitivity assessments inform risk severity;
          organisation-wide quantitative risk methods are not explicit in the framework.
        framework_gap: Security-risk prioritisation and data sensitivity assessments inform risk severity;
          organisation-wide quantitative risk methods are not explicit in the framework.
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 1.3.02
      statement: You must carry out a data processing assessment for all projects requiring a TRE.
      guidance: 'A data processing assessment is a process designed to identify risks arising out of the
        processing of sensitive data and to minimise these risks as far and as early as possible.

        This may take the form of existing regulatory requirements such as Data Protection Impact Assessment.'
      importance: Mandatory
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-613a204c1e324a4c8bb427a57152af77
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Data-protection impact assessments and processing controls directly support assessing
          project data processing.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 1.3.03
      statement: You must have a process for designing, implementing and recording risk mitigations where
        indicated by a risk assessment.
      guidance: Actions that are taken or not taken following a risk assessment must be recorded.
      importance: Mandatory
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-613a204c1e324a4c8bb427a57152af77
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Designing and implementing documented security safeguards directly supports recording
          and applying technical risk mitigations.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 1.3.04
      statement: You must have a clear set of roles and responsibilities relating to risk including who
        owns risks and how they are escalated and delegated.
      guidance: 'The highest level of risk ownership is the Top Management of the TRE organisation (see
        Governance Roles).

        In order to ensure escalations to this level are rare, suitable structures should be put in place
        to own, mitigate and accept risk.'
      importance: Mandatory
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-613a204c1e324a4c8bb427a57152af77
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: supporting_only
        rationale: Governance oversight supports allocating risk responsibilities, but an explicit organisation-wide
          risk ownership and escalation competency is absent.
        framework_gap: Governance oversight supports allocating risk responsibilities, but an explicit
          organisation-wide risk ownership and escalation competency is absent.
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 1.3.05
      statement: You must understand the risk appetite of your TRE organisation.
      guidance: This includes understanding ownership of risk, and ability to accept risk which falls
        outside of the appetite should that become necessary.
      importance: Mandatory
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-613a204c1e324a4c8bb427a57152af77
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: gap
      mapping_assessment:
        result: unmapped
        rationale: The framework does not explicitly address determining organisational risk appetite;
          security testing and regulatory compliance cannot establish that policy decision.
        framework_gap: The framework does not explicitly address determining organisational risk appetite;
          security testing and regulatory compliance cannot establish that policy decision.
        reviewer: null
        reviewed_on: '2026-11-03'
    editorial_summary: null
    mapping_review_status: reviewed
  - id: '1.4'
    name: Study Management
    requirements:
    - id: 1.4.01
      statement: You must have checks in place to ensure a project has the legal, financial and ethical
        requirements in place for the duration of the project.
      guidance: This includes checks that contracts are in place where required, adequate funding is available
        for the duration of the project, and responsibilities concerning data handling are understood
        by all parties.
      importance: Mandatory
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-410884ca4e76424c9a5486780d339165
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Data-protection assessments, ethical approvals and project financial governance directly
          contribute to the respective legal, ethical and financial checks.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 1.4.02
      statement: You must have checks in place to ensure that any time limited compliance requirements
        are maintained.
      guidance: 'This includes ensuring contracts remain valid and action is promptly taken should they
        expire.

        Any changes in the status of responsible persons should also be monitored, for example a data
        owner leaving an organisation.'
      importance: Mandatory
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-410884ca4e76424c9a5486780d339165
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Ongoing compliance programmes and reporting directly support tracking time-limited
          project obligations.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 1.4.03
      statement: You must have checks in place to ensure that changes in regulations are met for a project.
      guidance: null
      importance: Mandatory
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-410884ca4e76424c9a5486780d339165
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Data-protection governance and ongoing regulatory monitoring directly support updating
          projects when regulations change.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 1.4.04
      statement: You must have standard processes in place for the end of a project, that follow all legal
        requirements and data security best practice.
      guidance: This includes the archiving of quality and log data along with the archiving or deletion
        of data sets.
      importance: Mandatory
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-410884ca4e76424c9a5486780d339165
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Retention and secure-disposal policies directly address end-of-project data handling;
          project planning coordinates closure activities.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 1.4.05
      statement: You could implement a portal that can provide a workflow engine and database which automates
        components relating to study management.
      guidance: 'A portal should automate as much of the processes within the capability as possible.

        Where processes are automated, process maturity is easier to achieve, with more consistent completion
        and automatic production of quality control and monitoring data.'
      importance: Optional
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-410884ca4e76424c9a5486780d339165
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: supporting_only
        rationale: Project workflow knowledge and secure software development support building a study
          portal, but a study-management portal is not an explicitly defined competency. Output-checking
          workflow engines are not repurposed as study-management expertise.
        framework_gap: Project workflow knowledge and secure software development support building a study
          portal, but a study-management portal is not an explicitly defined competency. Output-checking
          workflow engines are not repurposed as study-management expertise.
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 1.4.06
      statement: You should keep a complete record of all the research studies (Safe Projects) and projects
        within the TRE current and historic.
      guidance: The study register should contain all data related to a study including a reference to
        data assets, project team members, information asset owners and any compliance activities required.
        It is good practice to make the registry available to public. See [HDRUK for recommendations](https://doi.org/10.5281/zenodo.5084761)
        for a data use registry standard.
      importance: Recommended
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-410884ca4e76424c9a5486780d339165
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Project tracking and controlled operational records directly support maintaining current
          and historic study registers.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 1.4.07
      statement: TREs holding data about the public must provide that data for research for public benefit.
      guidance: Processes must be in place to decide on the suitability of projects accessing, processing
        and releasing data about the public. Research outputs generated from data about the public should
        be released, subject to meeting all governance requirements and output checks.
      importance: Mandatory*
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-410884ca4e76424c9a5486780d339165
      applicability:
        scope: core
        conditional: true
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: supporting_only
        rationale: Ethical research assessment supports consideration of public benefit; the framework
          does not explicitly define public-benefit assessment or public participation in that decision.
        framework_gap: Ethical research assessment supports consideration of public benefit; the framework
          does not explicitly define public-benefit assessment or public participation in that decision.
        reviewer: null
        reviewed_on: '2026-11-03'
    editorial_summary: null
    mapping_review_status: reviewed
  - id: '1.5'
    name: Researcher Accreditation
    requirements:
    - id: 1.5.01
      statement: You must have a robust method for identifying accredited members of your TRE organisation,
        prior to their accessing of sensitive data.
      guidance: This may include ID checks or email/phone verification.
      importance: Mandatory
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-85f613508f004ef18e19fdf041e1f0a0
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Onboarding verifies accreditation and researcher credentials before access is enabled.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 1.5.02
      statement: You must have clear onboarding processes in place for all roles within your TRE organisation.
      guidance: This may include all members signing role-specific terms of use or confirming that they
        have completed role specific training.
      importance: Mandatory
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-85f613508f004ef18e19fdf041e1f0a0
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Identity lifecycle procedures apply to organisational account onboarding; researcher
          onboarding supplies the researcher-specific workflow and credential checks.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 1.5.03
      statement: You must have a set of services to manage access to resources based on identity.
      guidance: This will include a security model for role based access with technical controls to ensure
        the principle of least privilege is enforced.
      importance: Mandatory
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-85f613508f004ef18e19fdf041e1f0a0
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Role and attribute policies directly implement identity-based access to TRE resources.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 1.5.04
      statement: You must not give anyone access to datasets without agreement from the Data Controller.
      guidance: The Data Controller may choose to delegate this authority.
      importance: Mandatory
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-85f613508f004ef18e19fdf041e1f0a0
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Access-management processes implement dataset permissions while governance controls
          establish the data-controller approval that must precede them.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 1.5.05
      statement: You must have robust and secure applications in place to authenticate users (and services)
        within the TRE.
      guidance: The number of authentication applications should be kept to a minimum with common controls
        and standards applied across all such as MFA, password complexity *etc.*.
      importance: Mandatory
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-85f613508f004ef18e19fdf041e1f0a0
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Secure authentication implementation directly supplies user and service authentication
          mechanisms.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 1.5.06
      statement: You must give each user of the TRE a unique logon with changes to any records strictly
        controlled.
      guidance: 'The unique identifier and all associated records for a user should be traceable across
        the entire TRE.

        This will include training records, affiliations, contract agreements and ethics approvals where
        required.'
      importance: Mandatory
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-85f613508f004ef18e19fdf041e1f0a0
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Individually provisioned accounts and controlled identity-system administration directly
          support unique logons and protected identity records.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    editorial_summary: null
    mapping_review_status: reviewed
  - id: '1.6'
    name: Training Management and Delivery
    requirements:
    - id: 1.6.01
      statement: You must determine what training is relevant for all roles within the TRE organisation.
      guidance: 'This may include, for instance, cyber security training, GDPR training, and higher level
        training for system operators.

        Specialised roles are likely to need more tailored training.

        Identification of these specialities should be done through a systematic training needs analysis.

        Specific training may also be required based on the data or information asset owner such as GCP.'
      importance: Mandatory
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-ba6c25da48e94d37abe02e4dca7b55b7
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: supporting_only
        rationale: Researcher training programmes inform researcher needs; the competency does not establish
          training-needs analysis for all operator and governance roles.
        framework_gap: Researcher training programmes inform researcher needs; the competency does not
          establish training-needs analysis for all operator and governance roles.
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 1.6.02
      statement: You must ensure that relevant training is available for all roles within the TRE organisation.
      guidance: 'All TRE organisation members need to complete all relevant training and keep their training
        current.

        You may need to provide help or guidance to enable them to do so.

        (See 1.6.01 to determine training needed for a role).'
      importance: Mandatory
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-ba6c25da48e94d37abe02e4dca7b55b7
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: supporting_only
        rationale: Delivery of SDE user training supports availability for researchers; provision for
          every organisational role remains outside the stated competency.
        framework_gap: Delivery of SDE user training supports availability for researchers; provision
          for every organisational role remains outside the stated competency.
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 1.6.03
      statement: You must provide repeat or updated training where necessary to account for changes in
        competency requirements.
      guidance: 'Training is not a one-off event.

        Electronic reminders for refresher training should be considered.

        Ideally, training should remain relevant and so policies and processes should enable people to
        demonstrate competency rather than unnecessarily repeating training.'
      importance: Mandatory
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-ba6c25da48e94d37abe02e4dca7b55b7
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: supporting_only
        rationale: Maintaining researcher enablement supports updated user training, but an organisation-wide
          refresher and competency-change programme is not explicit.
        framework_gap: Maintaining researcher enablement supports updated user training, but an organisation-wide
          refresher and competency-change programme is not explicit.
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 1.6.04
      statement: You must maintain accurate training records that are directly tied to the role and access
        levels within the TRE.
      guidance: 'Training records should be tied to a user record and carefully maintained.

        Maintaining training records enables you to ensure all people have completed the required training
        and that repeat training happens regularly.'
      importance: Mandatory
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-ba6c25da48e94d37abe02e4dca7b55b7
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: supporting_only
        rationale: Onboarding verifies training and accreditation records before access; maintaining a
          complete role-linked training record throughout employment is only partially supported.
        framework_gap: Onboarding verifies training and accreditation records before access; maintaining
          a complete role-linked training record throughout employment is only partially supported.
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 1.6.05
      statement: You should accept proof of relevant training certifications from trusted third parties.
      guidance: You might choose to trust certifications provided by known training providers or your
        institution’s partner organisations.
      importance: Recommended
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-ba6c25da48e94d37abe02e4dca7b55b7
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Credential and training-certificate verification supports recognising relevant evidence
          from trusted external providers.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 1.6.06
      statement: You could have a training platform capable of delivering online training in a variety
        of formats.
      guidance: 'This could be a simple content delivery platform or a more comprehensive LMS platform.

        It could also include a range of multimedia delivery formats, and accessible training modules
        for those with access requirements.'
      importance: Optional
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-ba6c25da48e94d37abe02e4dca7b55b7
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: supporting_only
        rationale: Developing and delivering user training supplies content and delivery practice; implementing
          an accessible multi-format training platform is not explicit.
        framework_gap: Developing and delivering user training supplies content and delivery practice;
          implementing an accessible multi-format training platform is not explicit.
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 1.6.07
      statement: You could implement a learning management system (LMS) to manage courses and deliver
        training as required.
      guidance: Where possible an LMS should support a variety of course content and testing.
      importance: Optional
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-ba6c25da48e94d37abe02e4dca7b55b7
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: gap
      mapping_assessment:
        result: unmapped
        rationale: The framework has no explicit learning-management-system implementation or administration
          competency; generic research-tool operation does not establish LMS competence.
        framework_gap: The framework has no explicit learning-management-system implementation or administration
          competency; generic research-tool operation does not establish LMS competence.
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 1.6.08
      statement: You could ensure that any courses you use are available in standard, transferable formats.
      guidance: 'Support for standard formats such as SCORM allows courses to be shared between providers.

        This could help facilitate standardisation of training provision for TRE users across organisations.'
      importance: Optional
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-ba6c25da48e94d37abe02e4dca7b55b7
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: gap
      mapping_assessment:
        result: unmapped
        rationale: No competency specifies interoperable course formats such as SCORM; clinical data-model
          interoperability is a different subject.
        framework_gap: No competency specifies interoperable course formats such as SCORM; clinical data-model
          interoperability is a different subject.
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 1.6.09
      statement: You could keep historical copies of courses in order to demonstrate competency at a given
        point in time.
      guidance: 'Information asset owners and regulators may be required to audit historical records,
        *e.g.* for clinical trials.

        It may be necessary to retain copies of superseded training along with versions of certifications
        within the training record.'
      importance: Optional
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-ba6c25da48e94d37abe02e4dca7b55b7
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: supporting_only
        rationale: Maintaining operational knowledge supports storing historical course documents; auditable
          course-version and certification history is not explicit.
        framework_gap: Maintaining operational knowledge supports storing historical course documents;
          auditable course-version and certification history is not explicit.
        reviewer: null
        reviewed_on: '2026-11-03'
    editorial_summary: null
    mapping_review_status: reviewed
  - id: '1.7'
    name: Public Involvement and Engagement
    requirements:
    - id: 1.7.01
      statement: Public engagement activities must have a fair and balanced inclusion of people with different
        backgrounds, experiences, and identities (*optional for TREs without personal data).
      guidance: Any public engagement activity carried out by TREs should be accessible for the public
        participants involved. Recruitment of public participants should consider how to proactively recruit
        participants who represent data held within the TRE and for whom the intended benefit of projects
        using the data applies. [PEDRI Standards](https://www.pedri.org.uk/about-us/our-standards/) should
        be used to guide approach.
      importance: Mandatory*
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-f47b8ef09efe4be6ba9c5d69adcebf53
      applicability:
        scope: core
        conditional: true
        assessment: pending
      mapping_review_status: gap
      mapping_assessment:
        result: unmapped
        rationale: Professional community networking does not establish inclusive patient/public engagement
          across demographic backgrounds; no explicit competency covers that work.
        framework_gap: Professional community networking does not establish inclusive patient/public engagement
          across demographic backgrounds; no explicit competency covers that work.
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 1.7.02
      statement: Details of TRE operations, data available and projects which have accessed the data must
        be publicly available (*optional for TREs without personal data).
      guidance: 'TREs should be as transparent as possible by providing information online.

        Where information is made available online this should be written in clear language understandable
        to the general public.

        A record of projects which have accessed data via the TRE should be kept and made available.

        Where possible it should include name, summaries, public benefit (if relevant) and organisations
        involved.'
      importance: Mandatory*
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-f47b8ef09efe4be6ba9c5d69adcebf53
      applicability:
        scope: core
        conditional: true
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: supporting_only
        rationale: Operational documentation and dataset catalogues can supply transparency content, but
          public-facing publication and public involvement governance are not explicit competencies.
        framework_gap: Operational documentation and dataset catalogues can supply transparency content,
          but public-facing publication and public involvement governance are not explicit competencies.
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 1.7.03
      statement: Members of the public must be effectively involved in TRE operations and/or oversight
        (*optional for TREs without personal data).
      guidance: 'Members of the public should be effectively involved in decision making or advisory roles
        where their involvement can have influence.

        This could be via active involvement on steering groups, project approval panels, or establishing
        separate public panels who both researchers and TRE staff can consult.

        [PEDRI Standards](https://www.pedri.org.uk/about-us/our-standards/) should be used to guide approach.'
      importance: Mandatory*
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-f47b8ef09efe4be6ba9c5d69adcebf53
      applicability:
        scope: core
        conditional: true
        assessment: pending
      mapping_review_status: gap
      mapping_assessment:
        result: unmapped
        rationale: No competency explicitly establishes patient/public participation in TRE operations
          or oversight; professional networking is not a substitute.
        framework_gap: No competency explicitly establishes patient/public participation in TRE operations
          or oversight; professional networking is not a substitute.
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 1.7.04
      statement: You should publicly share details of incidents, near misses, and mitigations in a timely
        fashion, in line with good practices for responsible disclosure.
      guidance: 'This may be via the TRE website or annual reports.

        Sharing this information is particularly important when a TRE holds public sector data.'
      importance: Recommended
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-f47b8ef09efe4be6ba9c5d69adcebf53
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: supporting_only
        rationale: Incident reporting and compliance communications supply incident and mitigation information;
          timely public responsible-disclosure practice is not explicit.
        framework_gap: Incident reporting and compliance communications supply incident and mitigation
          information; timely public responsible-disclosure practice is not explicit.
        reviewer: null
        reviewed_on: '2026-11-03'
    editorial_summary: null
    mapping_review_status: reviewed
- id: '2'
  name: 2. Computing Technology and Information Security
  scope: core
  components:
  - id: '2.1'
    name: End User Computing
    requirements:
    - id: 2.1.01
      statement: You must not allow users to copy data out of your TRE via the system clipboard.
      guidance: 'A TRE user must not be able to copy sensitive data out of a workspace using the system
        clipboard.

        A TRE may allow user to paste text into a workspace.

        This might not be relevant to your TRE, for example if your user interface does not have a clipboard.'
      importance: Mandatory
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-1a1dd29e1bac4f1c9f137debcc2a3b51
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Workspace isolation and security configuration directly support disabling clipboard
          export from sensitive sessions.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 2.1.02
      statement: Your TRE workspace should provide an environment familiar to your users.
      guidance: 'This may take the form of a virtual Windows or Linux desktops, non-desktop interfaces
        such as JupyterLab and other web applications, or a terminal.

        Bespoke TRE-specific software should be avoided when widely used alternatives already exist.'
      importance: Recommended
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-1a1dd29e1bac4f1c9f137debcc2a3b51
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Researcher-tailored workspace design and user-experience optimisation directly support
          a familiar computing environment.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 2.1.03
      statement: A TRE could restrict data access from data consumers entirely and provide an interface
        for submitting code.
      guidance: For example, you might use a system where users submit jobs that run over the data and
        return results without allowing direct data access.
      importance: Optional
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-1a1dd29e1bac4f1c9f137debcc2a3b51
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Isolated workspace design and secure API interfaces directly support code-submission
          access without exposing underlying data.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 2.1.04
      statement: Your TRE should be accessed via a user interface using commonly available applications.
      guidance: 'TREs which allow users to connect from their own devices should not require the installation
        of any bespoke TRE application on the user’s device.

        In practice a web browser is the most common way to achieve this.'
      importance: Recommended
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-1a1dd29e1bac4f1c9f137debcc2a3b51
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Evaluating researcher workspace technologies and user experience directly supports
          access through commonly available client applications.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 2.1.05
      statement: Your TRE must provide clear guidance on how to use software tools and work with data
        in the TRE.
      guidance: 'TREs that provide a virtual desktop environment for data consumers to work in should
        provide documentation detailing the available tools.

        TREs where the analysis code is developed on the access machine (as opposed to within the TRE)
        should provide documentation detailing the mechanism by which code is submitted to the TRE.'
      importance: Mandatory
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-1a1dd29e1bac4f1c9f137debcc2a3b51
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: User training and operational guidance directly support explaining software and data
          workflows in the TRE.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 2.1.06
      statement: Your TRE should, where possible, automatically apply security related updates for user
        software.
      guidance: Reducing the risk of exploitable vulnerabilities in installed software will increase the
        security of your TRE.
      importance: Recommended
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-1a1dd29e1bac4f1c9f137debcc2a3b51
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Automated patching processes directly support applying security updates to researcher
          software.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 2.1.07
      statement: Your TRE could provide shared services that are accessible to users in the same project.
      guidance: 'This may include shared file storage, databases, collaborative writing, and other web
        applications.

        This must only be shared amongst users within the same project.'
      importance: Optional
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-1a1dd29e1bac4f1c9f137debcc2a3b51
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Secure project collaboration services and managed research tools directly support within-project
          shared applications.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 2.1.08
      statement: Your TRE must ensure that any shared services do not allow users to access data from
        another project.
      guidance: 'Poorly designed shared services could enable the unintended mixing of data between projects.

        To prevent this it is necessary that each instance is only shared between users of a single project.'
      importance: Mandatory
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-1a1dd29e1bac4f1c9f137debcc2a3b51
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Workspace segregation and project-specific role permissions directly prevent shared
          services exposing another project's data.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 2.1.09
      statement: You must mitigate and record any risks introduced by the use in your TRE of software
        that requires telemetry to function.
      guidance: 'For example, some licenced commercial software must contact an external licensing server
        at start-up.

        You must be confident that only licensing information is sent to this server and that any network
        connections are secure.'
      importance: Mandatory
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-1a1dd29e1bac4f1c9f137debcc2a3b51
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Security architecture reviews and controlled network paths address telemetry risks;
          governance records document the agreed mitigations.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 2.1.10
      statement: Your TRE must provide software applications that are required by the data consumers working
        in the TRE.
      guidance: 'The tools provided will depend on the types of data in the TRE, and the expectations
        of users of the TRE.

        For users working in a TRE via a virtual desktop, this may include programming languages such
        as Python and R, integrated development environments, Jupyter notebooks, office type applications
        such as word processors and spreadsheets, command line tools, etc.

        TREs with non-desktop interfaces should similarly consider carefully which applications are best
        suited for the data consumers needs when interacting with the data, for example “point and click”
        GUI tools for querying a database and generating plots of data.

        The set of tools should be reviewed regularly to ensure they are up to date.'
      importance: Mandatory
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-1a1dd29e1bac4f1c9f137debcc2a3b51
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Evaluating, configuring and governing research tools directly supports supplying the
          applications researchers need.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 2.1.11
      statement: Your TRE should provide tools to encourage best-practice in reproducibly analysing data.
      guidance: 'Reproducibility of analyses improves auditability and accountability of how data has
        been used, as well as being best-practice in research.

        This may include version control software, and tools for developing and running data analysis
        pipelines.'
      importance: Recommended
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-1a1dd29e1bac4f1c9f137debcc2a3b51
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Reusable code, version control and structured development practices directly support
          reproducible analytical tooling.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 2.1.12
      statement: Your TRE could provide access to some public software repositories or container registries.
      guidance: For example, a TRE may allow direct installation of packages from Python or R repositories,
        or provide an internal mirror.
      importance: Optional
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-1a1dd29e1bac4f1c9f137debcc2a3b51
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Secure artefact repositories, registries and distribution controls directly support
          selective access to approved external software sources.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 2.1.13
      statement: Your TRE could tightly control which packages are available.
      guidance: 'For example, a TRE may only allow installation of a pre-defined set of approved packages.

        You might also choose to scan for malicious packages and/or go through an approval process before
        allowing code into the technical environment.'
      importance: Optional
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-1a1dd29e1bac4f1c9f137debcc2a3b51
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Repository governance, vulnerability scanning and controlled artefact distribution
          directly support restricting available software packages.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 2.1.14
      statement: Your TRE must maintain segregation of users and data from different projects when using
        all compute, including HPC.
      guidance: 'High performance or specialist compute is often shared amongst multiple users.

        Users and data must remain segregated at all times.

        For example, when using physical compute resources, all sensitive data could be securely wiped
        before another user is given access to that same node.

        In a cloud hosted TRE virtual machines could be destroyed and recreated.'
      importance: Mandatory
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-1a1dd29e1bac4f1c9f137debcc2a3b51
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Workspace segregation and explicit HPC user/data isolation directly support project
          separation across compute systems.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 2.1.15
      statement: Your TRE should be able to provide access to high performance computing or other scalable
        compute resource if required by users.
      guidance: 'If a TRE supports users conducting computationally intensive research it should provide
        access to dynamically scalable compute or the equivalent.

        For example, this may be in the form of a batch scheduler on an HPC cluster, or dynamically created
        compute nodes on a cloud platform.'
      importance: Recommended
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-1a1dd29e1bac4f1c9f137debcc2a3b51
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: HPC provisioning and scalable system design directly support supplying large-scale
          computational resources.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 2.1.16
      statement: Your TRE should be able to provide access to accelerators such as GPUs if required by
        users.
      guidance: 'GPUs and other accelerators are commonly used in machine learning and other computationally
        intensive research.

        TREs should make it clear to users whether GPUs and other resources are available whilst projects
        are being assessed.'
      importance: Recommended
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-1a1dd29e1bac4f1c9f137debcc2a3b51
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Accelerator provisioning, scheduling and isolation directly support controlled GPU
          access for researchers.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 2.1.17
      statement: Your TRE could make data available to data consumers using common database systems such
        as PostgreSQL, MSSQL or MongoDB.
      guidance: 'Databases must be secured and only accessible to users within the same project.

        If shared (multi-tenant) database servers are used, database administrators must ensure that the
        database server enforces segregation of users and databases belonging to different projects.'
      importance: Optional
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-1a1dd29e1bac4f1c9f137debcc2a3b51
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Database administration and secure access policies directly support managed database
          access for data consumers.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 2.1.18
      statement: Your TRE could integrate with large-scale data analytics tools for working with large
        datasets.
      guidance: 'For example, Spark and Hadoop can be used for distributed computing across a cluster.

        This may be an advantage where a TRE is using an amount of data that is too large for single-machine
        computing to be practical.'
      importance: Optional
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-1a1dd29e1bac4f1c9f137debcc2a3b51
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Scalable compute and HPC integration provide large-dataset processing capacity; research-tool
          evaluation supports selecting analytics applications.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    editorial_summary: null
    mapping_review_status: reviewed
  - id: '2.2'
    name: Infrastructure Management
    requirements:
    - id: 2.2.01
      statement: You must have a documented procedure for deploying infrastructure.
      guidance: This might, for instance, be a handbook that is followed or a set of automated scripts.
      importance: Mandatory
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-b106251e04304d2a92637a1fd5689273
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Infrastructure-as-code deployment and maintained operational procedures directly support
          documented infrastructure deployment.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 2.2.02
      statement: You should, where possible, automate any repeatable aspects of your deployment.
      guidance: This might involve using infrastructure-as-code tools or a series of scripts.
      importance: Recommended
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-b106251e04304d2a92637a1fd5689273
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Infrastructure automation and configuration tooling directly support repeatable automated
          deployments.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 2.2.03
      statement: You must have a documented procedure for making changes to deployed infrastructure.
      guidance: 'This refers both to changes that might be expected in the course of normal operation
        and emergency changes that might be needed.

        Your change management process may form part of a wider accreditation such as ISO 27001.'
      importance: Mandatory
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-b106251e04304d2a92637a1fd5689273
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Controlled change processes and documented configuration management directly support
          changes to deployed infrastructure.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 2.2.04
      statement: You must test changes before they are used in production.
      guidance: This might involve a separate development environment or another system for testing.
      importance: Mandatory
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-b106251e04304d2a92637a1fd5689273
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Pre-deployment functional and security testing directly validates changes before production
          use.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 2.2.05
      statement: You should have a development environment that mirrors your production environment which
        you use to test infrastructure changes before committing them to production.
      guidance: 'If possible, you should automate application of changes between development and production
        environments.

        Consider the costs and practicality of whether this will work for your situation.'
      importance: Recommended
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-b106251e04304d2a92637a1fd5689273
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Repeatable environment configuration and deployment testing directly support testing
          infrastructure changes in a production-like development environment.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 2.2.06
      statement: You must have a documented procedure for removing infrastructure when it is no longer
        needed.
      guidance: Removing unused infrastructure not only reduces costs and management burden but also reduces
        the attack surface of a TRE and reduces the risk of unaddressed vulnerabilities.
      importance: Mandatory
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-b106251e04304d2a92637a1fd5689273
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Provisioning lifecycle administration and controlled change processes directly support
          planned infrastructure removal.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 2.2.07
      statement: You should understand the availability and uptime guarantees of any providers that you
        rely on.
      guidance: 'For remote TREs this might include your cloud provider(s) and/or data centre operators.

        For on-premises TREs, it might be worth using an uninterruptible power supply (UPS) and planning
        how you would deal with internet outages.'
      importance: Recommended
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-b106251e04304d2a92637a1fd5689273
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Service-level agreements and provider management directly support understanding suppliers'
          availability guarantees.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 2.2.08
      statement: You should develop an availability target or statement and share this with your users.
      guidance: Understanding how and when the TRE might be unavailable will help your projects in planning
        their work.
      importance: Recommended
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-b106251e04304d2a92637a1fd5689273
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Defining service objectives and reporting service quality directly supports publishing
          an availability commitment to users.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 2.2.09
      statement: Your TRE must control and manage all of its network infrastructure in order to protect
        information in systems and applications.
      guidance: 'Network infrastructure must prevent unauthorised access to resources on the network.

        This may include firewalls, network segmentation, and restricting connections to the network.'
      importance: Mandatory
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-b106251e04304d2a92637a1fd5689273
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Network segmentation, routing, access controls and policy design directly support controlled
          TRE network infrastructure.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 2.2.10
      statement: Your TRE must not allow connectivity between users in different projects, or with access
        to different datasets.
      guidance: Connectivity between users in the same project may be allowed, for example to support
        shared network services within the project.
      importance: Mandatory
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-b106251e04304d2a92637a1fd5689273
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Network segmentation and isolated workspaces directly prevent connectivity between
          projects and datasets with different access rights.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 2.2.11
      statement: Your TRE must block outbound connections to the internet by default.
      guidance: Limited outbound connectivity may be allowed for some services.
      importance: Mandatory
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-b106251e04304d2a92637a1fd5689273
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Network access policies and routing controls directly support a default-deny outbound
          network boundary.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 2.2.12
      statement: You should monitor the configuration of your TRE to check for misconfigurations and vulnerabilities.
      guidance: This may include regular vulnerability scanning, and penetration testing.
      importance: Recommended
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-b106251e04304d2a92637a1fd5689273
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Configuration verification and vulnerability scanning directly support finding insecure
          states and exploitable components.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 2.2.13
      statement: Your TRE must record usage data.
      guidance: This may include the number of users, number of projects, the amount of data stored, number
        of datasets, the number of workspaces, etc.
      importance: Mandatory
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-b106251e04304d2a92637a1fd5689273
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Operational telemetry and activity logging directly support recording TRE usage.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 2.2.14
      statement: Your TRE should record which datasets are accessed, when and by who.
      guidance: This helps maintain auditability of how sensitive data has been used.
      importance: Recommended
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-b106251e04304d2a92637a1fd5689273
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: User activity logs and provenance tracking directly support recording who accessed
          datasets and when.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 2.2.15
      statement: Your TRE should record computational resource usage at the user or aggregate level.
      guidance: This is useful for optimising allocation of resources, and managing costs.
      importance: Recommended
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-b106251e04304d2a92637a1fd5689273
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Resource telemetry and usage/cost reporting directly support user- or aggregate-level
          computational usage records.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    editorial_summary: null
    mapping_review_status: reviewed
  - id: '2.3'
    name: Capacity Management
    requirements:
    - id: 2.3.01
      statement: You must ensure that all project members understand what resources are available and
        what the associated costs will be before the project starts.
      guidance: 'For on-premises systems this might be related to the available hardware, for cloud-based
        systems there might be limits on how many instances of a particular resource (*e.g.* GPUs) can
        be used.

        Projects should use this information to understand whether the available resources will be sufficient
        for their requirements.'
      importance: Mandatory
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-2f5f0a5b8a8b48a9b284aa2c6bc8faf6
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Costing models, resource reports and project planning directly support explaining resource
          limits and costs before work starts.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 2.3.02
      statement: You should ensure that the anticipated needs of projects can be satisfied using available
        resources.
      guidance: Note that this does not require you to accept requests for additional resources, but rather
        that promises made about resource availability before a project starts should be honoured wherever
        possible.
      importance: Recommended
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-2f5f0a5b8a8b48a9b284aa2c6bc8faf6
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Capacity planning and allocation strategies directly support checking expected workloads
          against available resources.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 2.3.03
      statement: You must have a procedure for allocating available resources among projects.
      guidance: 'For cloud-based TREs this may involve scaling resources, such as virtual machines or
        databases, or deploying additional resources.

        For on-premises TREs this may involve a procurement process to ensure that necessary resources
        are available.

        Not all requests for capacity increase must necessarily be granted, but having a clear process
        will help projects understand when/why/how they can make use of additional capacity.'
      importance: Mandatory
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-2f5f0a5b8a8b48a9b284aa2c6bc8faf6
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Defined allocation processes and resource governance directly support distributing
          capacity among projects.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 2.3.04
      statement: You must ensure that the anticipated resource requirements will not result in overspending
        by the TRE.
      guidance: 'For cloud-based TREs this may involve budgeting and/or restricting resource consumption
        on a project-by-project basis.

        For on-premises TREs this may involve managing expectations to match the available resource.'
      importance: Mandatory
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-2f5f0a5b8a8b48a9b284aa2c6bc8faf6
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Budget monitoring, costing models and financial governance directly support preventing
          projected resource use from exceeding TRE budgets.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    editorial_summary: null
    mapping_review_status: reviewed
  - id: '2.4'
    name: Configuration Management
    requirements:
    - id: 2.4.01
      statement: You must have a documented procedure for configuring infrastructure.
      guidance: This might, for instance, be a handbook that is followed or a set of automated scripts.
      importance: Mandatory
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-4512cf0c27f046b491dca59957a3732f
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Configuration procedures and maintained implementation documentation directly support
          documented infrastructure configuration.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 2.4.02
      statement: You should use configuration management tools to automate application of your configuration
        wherever possible.
      guidance: This might involve configuration-as-code tools such as Ansible, Chef, Puppet or Windows
        Desired State Configuration or simply automated scripts.
      importance: Recommended
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-4512cf0c27f046b491dca59957a3732f
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Automated configuration application and remediation are explicitly part of configuration
          management.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 2.4.03
      statement: You should be able to verify whether the configuration is valid.
      guidance: This might, for instance, involve running your configuration management tool in ‘check’
        mode.
      importance: Recommended
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-4512cf0c27f046b491dca59957a3732f
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Configuration compliance checks and validation tests directly support checking that
          a configured system is valid.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 2.4.04
      statement: You should regularly verify your TRE configuration.
      guidance: This will limit the amount of time the TRE can spend in a non-compliant state.
      importance: Recommended
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-4512cf0c27f046b491dca59957a3732f
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Regular state verification and compliance monitoring are explicit configuration-management
          activities.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 2.4.05
      statement: You must be able to replace a non-compliant TRE with a compliant system.
      guidance: This might involve reconfiguring a running system or by replacing it with a compliant
        one.
      importance: Mandatory
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-4512cf0c27f046b491dca59957a3732f
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Replacement processes and repeatable infrastructure deployment directly support replacing
          non-compliant environments with compliant configurations.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    editorial_summary: null
    mapping_review_status: reviewed
  - id: '2.5'
    name: Information Security
    requirements:
    - id: 2.5.01
      statement: Your TRE must comply with specific regulatory requirements due to the types of data it
        is hosting.
      guidance: 'Regulatory frameworks often emphasise the need for security controls to protect sensitive
        data.

        Compliance with these regulations could require organisations to implement specific security measures
        to safeguard their TRE from unauthorised access.'
      importance: Mandatory
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-99ff165db6264d4ba94b36d9d014f9f4
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Data-protection obligations, healthcare-specific controls and security-control implementation
          directly contribute to regulatory security requirements appropriate to the hosted data.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 2.5.02
      statement: Your TRE could use threat modelling definition to identify areas of risk to infrastructure.
      guidance: 'Understanding threats to the TRE may be challenging. Threat modelling provides a structured
        process for TREs to understand and assess threats.


        Information on threat models here:

        https://owasp.org/www-community/Threat_Modeling'
      importance: Optional
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-99ff165db6264d4ba94b36d9d014f9f4
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Security design reviews and risk-oriented testing directly support identifying infrastructure
          threats and selecting mitigations.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 2.5.03
      statement: Your TRE must maintain security logs of significant events and have a process for reviewing
        these logs to detect and respond to suspicious activity.
      guidance: 'Security logs should be tamper-proof and capture, at a minimum, authentication events
        (successful and failed), privileged or administrative actions, changes to access controls or system
        configuration, and data access or egress events.

        Logs must be protected against tampering or deletion, and retained for a period appropriate to
        your data retention policy and any regulatory obligations.'
      importance: Mandatory
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-99ff165db6264d4ba94b36d9d014f9f4
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Secure event collection, monitoring and incident investigation directly support reviewing
          security logs and responding to suspicious activity.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    editorial_summary: null
    mapping_review_status: reviewed
  - id: '2.6'
    name: Cyber Resilience
    requirements:
    - id: 2.6.01
      statement: You should keep backups of data and research environments, provided that this is permitted
        by law.
      guidance: 'Keeping backups could help reduce the impact of events like accidental deletion and data
        corruption on work in a TRE.

        TRE developers may want to consider how different elements such as sensitive input data or users’
        workspaces may be backed up, and whether they should be.'
      importance: Recommended
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-e6599acb78e64dd68bd2fe8ea346589a
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Backup policies and restoration processes directly support lawful backups of data and
          research environments.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 2.6.02
      statement: You should build redundancy into infrastructure and storage.
      guidance: 'Infrastructure should be as resilient as necessary to interruption.

        This could include redundant infrastructure in different physical locations, load balancing and
        replication of data between multiple storage locations.'
      importance: Recommended
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-e6599acb78e64dd68bd2fe8ea346589a
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Resilient architecture and cloud resource design directly support redundant infrastructure
          and storage.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 2.6.03
      statement: You should keep backups of infrastructure, applications and configurations.
      guidance: This may include virtualised infrastructure snapshots which can be restored as needed
        to recover from failure.
      importance: Recommended
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-e6599acb78e64dd68bd2fe8ea346589a
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Backup infrastructure and recoverable configuration management directly support restoring
          applications, infrastructure and their configuration.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 2.6.04
      statement: You must have procedures in place for rapid incident response.
      guidance: 'There may be legal requirements to disclose details of any incidents, such as data breaches
        for organisations subject to GDPR.

        Having robust processes in place will ensure a swift and effective response when an incident occurs.'
      importance: Mandatory
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-e6599acb78e64dd68bd2fe8ea346589a
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Security incident plans and emergency containment procedures directly support rapid
          coordinated incident response.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 2.6.05
      statement: You should test your incident response through simulation.
      guidance: 'During simulated incidents the TRE organisation can measure their effectiveness.

        This may involve people across the broader enterprise and/or external suppliers.'
      importance: Recommended
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-e6599acb78e64dd68bd2fe8ea346589a
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Incident preparedness and response improvement directly support response exercises;
          testing expertise supports constructing and evaluating scenarios.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    editorial_summary: null
    mapping_review_status: reviewed
  - id: '2.7'
    name: Vulnerability Management
    requirements:
    - id: 2.7.01
      statement: You should have an application in place to scan for vulnerabilities across infrastructure.
      guidance: 'Software used to identify vulnerabilities should also report and alert.

        Such an alert should be triaged, risk assessed and treated accordingly.'
      importance: Recommended
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-4beb6beb8a5a4f00ab300ebfc0a12fa6
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Vulnerability scanning and security assessment directly support operating infrastructure
          vulnerability detection.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 2.7.02
      statement: You must have a process in place for applying security updates to all software that forms
        part of the TRE infrastructure.
      guidance: This includes any software used for remote desktop portals, databases, webapps, creating
        and destroying compute infrastructure, configuration management, or software used for monitoring
        the TRE.
      importance: Mandatory
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-4beb6beb8a5a4f00ab300ebfc0a12fa6
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Security-update processes and risk-based remediation directly address applying infrastructure
          software patches.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 2.7.03
      statement: Infrastructure should be automatically patched for vulnerabilities.
      guidance: 'Planning will be required across infrastructure and software systems to ensure security
        patches remain available from suppliers.

        Many systems may be isolated from the internet making TRE infrastructure more difficult to automatically
        patch.'
      importance: Recommended
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-4beb6beb8a5a4f00ab300ebfc0a12fa6
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Automated patch management and configuration remediation directly support automated
          vulnerability fixes.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 2.7.04
      statement: You should carry out penetration tests on your TRE.
      guidance: 'By intentionally attempting to breach their TRE, organisations can proactively discover
        unnoticed vulnerabilities before they are exploited maliciously.

        Tests can evaluate the effectiveness of security controls in preventing data breaches, unauthorised
        access, or other security incidents.'
      importance: Recommended
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-4beb6beb8a5a4f00ab300ebfc0a12fa6
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Penetration testing is an explicit security assessment activity.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 2.7.05
      statement: You should update the security controls of your TRE based on the results of security
        tests.
      guidance: 'Security testing can reveal bugs and discrepancies in the TRE architecture which should
        be addressed in advance of sensitive data being uploaded, or with urgency in the case of an operational
        TRE.

        Regular testing will allow organisations to refine their TRE security controls and incident response
        capabilities.

        It enables them to adapt to any new security concerns that may arise as a result of changes in
        the underlying software.'
      importance: Recommended
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-4beb6beb8a5a4f00ab300ebfc0a12fa6
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Assessment findings and control improvement directly support changing controls in response
          to security tests.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 2.7.06
      statement: You should publish details of your security testing strategy and, where possible, the
        results of each test.
      guidance: 'Knowledge that regular security testing occurs will help to ensure stakeholders, including
        data consumers and information asset owners, can trust that the data they work with or are responsible
        for is secure within a TRE.

        If security flaws are identified in a test, it may not be sensible to publicise these until a
        fix is in place.'
      importance: Recommended
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-4beb6beb8a5a4f00ab300ebfc0a12fa6
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Controlled operational documentation directly supports publishing the testing strategy;
          security assessment supplies the strategy and report content. Publication decisions remain with
          the TRE.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    editorial_summary: null
    mapping_review_status: reviewed
  - id: '2.8'
    name: Encryption
    requirements:
    - id: 2.8.01
      statement: Your TRE must encrypt project and user data at rest.
      guidance: 'This prevents unauthorised access to the data even if the storage media is compromised.

        This may involve encrypted filesystems or tools to encrypt and decrypt data on demand.

        The encryption keys may be managed by the TRE operator or by a trusted external actor, for example
        a cloud provider.'
      importance: Mandatory
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-8ea211603b254c87bdb5d143f7fd08ce
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Cryptographic implementation and key administration explicitly protect stored sensitive
          data.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 2.8.02
      statement: Your TRE must encrypt data when in transit between the TRE and external networks or computers.
      guidance: 'Data encryption must be used to safeguard against interception or tampering during transmission.

        This includes both data ingress and egress and users accessing the TRE, for example over a remote
        desktop or shell session.'
      importance: Mandatory
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-8ea211603b254c87bdb5d143f7fd08ce
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Secure transport encryption and cryptographic standards directly protect data crossing
          the TRE boundary.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 2.8.03
      statement: Your TRE should encrypt data when in transit inside the TRE.
      guidance: If possible, data transfers between different components of a TRE should also be encrypted.
      importance: Recommended
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-8ea211603b254c87bdb5d143f7fd08ce
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Cryptographic controls for data in transit directly support encrypting internal TRE
          network traffic.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 2.8.04
      statement: You should use encryption algorithms and software that are widely accepted as secure.
      guidance: 'Encryption algorithms widely accepted as secure today may become insecure in the future,
        for instance due to newly-identified flaws, or advances in compute capabilities.

        The latest security patches and updates should be applied to any encryption software being used
        by the TRE.

        This helps address any known vulnerabilities or weaknesses in the encryption implementation.'
      importance: Recommended
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-8ea211603b254c87bdb5d143f7fd08ce
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Algorithm selection and implementation against security standards directly support
          choosing accepted secure cryptography.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 2.8.05
      statement: Your TRE should use secure key management.
      guidance: TREs should employ secure key management practices, including storing encryption keys
        separately from the encrypted data and implementing strong access controls (*e.g.* Single Sign
        On) for key management systems.
      importance: Recommended
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-8ea211603b254c87bdb5d143f7fd08ce
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Key generation, storage, access controls and lifecycle governance are explicit key-management
          activities.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    editorial_summary: null
    mapping_review_status: reviewed
  - id: '2.9'
    name: Physical Security
    requirements:
    - id: 2.9.01
      statement: Your TRE could offer physical protection measures against data leakage or theft via physical
        means.
      guidance: 'Restricting access to research facilities containing computers logged into TREs can help
        prevent malicious actors from viewing or stealing sensitive data, for example by photographing
        a computer screen.

        Physical controls on access to a TRE could include surveillance systems, restricting physical
        access to authorised personnel only, visitor management systems and employee training.'
      importance: Optional
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-99ff165db6264d4ba94b36d9d014f9f4
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: The competency explicitly includes deploying physical safeguards against data and system
          compromise.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    editorial_summary: null
    mapping_review_status: reviewed
- id: '3'
  name: 3. Data Management
  scope: core
  components:
  - id: '3.1'
    name: Data Lifecycle Management
    requirements:
    - id: 3.1.01
      statement: You must have processes in place to assess the legal and regulatory implications of handling
        the data through its full lifecycle.
      guidance: 'This involves considering your obligations to data controllers and subjects, and whether
        any security controls may be legally or contractually required.

        An assessment of the risks involved will also be needed.

        It may involve classifying the project into a predefined sensitivity category or defining bespoke
        controls.'
      importance: Mandatory
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-b039ff3b59d047f0b6e9bd95ec5f7c6f
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Data-protection assessments and information-governance controls directly address legal
          and regulatory obligations throughout data handling.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 3.1.02
      statement: You should consult appropriately and keep records of data handling decisions.
      guidance: Decisions affecting data about the public should have public involvement in TRE operations
        or governance, with records of decisions made available for inspection by all stakeholders.
      importance: Recommended
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-b039ff3b59d047f0b6e9bd95ec5f7c6f
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: supporting_only
        rationale: Governance assessment and controlled documentation support recording and consulting
          on handling decisions; public involvement is not an explicit competency.
        framework_gap: Governance assessment and controlled documentation support recording and consulting
          on handling decisions; public involvement is not an explicit competency.
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 3.1.03
      statement: Information asset owners must classify data sets according to a common process and data
        classification methodology.
      guidance: 'To classify the data, information asset owners must have a good understanding of the
        datasets and the process of classification.

        Once classified, data can be stored in a TRE with an appropriate security controls (see later
        section on security levels and tiering), which can factor in the requirements for confidentiality,
        integrity and availability of the data.'
      importance: Mandatory
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-b039ff3b59d047f0b6e9bd95ec5f7c6f
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Classification methodologies, labels and handling policies directly support consistent
          sensitivity classification by asset owners.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 3.1.04
      statement: You must have a data ingress process which enforces information governance rules/processes.
      guidance: 'The data ingress process needs to ensure that information governance is correctly followed.

        In particular, it should require that an ingress request has been approved by all required parties.'
      importance: Mandatory
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-b039ff3b59d047f0b6e9bd95ec5f7c6f
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Secure ingestion pipelines and approval-capable airlocks implement ingress while governance
          skills define and enforce the required approvals.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 3.1.05
      statement: You must have a data egress process which enforces information governance rules/processes.
      guidance: 'The data egress process needs to ensure that information governance requirements are
        adhered to.

        In particular, it should require that an egress request has been approved by all required parties.'
      importance: Mandatory
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-b039ff3b59d047f0b6e9bd95ec5f7c6f
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Airlock approval workflows and governance controls directly support authorised and
          recorded data release.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 3.1.06
      statement: Egress must be limited to the information asset owners or their delegates.
      guidance: 'Egress of data from a TRE must be a specific permission associated with individual users.

        This permission must be given by information asset owners.

        Egress may still require further approval (see 3.1.05).'
      importance: Mandatory
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-b039ff3b59d047f0b6e9bd95ec5f7c6f
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Role permissions and privilege reviews directly support restricting the egress permission
          to owners or authorised delegates.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 3.1.07
      statement: Your data egress process could sometimes require project-independent approval.
      guidance: 'There may be cases where there are multiple stakeholders for a piece of analysis including
        information asset owners, data analysts, data subjects, the TRE operator.

        A data egress process may then require approval from people not on the project team, for example
        an external referee or TRE operator representative.'
      importance: Optional
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-b039ff3b59d047f0b6e9bd95ec5f7c6f
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Output governance workflows can assign release decisions to reviewers independent of
          the project team.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 3.1.08
      statement: You must keep a record of what data your TRE holds.
      guidance: 'Good records are important for ensuring compliance with legislation, understanding risk
        and aiding good data hygiene.

        The record should include a description of the data, its source, contact details for the information
        asset owner, which projects use the data, the date it was received, when it is expected to no
        longer be needed.'
      importance: Mandatory
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-b039ff3b59d047f0b6e9bd95ec5f7c6f
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Catalogue metadata and catalogue governance directly support recording held datasets,
          ownership, provenance and usage context.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 3.1.09
      statement: You must have a policy on data deletion.
      guidance: 'There should be a clear, published policy on when data will be retained or deleted.

        This may allow time for data owners to consider outputs they may want to extract from the TRE.

        Any sensitive data, including all backups, should be deleted when they are no longer needed.

        Having clear policies will help to avoid problems with data being kept longer than necessary or
        accidental deletion of outputs.'
      importance: Mandatory
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-b039ff3b59d047f0b6e9bd95ec5f7c6f
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Retention-policy design and secure-disposal strategies directly support a documented
          deletion policy covering retained data.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 3.1.10
      statement: You should have a method of providing proof of deletion/removal of files.
      guidance: 'Information asset owners may require certification of the deletion of files.

        You should have a method of providing proof of deletion if challenged.'
      importance: Recommended
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-b039ff3b59d047f0b6e9bd95ec5f7c6f
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: supporting_only
        rationale: Secure-disposal practice and audit records support deletion evidence; explicit certification
          or verification of irreversible deletion is not defined.
        framework_gap: Secure-disposal practice and audit records support deletion evidence; explicit
          certification or verification of irreversible deletion is not defined.
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 3.1.11
      statement: You should log how input data is modified.
      guidance: 'If the input data is mutable a TRE should keep records of its modification.

        For example, when the data was modified and by who.'
      importance: Recommended
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-b039ff3b59d047f0b6e9bd95ec5f7c6f
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Transformation lineage and activity logging directly record changes to input data and
          the responsible actors.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 3.1.12
      statement: You must, to a reasonable extent, prevent unauthorised data ingress or egress.
      guidance: 'Movement of data which has not been subject to information governance processes risks
        breaking rules and is more likely to result in a data breach.

        However, it is difficult to control for every possibility.

        For example, a user may take pictures of their computer screen to remove data, or use a device
        presenting as a USB HID keyboard to input large amounts of text.

        An example of a reasonable measure would be for a remote desktop based TRE to prevent data being
        copied from a local machine’s clipboard to a workspace.'
      importance: Mandatory
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-b039ff3b59d047f0b6e9bd95ec5f7c6f
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Workspace isolation, network restrictions and controlled transfer applications directly
          support preventing unauthorised ingress and egress.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 3.1.13
      statement: Data held within the TRE should be the minimum required for analysis or research.
      guidance: 'Data stored and processed within the TRE should be limited to the amount required for
        that purpose.

        This increases the level of protection for data subjects, makes it easier to comply with data
        protection legislation and could reduce the overhead of storage and processing.'
      importance: Recommended
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-b039ff3b59d047f0b6e9bd95ec5f7c6f
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Privacy controls and data-protection impact assessments directly support limiting retained
          project data to its permitted research purpose.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 3.1.14
      statement: Archived data within the TRE should be read only.
      guidance: 'Archived data by its very nature should not change and therefore be maintained as a read
        only store.

        If an update is required, it may be pulled from archive into a separate operational store.'
      importance: Recommended
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-b039ff3b59d047f0b6e9bd95ec5f7c6f
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Storage access policies and secure database administration can enforce read-only archived
          stores.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 3.1.15
      statement: Long-term archives should be held in simple, standard formats to ensure accessibility.
      guidance: 'Some data archives may be required by policy or legislation to be kept for very long
        periods within the scope of the TRE.

        Such data should be held in the simplest possible file format, conforming to international standards
        if available, to ensure they are platform and application agnostic.'
      importance: Recommended
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-b039ff3b59d047f0b6e9bd95ec5f7c6f
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: supporting_only
        rationale: Archival and long-term accessibility practice supports preservation; selection of simple
          international-standard archival file formats is not explicit.
        framework_gap: Archival and long-term accessibility practice supports preservation; selection
          of simple international-standard archival file formats is not explicit.
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 3.1.16
      statement: Where a project intends to train or fine-tune machine learning models on sensitive data,
        you should ensure a data management plan for ML artefacts is agreed prior to project commencement.
      guidance: 'The plan should cover the types of models supported, whether and under what conditions
        trained models may be exported and any additional risk mitigations required.

        Where AI/ML models are used operationally, the TRE may require a register of use plan and a decommissioning
        plan.

        These processes may be documented within a single document or across existing relevant policies,
        procedures, and operational documentation.'
      importance: Recommended
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-b039ff3b59d047f0b6e9bd95ec5f7c6f
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Permitted-use records, artefact retention dependencies and model release controls supply
          the permissions, disposition and export conditions needed for an ML data-management plan.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 3.1.17
      statement: You must be able to specify what categories of data your TRE is able to support.
      guidance: 'Your TRE must provide an explanation of the kinds of data it has been designed to hold,
        with reference to its security capabilities, that can be understood by all stakeholders.

        Relevant stakeholders may include information asset owners and project teams and they may have
        different levels of technical expertise.'
      importance: Mandatory
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-b039ff3b59d047f0b6e9bd95ec5f7c6f
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Sensitivity classification and documented security architecture support explaining
          which data categories the environment can safely handle.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 3.1.18
      statement: Your TRE could support projects with differing security requirements through configurable
        security controls.
      guidance: 'This allows projects with different security requirements to each be met with a suitable
        level of controls.

        It helps ensure that users can work effectively, with minimal barriers.'
      importance: Optional
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-b039ff3b59d047f0b6e9bd95ec5f7c6f
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Security architecture and contextual access policies directly support configuring project-specific
          security controls.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 3.1.19
      statement: Your TRE could offer a pre-defined set of security control tiers.
      guidance: 'Security control tiers can be designed to cover the types of project or data you expect
        to handle.

        Projects may be placed into the most suitable tier rather than having a bespoke design.

        This reduces the number of unique configurations that need to be supported.'
      importance: Optional
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-b039ff3b59d047f0b6e9bd95ec5f7c6f
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Common sensitivity categories and repeatable security architecture support predefined
          control tiers rather than bespoke configurations.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 3.1.20
      statement: Metadata should be checked for disclosure risk at the point of data upload
      guidance: Metadata can be informative about data subjects even if no figures are produced (e.g.
        names of data collection points identify location of respondents). As this is a dataset risk,
        not a research risk, this should be checked when the dataset is added to the TRE.
      importance: Recommended
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-b039ff3b59d047f0b6e9bd95ec5f7c6f
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Disclosure-risk assessment directly supports checking identifying or revealing dataset
          metadata at upload.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    editorial_summary: null
    mapping_review_status: reviewed
  - id: '3.2'
    name: Identity and Access Management
    requirements:
    - id: 3.2.01
      statement: You must not create user accounts for use by more than one person.
      guidance: It is important that each user account should be used by one, and only one, person in
        order to facilitate the assignment of roles or permissions and to log the actions of individuals.
      importance: Mandatory
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-61a1ee491f29467abc1d99172ac34504
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Account lifecycle procedures and identity governance directly support individually
          assigned rather than shared accounts.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 3.2.02
      statement: You must be reasonably convinced of the identity of each person being granted an account.
      guidance: 'It is important to ensure an account has been given to the correct person.

        For example, multiple credentials may be used before account creation to verify identity or, when
        appropriate, photo ID checks may be required.'
      importance: Mandatory
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-61a1ee491f29467abc1d99172ac34504
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Onboarding identity verification and authentication mechanisms directly support establishing
          the identity of the person receiving an account.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 3.2.03
      statement: You must restrict a user’s access to only data required in their work.
      guidance: 'There is no need to grant an individual access to data they do not require.

        Access may be assigned in a manner appropriate to a TREs design, for example through roles granted
        to user accounts or through isolated project workspaces.'
      importance: Mandatory
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-61a1ee491f29467abc1d99172ac34504
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Privilege reviews, role permissions and attribute policies directly limit dataset access
          to each user's work.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 3.2.04
      statement: You must ensure that multi-factor authentication is enabled for all users.
      guidance: 'Multi-factor authentication ensures that to successfully connect a user must have more
        than one piece of evidence in different categories.

        Categories include something the user knows (*e.g.* a password), something the user possesses
        (*e.g.* a TOTP key) or something the user is (*e.g.* biometric data).

        A TRE does not need to implement multi-factor authentication checks itself if it is provided by
        a third-party identity provider.'
      importance: Mandatory
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-61a1ee491f29467abc1d99172ac34504
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: MFA configuration and implementation are explicit entry and mid-level authentication
          skills.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 3.2.05
      statement: You could use federated authentication or single sign-on (SSO) for user login.
      guidance: 'Institutions that use a SSO for other applications may wish to extend this login capability
        to a TRE.

        This will simplify the login process for data consumers using a TRE and prevent them having to
        remember or store multiple login credentials.'
      importance: Optional
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-61a1ee491f29467abc1d99172ac34504
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: SAML, OAuth and OIDC federation directly provide institutional SSO and cross-organisation
          authentication.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 3.2.06
      statement: You could restrict access to particular networks or physical locations.
      guidance: 'Restricting access to a set of known, static, personal or institutional IP addresses
        can help avoid speculative attacks.

        When appropriate, access could also be restricted to physical locations with security controls
        and access requirements.'
      importance: Optional
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-61a1ee491f29467abc1d99172ac34504
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Network access restrictions and contextual attributes directly support network- or
          location-based access policies.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    editorial_summary: null
    mapping_review_status: reviewed
  - id: '3.3'
    name: Output Management
    requirements:
    - id: 3.3.01
      statement: You should have a system to help classify outputs.
      guidance: 'Removing data from a TRE can be a difficult process as there is potential for sensitive
        data to be revealed.

        Having guidance, processes and methods will help ensure that outputs are correctly classified
        and, furthermore, that outputs due to be openly published are identified.

        Encouraging openly published outputs will enhance a TRE''s impact and transparency. The [SDAP
        SDC Handbook](https://securedatagroup.org/guides-and-resources/sdc-handbook/) provides guidance
        and practical suggestions for setting up a system to classify outputs.'
      importance: Recommended
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-769b630239bb410a884dce9ee0f6745c
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Disclosure-risk analysis and review workflows directly support classifying output types
          and their release risks.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 3.3.02
      statement: TRE outputs should be limited to the minimum required for sharing results of any analyses.
      guidance: This decreases the risk of inadvertent disclosure, and makes it easier to comply with
        data protection legislation (*e.g.* GDPR).
      importance: Recommended
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-769b630239bb410a884dce9ee0f6745c
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Risk-based review decisions and release workflows directly support limiting outputs
          to those needed for sharing findings.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 3.3.03
      statement: You should establish the intended outputs of each project from the outset.
      guidance: Understanding what these outputs are likely to be and their sensitivity as early as possible
        will help prepare for their processing and publication.
      importance: Recommended
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-769b630239bb410a884dce9ee0f6745c
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Understanding research requirements and designing output review workflows directly
          support agreeing intended outputs during project setup.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 3.3.04
      statement: You must have a documented process for disclosure control of outputs from the TRE.
      guidance: 'This process should define expected risks and how to mitigate them.

        All TRE outputs must be subject to this process.

        You might choose to follow existing guidelines, for example around statistical disclosure.'
      importance: Mandatory
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-769b630239bb410a884dce9ee0f6745c
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Documented output-governance workflows and maintained operational procedures directly
          support a disclosure-control process.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 3.3.05
      statement: You must have a process for assigning responsibility for output checking.
      guidance: 'Output checkers should be given responsibility for checking outputs.

        They must follow your disclosure control process and will be responsible for any automated parts
        of this process.

        Output checking can help mitigate against unintentional data disclosure or leaks.'
      importance: Mandatory
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-769b630239bb410a884dce9ee0f6745c
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Output governance and review workflow design directly support assigning accountable
          output checkers.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 3.3.06
      statement: You should have a statistical basis to guide the decisions of an output checker on the
        safety of outputs.
      guidance: There should be a solid basis to allow decisions to be made about data based on risk factors
        such as re-identification of an individual or risk to commercial operations posed by outputs from
        the TRE.
      importance: Recommended
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-769b630239bb410a884dce9ee0f6745c
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: supporting_only
        rationale: Risk assessment and algorithm validation support implementing statistical checking
          criteria, but the framework's technical tooling focus does not explicitly establish specialist
          statistical disclosure-control judgment.
        framework_gap: Risk assessment and algorithm validation support implementing statistical checking
          criteria, but the framework's technical tooling focus does not explicitly establish specialist
          statistical disclosure-control judgment.
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 3.3.07
      statement: You must have a documented policy for handling disclosure risks associated with any outputs
        that cannot be manually checked.
      guidance: 'Some categories of output, for instance binary files or very large numeric files, can
        be difficult to manually check.

        If egress of such files is permitted then the risks of inadvertent disclosure must be mitigated
        and documented.

        Trained machine learning model weights are a particular example of an output that cannot be manually
        checked. Where models have been trained or fine-tuned on sensitive data within the TRE, there
        is a risk that the model has memorised sensitive records. The policy must address whether model
        artefacts may be exported, and if so, what technical controls are required before egress is approved.'
      importance: Mandatory
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-769b630239bb410a884dce9ee0f6745c
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Review governance and AI artefact release controls directly support policies for model
          weights and other outputs that cannot be manually inspected.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 3.3.08
      statement: You could create a semi-automated system for checks on common research outputs.
      guidance: 'Automation helps make decisions on outputs more consistent and reduces the overhead for
        output checkers.

        It''s unlikely however that a fully automated output checking system (without humans in the loop)
        would be appropriate, given the risks associated with accidental data disclosure.'
      importance: Optional
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-769b630239bb410a884dce9ee0f6745c
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Automated disclosure tools and review workflow engines directly support semi-automated
          checks for common output formats.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 3.3.09
      statement: TREs should generate, store, and retain a machine-readable record of all disclosure-control
        criteria applied to each set of outputs released from a project. This record must be associated
        with the specific output package to which it relates.
      guidance: 'TREs should record the configuration parameters used during output checking, including
        thresholds, suppression or perturbation rules, model requirements, risk-appetite settings, and
        tool or configuration versions.

        The record must be stored in a structured, machine-readable format (such as JSON or YAML), retained
        for audit, and linked unambiguously to the released output.'
      importance: Optional
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-769b630239bb410a884dce9ee0f6745c
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Machine-readable activity records and traceable output workflows directly support associating
          applied checking criteria with each released output package.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    editorial_summary: null
    mapping_review_status: reviewed
  - id: '3.4'
    name: Information Search and Discovery
    requirements:
    - id: 3.4.01
      statement: You should provide a metadata catalogue of available datasets for users.
      guidance: 'Metadata catalogues are particularly relevant for TREs with population-level data collection
        of general interest.

        Access to metadata catalogues should itself be subject to disclosure control, as metadata may
        reveal sensitive information about the datasets held.

        Metadata Catalogues may not be appropriate for TREs where each project has its own data sharing
        agreement with one or more data providers, or where datasets are particularly sensitive.'
      importance: Recommended
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-176cdec84e4c4db59c8d9ac973c1b857
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Metadata documentation, catalogue implementation and discovery governance directly
          support a user-facing dataset catalogue.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 3.4.02
      statement: You should have a consistent and easily accessible metadata data model or similar to
        describe what a data asset contains.
      guidance: 'Where possible, existing data models should be employed (and extended if necessary).

        More detailed information on the data schema for data assets should also be provided to assist
        researchers in understanding what data may be available without the need to see the underlying
        data.'
      importance: Recommended
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-176cdec84e4c4db59c8d9ac973c1b857
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Metadata standards and interoperable data models directly support consistent descriptions
          of available data assets.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 3.4.03
      statement: You could provide an interface application for data consumers and data subjects to query
        elements of the data.
      guidance: In order to make data findable, an application which queries the metadata or elements
        of the research data could be made more easily accessible than the data itself.
      importance: Optional
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-176cdec84e4c4db59c8d9ac973c1b857
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Discovery interfaces and secure query APIs directly support exposing permitted data
          information to researchers and data subjects.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 3.4.04
      statement: You could provide summary, abstracted or synthetic data to researchers without exposing
        the underlying data set.
      guidance: To reduce the need for access to row level data researchers could be provided with non-sensitive
        versions of the data either as summary data or using synthetic versions of the data for activities
        such as code development and cohort planning.
      importance: Optional
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-176cdec84e4c4db59c8d9ac973c1b857
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: supporting_only
        rationale: Disclosure-risk assessment and controls support safe summary or abstracted data; no
          competency explicitly covers generating or validating synthetic data products.
        framework_gap: Disclosure-risk assessment and controls support safe summary or abstracted data;
          no competency explicitly covers generating or validating synthetic data products.
        reviewer: null
        reviewed_on: '2026-11-03'
    editorial_summary: null
    mapping_review_status: reviewed
- id: '4'
  name: 4. Supporting Capabilities
  scope: core
  components:
  - id: '4.1'
    name: Business Continuity
    requirements:
    - id: 4.1.01
      statement: You should have a business continuity plan that includes consideration of loss of service
        for deployed TREs.
      guidance: 'This may be due to downtime from service providers, a breach, or loss of power.

        Your plan should detail your process for managing loss of service for deployed TREs, and evaluation
        of impact of such loss.'
      importance: Recommended
