    audit-compliance-monitoring:
      id: audit-compliance-monitoring
      name: Audit & Compliance Monitoring
      description: Audit & Compliance Monitoring ensures continuous verification of regulatory adherence through systematic
        tracking and reporting. This subdomain encompasses implementing comprehensive audit trail systems that record system
        and user activities, conducting regular compliance monitoring with structured reporting processes, and managing certification
        and accreditation programmes that collectively provide assurance that secure data environments maintain required standards
        while enabling effective oversight and continuous improvement.
      competencies:
        audit-trail-implementation:
          id: audit-trail-implementation
          name: Audit Trail Implementation
          description: Creates comprehensive records of system and user activities for security and compliance. Involves implementing
            logging capabilities, ensuring appropriate content and formats, designing comprehensive strategies, implementing
            secure collection and storage, developing enterprise architectures, and establishing governance frameworks to
            enhance audit capabilities.
          levels:
            entry:
              id: audit-trail-implementation-entry
              name: Entry Level
              skills:
              - Explains audit logging concepts, security requirements, and retention needs
              - Inspects audit log records and identifies standard event fields and formats
              - Can implement basic audit logging following guidelines
              qualifications: []
              core_concepts:
              - topic: Audit Logging Basics
                concepts:
                - Security Requirements
                - Retention Needs
                - Event Fields
                search_terms:
                - Audit logging basics healthcare
                - Standard event fields SDE logs
                why: Fundamental for ensuring that all data access and system events are recorded in a standardized, compliant
                  manner.
            mid:
              id: audit-trail-implementation-mid
              name: Mid Level
              skills:
              - Designs comprehensive audit logging strategies
              - Implements secure audit trail collection and storage
              - Ensures audit coverage across systems and processes
              qualifications:
              - issuer: Splunk
                description: Splunk Core Certified Power User (Exam)
                career_impact: Building robust audit logging and monitoring dashboards.
              core_concepts:
              - topic: Secure Audit Infrastructure
                concepts:
                - Comprehensive Logging Strategies
                - Secure Collection/Storage
                - System Coverage
                search_terms:
                - Secure audit trail storage health data
                - Implementing SDE logging strategies
                why: Required to design tamper-proof logging systems that can be relied upon during a security investigation
                  or compliance audit.
            senior:
              id: audit-trail-implementation-senior
              name: Senior Level
              skills:
              - Develops enterprise audit strategy and architecture
              - Establishes audit governance frameworks and policies
              - Leads audit capability enhancement initiatives
              qualifications: []
              core_concepts:
              - topic: Enterprise Audit Architecture
                concepts:
                - Audit Strategy
                - Governance Policies
                - Capability Enhancement
                search_terms:
                - Enterprise audit architecture SDE
                - Audit governance framework NHS
                why: Senior architects define the long-term vision for immutable, enterprise-wide observability across federated
                  SDE networks.
        compliance-monitoring-reporting:
          id: compliance-monitoring-reporting
          name: Compliance Monitoring & Reporting
          description: Continuously assesses and documents adherence to regulatory requirements and standards. Involves producing
            compliance reports, implementing monitoring programmes, analysing trends and issues, developing enterprise strategies,
            establishing reporting frameworks, and leading initiatives to enhance monitoring capabilities across the organisation.
          levels:
            entry:
              id: compliance-monitoring-reporting-entry
              name: Entry Level
              skills:
              - Describes compliance monitoring concepts and reporting workflows
              - Compiles routine compliance evidence and generates standard audit reports
              - Can produce basic compliance reports using established templates
              qualifications: []
              core_concepts:
              - topic: Routine Compliance Reporting
                concepts:
                - Monitoring Workflows
                - Evidence Compilation
                - Standard Audit Reports
                search_terms:
                - Routine compliance reporting healthcare
                - Compiling audit evidence NHS
                why: Ensures that daily or weekly compliance checks are executed and evidence is preserved accurately.
            mid:
              id: compliance-monitoring-reporting-mid
              name: Mid Level
              skills:
              - Implements compliance monitoring programmes and tools
              - Produces comprehensive compliance reporting and dashboards
              - Analyses compliance data to identify trends and issues
              qualifications:
