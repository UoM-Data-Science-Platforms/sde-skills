                - NHS data processor agreements
                - Vendor management health IT
                why: Vendors operating in SDEs must meet strict health data standards.
            senior:
              core_concepts:
              - topic: Strategic Procurement
                concepts:
                - Multi-cloud vendor strategy
                - Commercial frameworks (G-Cloud)
                - Long-term partnerships
                search_terms:
