domain:
  name: "Safe Technology & Engineering"
  subdomains:
    software-engineering:
      name: "Software Engineering"
      competencies:
        secure-coding-practices:
          name: "Secure Coding Practices"
          levels:
            entry:
              qualifications:
                - issuer: "ISC2"
                  description: "CSSLP (Certified Secure Software Lifecycle Professional) (Exam)"
                  career_impact: "Understanding secure coding practices from day one."
            mid:
              qualifications:
                - issuer: "GIAC"
                  description: "GIAC Secure Software Programmer (GSSP) (Exam)"
                  career_impact: "Writing secure code for SDE portals and APIs."
            senior:
              qualifications:
                - issuer: "EC-Council"
                  description: "CASE (Certified Application Security Engineer) (Exam)"
                  career_impact: "Leading secure application architecture and DevSecOps integration."
        testing-quality-assurance:
          name: "Testing & Quality Assurance"
          levels:
            entry:
              qualifications: []
            mid:
              qualifications:
                - issuer: "GitLab"
                  description: "GitLab Certified CI/CD Specialist (Exam)"
                  career_impact: "Building automated security testing (SAST/DAST) into deployment pipelines."
            senior:
              qualifications:
                - issuer: "AWS"
                  description: "AWS Certified DevOps Engineer - Professional (Exam)"
                  career_impact: "Enterprise CI/CD strategy and automation."
        microservices-api-design:
          name: "Microservices & API Design"
          levels:
            entry:
              qualifications: []
            mid:
              qualifications:
                - issuer: "Postman"
                  description: "Postman API Professional (Exam)"
                  career_impact: "Developing and testing secure APIs for interoperability."
            senior:
              qualifications:
                - issuer: "MuleSoft"
                  description: "MuleSoft Certified Platform Architect (Exam)"
                  career_impact: "Architecting complex API networks and integration platforms (e.g., HL7 FHIR integration)."

    infrastructure-deployment:
      name: "Infrastructure & Deployment"
      competencies:
        cloud-infrastructure-management:
          name: "Cloud Infrastructure Management"
          levels:
            entry:
              qualifications:
                - issuer: "AWS / Microsoft"
                  description: "AWS Certified Cloud Practitioner / Azure Fundamentals (Exam)"
                  career_impact: "Baseline cloud knowledge."
            mid:
              qualifications:
                - issuer: "AWS"
                  description: "AWS Certified Solutions Architect - Associate (Exam)"
                  career_impact: "Designing robust, secure cloud environments for TREs."
                - issuer: "Microsoft"
                  description: "Microsoft Certified: Azure Administrator Associate (Exam)"
                  career_impact: "Managing Azure-based SDE infrastructure."
            senior:
              qualifications:
                - issuer: "AWS"
                  description: "AWS Certified Solutions Architect - Professional (Exam)"
                  career_impact: "Architecting complex, multi-account landing zones for sensitive data."
                - issuer: "Microsoft"
                  description: "Microsoft Certified: Azure Solutions Architect Expert (Exam)"
                  career_impact: "Enterprise architecture for national-scale Azure SDEs."
                - issuer: "The Open Group"
                  description: "TOGAF 9 Certification (Exam)"
                  career_impact: "Standardizing enterprise architecture across federated platforms."
        containerisation-orchestration:
          name: "Containerisation & Orchestration"
          levels:
            entry:
              qualifications:
                - issuer: "Docker"
                  description: "Docker Certified Associate (DCA) (Exam)"
                  career_impact: "Foundational container knowledge for packaging research applications safely."
            mid:
              qualifications:
                - issuer: "CNCF"
                  description: "Certified Kubernetes Administrator (CKA) (Practical Exam)"
                  career_impact: "Managing secure K8s clusters for running analytical workloads."
            senior:
              qualifications:
                - issuer: "CNCF"
                  description: "Certified Kubernetes Security Specialist (CKS) (Practical Exam)"
                  career_impact: "Securing containerized health workloads against advanced threats."
        network-architecture:
          name: "Network Architecture"
          levels:
            entry:
              qualifications:
                - issuer: "CompTIA"
                  description: "CompTIA Network+ (Exam)"
                  career_impact: "Basic networking concepts."
            mid:
              qualifications:
                - issuer: "Cisco"
                  description: "Cisco Certified Network Associate (CCNA) (Exam)"
                  career_impact: "Core routing, switching, and VLAN segmentation."
                - issuer: "AWS"
                  description: "AWS Certified Advanced Networking - Specialty (Exam)"
                  career_impact: "Designing complex VPCs, Transit Gateways, and secure hybrid connectivity."
            senior:
              qualifications:
                - issuer: "Cisco"
                  description: "Cisco Certified Network Professional (CCNP) Enterprise (Exam)"
                  career_impact: "Enterprise network architecture for hospital/SDE connectivity."

    system-architecture:
      name: "System Architecture"
      competencies:
        secure-environment-design:
          name: "Secure Environment Design"
          levels:
            entry:
              qualifications: []
            mid:
              qualifications:
                - issuer: "Palo Alto Networks"
                  description: "Palo Alto Networks Certified Network Security Administrator (PCNSA) (Exam)"
                  career_impact: "Managing Next-Gen Firewalls protecting SDE perimeters."
            senior:
              qualifications:
                - issuer: "Palo Alto Networks"
                  description: "Palo Alto Networks Certified Network Security Engineer (PCNSE) (Exam)"
                  career_impact: "Advanced threat prevention and perimeter architecture."
        configuration-management:
          name: "Configuration Management"
          levels:
            entry:
              qualifications: []
            mid:
              qualifications:
                - issuer: "HashiCorp"
                  description: "HashiCorp Certified: Terraform Associate (Exam)"
                  career_impact: "De facto standard for provisioning secure, repeatable SDE infrastructure."
            senior:
              qualifications:
                - issuer: "AWS"
                  description: "AWS Certified DevOps Engineer - Professional (Exam)"
                  career_impact: "Automating governance and compliance through code."
