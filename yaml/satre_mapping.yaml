  - id: '4.2'
    name: Project and Programme Management
    requirements:
    - id: 4.2.01
      statement: You should ensure that all projects using your TRE have a named project manager.
      guidance: 'The project manager has responsibility to ensure the smooth running of the project.

        Their responsibilities may include budget management, tracking TRE status, managing communications
        with the TRE operations team, and other project support tasks.'
      importance: Recommended
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-f28b720cce80472ebb8aeb05b2ba6936
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Project planning, responsibility assignment and resource coordination directly support
          establishing accountable project management for each study.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    - id: 4.2.02
      statement: You should not give project managers direct access to the TRE.
      guidance: Doing so ensures a separation between those able to access sensitive data, and those overseeing
        access to sensitive data.
      importance: Recommended
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-f28b720cce80472ebb8aeb05b2ba6936
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
      mapping_assessment:
        result: direct
        rationale: Privilege governance and role policies directly support withholding researcher dataset
          access from project-management roles.
        framework_gap: null
        reviewer: null
        reviewed_on: '2026-11-03'
    editorial_summary: null
    mapping_review_status: reviewed
  - id: '4.3'
    name: Knowledge Management
    requirements:
    - id: 4.3.01
      statement: You must document all features of your TRE implementation.
      guidance: This includes ensuring all documentation is discoverable, clear, and able to be easily
        updated based on stakeholder feedback.
      importance: Mandatory
      architecture_url: https://satre-archimate.readthedocs.io/en/v2.0.0/?view=id-f28b720cce80472ebb8aeb05b2ba6936
      applicability:
        scope: core
        conditional: false
        assessment: pending
      mapping_review_status: reviewed
