                why: Entry staff need to understand how researchers request access
                  to data and how to process initial ethical documentation.
              qualifications: []
            mid:
              id: ethics-research-approval-systems-mid
              name: Mid Level
              skills:
              - Implements systems for tracking ethical approvals and requirements
