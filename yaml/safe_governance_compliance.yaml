                - Electronic Tracking Tools
                - Ethics Compliance Reviews
                - Study Protocol Alignment
                search_terms:
                - Research approval tracking SDE
                - Ethics compliance assessment health data
                why: Required to manage ongoing research projects and ensure their
                  actions align with the approved ethical constraints within the SDE.
              qualifications:
              - CIP (Certified IRB Professional)
            senior:
              id: ethics-research-approval-systems-senior
              name: Senior Level
              skills:
              - Develops ethical compliance strategies and frameworks
              - Establishes ethics governance and oversight processes
              - Leads initiatives to enhance ethical compliance
              core_concepts:
              - topic: Enterprise Ethical Governance Strategy
                concepts:
                - Ethical Governance Process Design
                - Oversight Frameworks
                - Enhancement Initiatives
                search_terms:
                - Enterprise research ethics governance NHS
                - Streamlining ethics approvals SDE
                why: Needed to build robust, scalable systems that balance the speed
                  of research with rigid ethical oversight.
              qualifications: []
    security-management:
      id: security-management
      name: Security Management
      description: Security Management establishes and maintains protections for data
        assets and systems within secure research environments. This subdomain focuses
        on implementing comprehensive technical, administrative, and physical security
        controls, conducting regular assessments and testing to verify effectiveness,
        and managing incident response processes that collectively ensure research
        data remains protected from unauthorised access or breaches while enabling
        appropriate recovery and improvement from security events.
      tools: []
      technologies: []
      standards: []
      competencies:
        security-controls-implementation:
          id: security-controls-implementation
          name: Security Controls Implementation
          description: Deploys technical, administrative, and physical safeguards
            to protect data and systems. Involves understanding control concepts,
            implementing basic and comprehensive security frameworks, evaluating effectiveness,
            mapping to compliance requirements, developing enterprise strategies,
            and leading maturity initiatives across the organisation.
          levels:
            entry:
              id: security-controls-implementation-entry
              name: Entry Level
              skills:
              - Classifies security control types, categories, and functions
              - Identifies common security controls and explains their risk reduction
                purpose
              - Can implement basic security controls following guidelines (e.g. password
                policies, firewall rules)
              core_concepts:
              - topic: Security Control Fundamentals
                concepts:
                - Password Policies
                - Firewall Rules
                - Control Classification
                search_terms:
                - Basic security controls health data
                - Implementing SDE firewall rules
                why: Understanding basic administrative and technical safeguards is
                  critical for minimizing risks to SDE environments.
              qualifications:
              - CompTIA Security+
            mid:
              id: security-controls-implementation-mid
              name: Mid Level
              skills:
              - Designs and implements comprehensive security control frameworks
              - Evaluates effectiveness and suitability of security controls
              - Maps controls to specific compliance requirements (e.g. GDPR Article
                32, ISO 27001 Annex A)
              core_concepts:
              - topic: Comprehensive Control Frameworks
                concepts:
                - GDPR Article 32 Mapping
                - ISO 27001 Annex A
                - Control Effectiveness Evaluation
                search_terms:
                - Mapping controls to GDPR Article 32
                - ISO 27001 implementation SDE
                why: Mid-level security engineers must translate regulatory requirements
                  into concrete, comprehensive technical safeguards.
              qualifications:
              - CISA (Certified Information Systems Auditor)
              - SSCP
            senior:
              id: security-controls-implementation-senior
              name: Senior Level
              skills:
              - Develops enterprise security control strategies
              - Establishes security control governance and oversight
              - Leads security control maturity initiatives
              core_concepts:
              - topic: Enterprise SDE Security Strategy
                concepts:
                - Security Governance
                - Maturity Initiatives
                - Enterprise Control Strategies
                search_terms:
                - Enterprise security controls SDE
                - Security governance framework health data
                why: Essential for directing the overarching security posture, ensuring
                  that implemented controls align with long-term strategic and compliance
                  goals.
              qualifications:
              - CISSP
              - CISM
        security-assessment-testing:
          id: security-assessment-testing
          name: Security Assessment & Testing
          description: Evaluates the effectiveness of security controls through testing
