domain:
  index: 3
  main-color: color-purple
  id: safe-governance-compliance
  name: Safe Governance & Compliance
  description: This domain covers the regulatory, ethical, and compliance aspects of operating Secure Data Environments, ensuring
    systems meet legal requirements and maintain appropriate controls.
  source_file: safe_governance_compliance.md
  subdomains:
    regulatory-compliance:
      id: regulatory-compliance
      name: Regulatory Compliance
      description: Regulatory Compliance ensures that secure data environments meet legal requirements and standards for handling
        sensitive healthcare information. This subdomain encompasses information governance frameworks, data protection compliance
        with laws like GDPR, adherence to healthcare-specific standards such as DSPT and NHS DTAC, implementation of specialised
        security frameworks, and management of ethics and research approval systems that collectively maintain legal and regulatory
        adherence across all aspects of data handling.
      competencies:
        information-governance:
          id: information-governance
          name: Information Governance
          description: Establishes and maintains frameworks for managing information assets securely and compliantly. Involves
            implementing governance controls, conducting assessments, ensuring system compliance, developing enterprise strategies,
            establishing oversight mechanisms, and leading maturity initiatives that align with organisational requirements
            and industry standards.
          levels:
            entry:
              id: information-governance-entry
              name: Entry Level
              skills:
              - Explains basic information governance principles (e.g. data minimisation, accountability)
              - Identifies key information governance frameworks (e.g. Caldicott Principles, ISO 27001)
              - Can follow established information governance procedures
              qualifications:
              - issuer: NHS
                description: NHS Data Security Awareness Training (Course)
                career_impact: Mandatory foundation for anyone interacting with UK health data environments.
              core_concepts:
              - topic: Basic Health Info Governance
                concepts:
                - Caldicott Principles
                - Data Minimisation
                - Accountability
                search_terms:
                - NHS Caldicott Principles
                - Information Governance basic principles healthcare
                why: Understanding the fundamental rules for handling patient data ensures that basic IG procedures are followed
                  in an SDE.
            mid:
              id: information-governance-mid
              name: Mid Level
              skills:
              - Implements information governance controls and processes
              - Conducts information governance assessments (e.g. data flow mapping, risk assessments)
              - Ensures systems comply with governance requirements
              qualifications:
              - issuer: BCS
                description: BCS Foundation Certificate in Information Security Management Principles (CISMP) (Exam)
                career_impact: Strong UK-centric framework for managing information security and governance.
              core_concepts:
              - topic: IG Risk & Assessments in SDEs
                concepts:
                - Data Flow Mapping
                - IG Risk Assessments
                - NHS IG Toolkit/DSPT
                search_terms:
                - NHS Data Security and Protection Toolkit
                - Data flow mapping healthcare SDE
                why: Mid-level practitioners must implement controls and assess the risks associated with moving and storing
                  sensitive health data.
            senior:
              id: information-governance-senior
              name: Senior Level
              skills:
              - Develops enterprise information governance strategies
              - Establishes governance frameworks and oversight mechanisms
              - Leads information governance maturity initiatives (e.g. implementing maturity models)
              qualifications:
              - issuer: ISACA
                description: CGEIT (Certified in the Governance of Enterprise IT) (Exam)
                career_impact: Executive-level governance framework management for national platforms.
              core_concepts:
              - topic: Enterprise IG Strategy for Health Data
                concepts:
                - Maturity Models
                - Enterprise IG Frameworks
                - Oversight Mechanisms
                search_terms:
                - Information Governance maturity model healthcare
                - Enterprise IG framework NHS
                why: Senior leaders need to design the overarching strategy and oversight for safe data handling across complex
                  federated SDEs.
        data-protection-compliance:
          id: data-protection-compliance
          name: Data Protection Compliance
          description: Ensures adherence to data protection laws and regulations such as GDPR. Involves understanding subject
            rights and consent requirements, implementing protection controls, conducting impact assessments, developing comprehensive
            frameworks, establishing governance oversight, and leading enhancement initiatives across the organisation.
          levels:
            entry:
              id: data-protection-compliance-entry
              name: Entry Level
              skills:
              - Identifies relevant data protection regulations (e.g. UK GDPR, DPA 2018)
              - Describes data subject rights and regulatory consent obligations
              - Can implement basic data protection controls (e.g. pseudonymisation, access controls)
              qualifications:
              - issuer: IAPP
                description: IAPP Certified Information Privacy Professional/Europe (CIPP/E) (Exam)
                career_impact: Essential baseline understanding of UK GDPR and DPA 2018.
              core_concepts:
              - topic: Foundations of GDPR and DPA 2018
                concepts:
                - UK GDPR
                - DPA 2018
                - Data Subject Rights
                - Pseudonymisation
                search_terms:
                - UK GDPR health data
                - Pseudonymisation SDE techniques
                why: Entry-level personnel must recognize regulatory obligations and apply basic privacy controls to health
                  data.
            mid:
              id: data-protection-compliance-mid
              name: Mid Level
              skills:
              - Implements comprehensive data protection frameworks (e.g. Data Protection Impact Assessments (DPIAs), privacy
                by design).
              - Conducts Data Protection Impact Assessments (DPIAs)
              - Ensures systems comply with data protection requirements
              qualifications:
              - issuer: IAPP
                description: IAPP Certified Information Privacy Manager (CIPM) (Exam)
                career_impact: Operationalizing privacy programs within the SDE.
              core_concepts:
              - topic: Implementing DPIAs in Healthcare
                concepts:
                - Data Protection Impact Assessments (DPIA)
                - Privacy by Design
                - Health Data Consent Models
                search_terms:
                - DPIA template NHS
                - Privacy by design healthcare SDE
                why: Mid-level roles require hands-on creation of DPIAs to evaluate privacy risks before new SDE tools are
                  deployed.
            senior:
              id: data-protection-compliance-senior
              name: Senior Level
              skills:
              - Develops enterprise data protection strategies
              - Establishes data protection governance and oversight
              - Leads data protection enhancement initiatives (e.g. organisation-wide training, new privacy technologies).
              qualifications:
              - issuer: IAPP
                description: Fellow of Information Privacy (FIP) (Designation)
                career_impact: Recognized leader in data privacy strategy for highly sensitive domains.
              core_concepts:
              - topic: Strategic Data Protection Governance
                concepts:
                - Privacy Enhancing Technologies (PETs)
                - Enterprise Data Protection Strategy
                - Regulatory Liaison
                search_terms:
                - PETs in Secure Data Environments
                - Data protection strategy NHS
                why: Senior practitioners must lead organization-wide enhancement initiatives and introduce advanced privacy
                  technologies to protect health records.
        healthcare-standards-compliance:
          id: healthcare-standards-compliance
          name: Healthcare Standards Compliance
          description: Ensures adherence to healthcare-specific regulatory standards such as DSPT and NHS DTAC. Involves implementing
            compliance frameworks, conducting assessments, ensuring systems meet regulatory requirements, developing enterprise
            strategies, establishing governance programmes, and leading standards compliance initiatives.
          levels:
            entry:
              id: healthcare-standards-compliance-entry
              name: Entry Level
              skills:
              - Identifies relevant healthcare standards (e.g. DSPT, NHS DTAC) and their requirements
              - Describes healthcare compliance requirements and operational standards
              - Can implement basic healthcare compliance controls
              qualifications: []
              core_concepts:
              - topic: Introduction to DSPT and DTAC
                concepts:
                - DSPT (Data Security and Protection Toolkit)
                - NHS DTAC
                search_terms:
                - NHS DSPT requirements
                - Digital Technology Assessment Criteria NHS
                why: Provides the required baseline knowledge to operate within the stringent compliance boundaries of the
                  NHS.
            mid:
              id: healthcare-standards-compliance-mid
              name: Mid Level
              skills:
              - Implements healthcare standards compliance frameworks
              - Conducts healthcare compliance assessments
              - Ensures systems meet healthcare regulatory requirements
              qualifications:
              - issuer: NHS
                description: NHS Digital DSPT (Data Security and Protection Toolkit) Administrator (Practical)
                career_impact: Directly applicable to ensuring the SDE meets mandatory NHS security requirements.
              core_concepts:
              - topic: Healthcare Standards Assessment
                concepts:
                - Compliance Frameworks
                - Regulatory Assessments
                - DSPT Evidence Gathering
                search_terms:
                - Conducting DSPT assessment
                - NHS DTAC compliance process
                why: Required to actively evaluate and ensure SDE tools and platforms meet strict UK healthcare technology
                  standards.
            senior:
              id: healthcare-standards-compliance-senior
              name: Senior Level
              skills:
              - Develops enterprise healthcare compliance strategies
              - Establishes healthcare compliance governance programmes
              - Leads healthcare standards compliance initiatives
              qualifications:
              - issuer: PECB / BSI
                description: ISO 27799:2016 Lead Implementer (Exam)
                career_impact: Specialized ISO standard for health informatics security management.
              core_concepts:
              - topic: Enterprise Healthcare Compliance Strategy
                concepts:
                - Governance Programmes
                - Cross-system Interoperability Compliance
                - Strategic Alignment
                search_terms:
                - Enterprise NHS compliance strategy
                - SDE cross-border health standards
                why: Senior leaders develop and maintain the overarching compliance strategies that integrate complex SDEs
                  into the broader healthcare ecosystem.
        healthcare-data-security-frameworks:
          id: healthcare-data-security-frameworks
          name: Healthcare Data Security Frameworks
          description: Implements specialised security controls required for protecting healthcare data. Involves understanding
            healthcare-specific frameworks like DSPT and NHS DTAC, implementing compliance controls, conducting assessments,
            ensuring regulatory requirements are met, developing strategies, and establishing governance oversight specific
            to healthcare environments.
          levels:
            entry:
              id: healthcare-data-security-frameworks-entry
              name: Entry Level
              skills:
              - Identifies basic healthcare data security frameworks (e.g. DSPT, NHS DTAC)
              - Outlines healthcare-specific compliance obligations and information governance controls
              - Can follow established healthcare compliance procedures (e.g. incident reporting, access reviews)
              qualifications: []
              core_concepts:
              - topic: Basic SDE Security Frameworks
                concepts:
                - DSPT Baseline
                - Incident Reporting Protocols
                - Access Reviews
                search_terms:
                - NHS incident reporting data security
                - Access review process SDE
                why: Understanding basic healthcare security controls and compliance procedures is essential for day-to-day
                  operations in an SDE.
            mid:
              id: healthcare-data-security-frameworks-mid
              name: Mid Level
              skills:
              - Implements healthcare compliance controls and processes (e.g. encryption, audit logging)
              - Conducts healthcare compliance assessments
              - Ensures systems meet healthcare regulatory requirements
              qualifications:
              - issuer: Various
                description: ISO/IEC 27001 Lead Implementer (Exam)
                career_impact: Implementing the core Information Security Management System (ISMS) required for almost all
                  TREs.
              core_concepts:
              - topic: Implementing SDE Controls
                concepts:
                - Encryption in Transit/Rest
                - Audit Logging Strategies
                - Compliance Validation
                search_terms:
                - Healthcare data encryption standards
                - Audit logging best practices SDE
                why: Ensures that the technical controls required by health frameworks (like DSPT) are correctly engineered
                  and maintained.
            senior:
              id: healthcare-data-security-frameworks-senior
              name: Senior Level
              skills:
              - Develops healthcare compliance strategies and frameworks
              - Establishes healthcare compliance governance and oversight
              - Leads healthcare standards compliance initiatives
              qualifications:
              - issuer: Various
                description: ISO/IEC 27001 Lead Auditor (Exam)
                career_impact: Validating and auditing the enterprise-wide security framework compliance.
              core_concepts:
              - topic: Advanced Health Data Security Strategies
                concepts:
                - Framework Architecture
                - Governance Oversight
                - Security Maturity Programs
                search_terms:
                - Designing secure data environments NHS
                - Healthcare security maturity framework
                why: Crucial for establishing the architectural and governance mechanisms that ensure the entire SDE remains
                  secure and compliant over time.
        ethics-research-approval-systems:
          id: ethics-research-approval-systems
          name: Ethics & Research Approval Systems
          description: Manages systems and processes for ensuring research meets ethical standards and approval requirements.
            Involves understanding ethical review processes, preparing documentation for submissions, implementing tracking
            systems, ensuring compliance with approvals, and developing strategies to enhance ethical governance across the
            research environment.
          levels:
            entry:
              id: ethics-research-approval-systems-entry
              name: Entry Level
              skills:
              - Outlines ethical review requirements and research approval workflows
              - Prepares standard ethical review submissions and IRAS documentation
              - Can assist with preparing submissions for ethical approval (e.g. drafting consent forms, compiling supporting
                documents)
              qualifications: []
              core_concepts:
              - topic: Research Approval Basics
                concepts:
                - IRAS Documentation
                - Ethical Review Requirements
                - Consent Form Drafting
                search_terms:
                - Integrated Research Application System (IRAS) basics
                - NHS research ethics consent form
                why: Entry staff need to understand how researchers request access to data and how to process initial ethical
                  documentation.
            mid:
              id: ethics-research-approval-systems-mid
              name: Mid Level
              skills:
              - Implements systems for tracking ethical approvals and requirements (e.g. electronic tracking tools, spreadsheets)
              - Ensures research activities comply with ethical approvals
              - Conducts ethics compliance reviews and assessments
              qualifications:
              - issuer: HRA
                description: IRB / REC Administration Certification (Course)
                career_impact: Understanding the Health Research Authority (HRA) approval workflows.
              core_concepts:
              - topic: Tracking & Compliance for Approvals
                concepts:
                - Electronic Tracking Tools
                - Ethics Compliance Reviews
                - Study Protocol Alignment
                search_terms:
                - Research approval tracking SDE
                - Ethics compliance assessment health data
                why: Required to manage ongoing research projects and ensure their actions align with the approved ethical
                  constraints within the SDE.
            senior:
              id: ethics-research-approval-systems-senior
              name: Senior Level
              skills:
              - Develops ethical compliance strategies and frameworks
              - Establishes ethics governance and oversight processes
              - Leads initiatives to enhance ethical compliance
              qualifications: []
              core_concepts:
              - topic: Enterprise Ethical Governance Strategy
                concepts:
                - Ethical Governance Process Design
                - Oversight Frameworks
                - Enhancement Initiatives
                search_terms:
                - Enterprise research ethics governance NHS
                - Streamlining ethics approvals SDE
                why: Needed to build robust, scalable systems that balance the speed of research with rigid ethical oversight.
